        (function () {
          const items = [].slice.call(document.querySelectorAll(".sn-item"));
          const sections = [].slice.call(document.querySelectorAll("main section[id]"));
          if (!items.length || !sections.length) return;

          function setActive(id) {
            items.forEach((a) => a.classList.toggle("active", a.dataset.sn === id));
          }

          if ("IntersectionObserver" in window) {
            const io = new IntersectionObserver(
              (entries) => {
                entries.forEach((en) => {
                  if (en.isIntersecting) setActive(en.target.id);
                });
              },
              { rootMargin: "-45% 0px -50% 0px", threshold: 0 },
            );
            sections.forEach((s) => io.observe(s));
          } else {
            window.addEventListener(
              "scroll",
              () => {
                let current = sections[0].id;
                const y = window.scrollY + window.innerHeight * 0.35;
                sections.forEach((s) => {
                  if (s.offsetTop <= y) current = s.id;
                });
                setActive(current);
              },
              { passive: true },
            );
          }

        if (!isTouch && !reduced) {
          document.documentElement.classList.add("has-cursor");
          const dot = document.getElementById("cDot"),
            ring = document.getElementById("cRing"),
            label = document.getElementById("cLabel");
          let mx = window.innerWidth / 2,
            my = window.innerHeight / 2;
          let rx = mx,
            ry = my;

          window.addEventListener(
            "mousemove",
            (e) => {
              mx = e.clientX;
              my = e.clientY;
              dot.style.left = mx + "px";
              dot.style.top = my + "px";
            },
            { passive: true },
          );

          (function rl() {
            rx += (mx - rx) * 0.16;
            ry += (my - ry) * 0.16;
            ring.style.left = rx + "px";
            ring.style.top = ry + "px";
            requestAnimationFrame(rl);
          })();

          document.addEventListener("mouseover", (e) => {
            const lab = e.target.closest("[data-cursor]");
            const hov = e.target.closest("a,button,.chip,.tk-item");
            if (lab) {
              ring.classList.add("is-label");
              ring.classList.remove("is-hover");
              label.textContent = lab.dataset.cursor;
            } else if (hov) {
              ring.classList.add("is-hover");
              ring.classList.remove("is-label");
            } else {
              ring.classList.remove("is-hover", "is-label");
            }
          });
        }

        /* ================= MAGNETIC ================= */
        if (!isTouch && !reduced && hasGSAP) {
          document.querySelectorAll(".magnetic").forEach((el) => {
            el.addEventListener("mousemove", (e) => {
              const r = el.getBoundingClientRect();
              gsap.to(el, {
                x: (e.clientX - r.left - r.width / 2) * 0.28,
                y: (e.clientY - r.top - r.height / 2) * 0.28,
                duration: 0.4,
                ease: "power3.out",
              });
            });
            el.addEventListener("mouseleave", () => {
              gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: "elastic.out(1, 0.4)" });
            });
          });
        }

        /* ================= WORK PREVIEW ================= */
        if (!isTouch && !reduced && hasGSAP) {
          const pv = document.getElementById("pv");
          if (pv) {
            const slides = pv.querySelectorAll(".pv-slide");
            let shown = false;
            const px = gsap.quickTo(pv, "x", { duration: 0.55, ease: "power3" });
            const py = gsap.quickTo(pv, "y", { duration: 0.55, ease: "power3" });
            gsap.set(pv, { scale: 0.92, opacity: 0, transformOrigin: "center" });

            document.querySelectorAll(".work[data-project]").forEach((row) => {
              row.addEventListener("mouseenter", (e) => {
                slides.forEach((s) => s.classList.remove("active"));
                const s = slides[+row.dataset.project];
                if (s) s.classList.add("active");
                if (!shown) {
                  shown = true;
                  gsap.set(pv, { x: e.clientX + 30, y: e.clientY - 120 });
                  gsap.to(pv, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" });
                }
              });
              row.addEventListener("mousemove", (e) => {
                px(e.clientX + 30);
                py(e.clientY - 120);
                gsap.to(pv, { rotation: clamp((e.movementX || 0) * 0.12, -5, 5), duration: 0.4 });
              });
              row.addEventListener("mouseleave", () => {
                shown = false;
                gsap.to(pv, {
                  opacity: 0,
                  scale: 0.92,
                  rotation: 0,
                  duration: 0.35,
                  ease: "power3.in",
                });
              });
            });
          }
        }
      })();

        right: var(--page-pad);
        font-family: var(--font-mono);
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        border: 2px solid var(--paper);
        padding: 0.55rem 0.9rem;
      }
      .menu-close:hover {
        background: var(--pink);
        border-color: var(--pink);
        color: #fff;
      }

      /* ---------- MARQUEE ---------- */
      .marquee {
        overflow: hidden;
        border-block: 3px solid var(--ink);
        position: relative;
        z-index: 2;
      }
      .m-lime {
        background: var(--lime);
        color: var(--ink);
      }
      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }

      /* ---------- SECTION SCAFFOLD ---------- */
      section {
        position: relative;
      }
      .sec-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.2rem;
        flex-wrap: wrap;
        margin-bottom: clamp(1.5rem, 3.5vw, 2.6rem);
      }
      .kicker {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }
      .kicker::before {
        content: "";
        width: 34px;
        height: 3px;
        background: currentColor;
      }

      /* ---------- REVEALS ---------- */
      html.js .rv {
        opacity: 0;
        translate: 0 26px;
      }
      html.js .rv-l {
        opacity: 0;
        translate: -40px 0;
      }
      html.js .rv-r {
        opacity: 0;
        translate: 40px 0;
      }
      html.js .rv-pop {
        opacity: 0;
        scale: 0.92;
      }
      html.js .rv.on,
      html.js .rv-l.on,
      html.js .rv-r.on,
      html.js .rv-pop.on {
        animation: rvIn 0.75s var(--ease) both;
      }
      @keyframes rvIn {
        to {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }

      /* ============================================================ HERO */
      .hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-top: 5.5rem;
        padding-bottom: clamp(2rem, 6vh, 4rem); /* <-- ADDED: pushes everything up */
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 18%, rgba(39, 69, 255, 0.28), transparent 42%),
          radial-gradient(circle at 12% 82%, rgba(255, 45, 126, 0.16), transparent 40%), var(--ink);
      }
      .hero::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 55%;
        pointer-events: none;
        background-image: radial-gradient(rgba(245, 244, 239, 0.09) 1.3px, transparent 1.3px);
        background-size: 16px 16px;
        -webkit-mask-image: linear-gradient(115deg, #000 0%, transparent 55%);
        mask-image: linear-gradient(115deg, #000 0%, transparent 55%);
      }
      /* background line: outlined SOFTWARE × SYSTEMS × BACKEND band behind the hero */
      .hero-watermark {
        position: absolute;
        top: 6%;
        left: 0;
        right: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .hero-watermark .wm-track {
        display: flex;
        width: max-content;
        animation: marquee 40s linear infinite;
      }
      .hero-watermark span {
        font-family: var(--font-display);
        text-transform: uppercase;
        white-space: nowrap;
        font-size: clamp(6rem, 20vw, 18rem);
        line-height: 1;
        padding-right: 3rem;
        color: transparent;
        -webkit-text-stroke: 2px rgba(245, 244, 239, 0.12);
      }
      .hero-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1.5fr 0.9fr;
        gap: 1.6rem;
        align-items: end;
        width: min(var(--content-max), 100% - 2 * var(--page-pad));
        margin-inline: auto;
      }
      .hero-topline {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: center;
        margin-bottom: clamp(1.1rem, 2.6vw, 2rem);
      }
      .hero-name {
        font-size: clamp(4rem, 15vw, 14rem);
        color: var(--paper);
        position: relative;
      }
      .hero-name .row {
        display: block;
      }
      .hero-name .row-2 {
        color: transparent;
        -webkit-text-stroke: 3px var(--cyan);
        margin-left: clamp(0.6rem, 6vw, 6rem);
      }
      @supports not (-webkit-text-stroke: 3px black) {
        .hero-name .row-2 {
          color: var(--cyan);
        }
      }
      .hero-name .reg-badge {
        position: absolute;
        top: -0.2em;
        right: clamp(0rem, 4vw, 4rem);
        font-size: 0.16em;
        font-family: var(--font-mono);
        letter-spacing: 0.1em;
        background: var(--pink);
        color: #fff;
        border: 3px solid var(--ink);
        padding: 0.5em 0.9em;
        transform: rotate(6deg);
        box-shadow: 5px 5px 0 var(--ink);
      }
      .role-sticker {
        position: relative;
        z-index: 3;
        margin: -0.55em 0 1.2rem clamp(0rem, 2vw, 1.5rem);
        width: max-content;
        max-width: 92%;
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1.25rem, 3.2vw, 2.4rem);
        line-height: 1;
        background: var(--lime);
        color: var(--ink);
        border: var(--bd);
        padding: 0.5em 0.8em;
        box-shadow: 8px 8px 0 var(--pink);
        transform: rotate(-2deg);
      }
      .hero-side {
        display: flex;
        flex-direction: column;
        align-items: center;                 /* centres both the band and the buttons */
        gap: clamp(1rem, 2vw, 1.6rem);
        width: 100%;
        align-self: end;                     /* keeps the stack sitting low */
      }
      .hero-copy {
        max-width: 54ch;
        font-size: clamp(0.95rem, 1.3vw, 1.1rem);
        color: rgba(245, 244, 239, 0.82);
        margin-bottom: 1.3rem;
      }
      .hero-copy b {
        color: var(--cyan);
        font-weight: 700;
      }
      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: clamp(1.4rem, 3vw, 2.2rem);
      }
      .hero-cta .btn {
        --shc: var(--pink);
      }
      .hero-cta .btn-ghost {
        color: var(--paper);
        border-color: var(--paper);
        box-shadow: 6px 6px 0 rgba(245, 244, 239, 0.25);
      }
      .hero-cta .btn-ghost:hover {
        background: var(--paper);
        color: var(--ink);
      }
      .hero-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        background: var(--paper);
        border: 3px solid var(--paper);
        width: 100%;
        max-width: 560px;
        justify-self: end;
        align-self: center;
        margin-bottom: clamp(1.4rem, 3vw, 2.4rem);
      }
      .hero-stats > div {
        background: var(--ink);
        padding: 0.85rem 1rem 0.8rem;
      }
      .hero-stats b {
        font-family: var(--font-display);
        font-size: clamp(1.5rem, 3vw, 2.3rem);
        display: block;
        line-height: 1;
        color: var(--sc, var(--lime));
      }
      .hero-stats span {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.55);
      }
      /* NOTE: the old rule here was ".hero-stats {.ttt-board {" - a stray brace that left this
         media query open and pushed every rule below it (the whole game and the sections after the
         hero) into max-width:760px only. Removed. */

      /* ============================================================ HERO TIC-TAC-TOE
         .hero-game stacks stats and a game panel in the same box. Playing grows the box to
         --ttt-h so the board gets a proper size, and fades the stats out. */
      .hero-game {
        --ttt-h: clamp(360px, 40vw, 440px);
        --ttt-side: min(100%, calc(var(--ttt-h) - 7.6rem));
        position: relative;
        width: 100%;
        max-width: 560px;
        justify-self: end;
        align-self: center;
        margin-bottom: clamp(1.4rem, 3vw, 2.4rem);
        z-index: 2;
        transition: min-height 0.55s cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      .hero-game.is-playing { min-height: var(--ttt-h); }
      .hero-game .hero-stats {
        max-width: none;
        margin-bottom: 0;
        justify-self: stretch;
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 0.8, 0.24, 1),
          filter 0.45s ease, visibility 0s linear 0s;
      }
      .hero-game.is-playing .hero-stats {
        opacity: 0;
        transform: scale(0.94);
        filter: blur(6px);
        visibility: hidden;
        pointer-events: none;
        transition-delay: 0s, 0s, 0s, 0.45s;
      }
      .ttt-play {
        position: absolute;
        top: -16px;
        right: -12px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 0.4em;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--lime);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        padding: 0.45em 0.9em;
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
        transform: rotate(3deg);
        transition: transform 0.25s cubic-bezier(0.22, 0.8, 0.24, 1), opacity 0.4s ease;
        animation: tttWiggle 3.2s ease-in-out infinite;
      }
      .ttt-play:hover { transform: rotate(0deg) scale(1.06); }
      .ttt-play:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
      .hero-game.is-playing .ttt-play { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes tttWiggle {
        0%, 70%, 100% { transform: rotate(3deg); }
        78% { transform: rotate(-4deg); }
        86% { transform: rotate(5deg); }
        92% { transform: rotate(-2deg); }
      }

      .ttt-panel {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.04);
        transition: opacity 0.45s ease 0.06s, transform 0.5s cubic-bezier(0.22, 0.8, 0.24, 1) 0.06s,
          visibility 0s linear 0.5s;
      }
      .hero-game.is-playing .ttt-panel {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: none;
        transition-delay: 0.06s, 0.06s, 0s;
      }
      .ttt-hud {
        display: flex;
        gap: 3px;
        width: var(--ttt-side);
        background: var(--paper);
        border: 3px solid var(--paper);
      }
      .ttt-score {
        flex: 1;
        background: var(--ink);
        padding: 0.35rem 0.4rem 0.3rem;
        text-align: center;
        font-family: var(--font-mono);
        font-size: 0.55rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.55);
        transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
      }
      .ttt-score b {
        display: block;
        font-family: var(--font-display);
        font-size: 1.15rem;
        font-weight: 400;
        line-height: 1.1;
        letter-spacing: 0;
        color: var(--c, var(--paper));
      }
      .ttt-score.is-turn {
        background: #15151c;
        color: var(--paper);
        box-shadow: inset 0 -3px 0 var(--c, var(--paper));
      }
      .ttt-board {
        position: relative;
        width: var(--ttt-side);
        aspect-ratio: 1;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        gap: 3px;
        background: var(--paper);
        border: 3px solid var(--paper);
        box-shadow: 6px 6px 0 var(--pink);
      }
      .ttt-cell {
        position: relative;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: var(--ink);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.15s ease;
      }
      .ttt-cell:disabled { cursor: default; }
      .ttt-cell:not(:disabled):hover,
      .ttt-cell:focus-visible { background: #1b1b24; }
      .ttt-cell:focus-visible { outline: 3px solid var(--lime); outline-offset: -3px; }
      .ttt-cell:not(:disabled)::before {
        content: "X";
        font-family: var(--font-display);
        font-size: clamp(1.6rem, 5vw, 2.6rem);
        color: var(--lime);
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .ttt-board:not(.is-wait) .ttt-cell:not(:disabled):hover::before { opacity: 0.22; }
      .ttt-board.is-wait .ttt-cell { cursor: progress; }
      .ttt-mark {
        width: 56%;
        height: 56%;
        overflow: visible;
        fill: none;
        stroke-width: 5;
        stroke-linecap: square;
      }
      .ttt-mark > * { stroke-dasharray: 1; }
      .ttt-cell[data-m="X"] .ttt-mark { stroke: var(--lime); }
      .ttt-cell[data-m="O"] .ttt-mark { stroke: var(--cyan); }
      .ttt-cell.mark-in .ttt-mark > * { animation: tttDraw 0.32s cubic-bezier(0.5, 0, 0.2, 1) both; }
      .ttt-cell.is-win { background: #1d1d27; }
      .ttt-cell.is-win .ttt-mark { stroke: var(--pink); }
      @keyframes tttDraw {
        from { stroke-dashoffset: 1; opacity: 0; }
        8% { opacity: 1; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      .ttt-strike {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .ttt-strike line {
        stroke: var(--paper);
        stroke-width: 3;
        stroke-linecap: square;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
      }
      .ttt-strike.is-on line { animation: tttDraw 0.45s cubic-bezier(0.5, 0, 0.2, 1) 0.12s forwards; }
      .ttt-status {
        min-height: 1rem;
        font-family: var(--font-mono);
        font-size: 0.64rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        color: rgba(245, 244, 239, 0.7);
      }
      .ttt-status.is-win { color: var(--lime); }
      .ttt-status.is-lose { color: var(--pink); }
      .ttt-actions { display: flex; gap: 0.6rem; }
      .ttt-btn {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--paper);
        background: transparent;
        border: 2px solid var(--paper);
        padding: 0.55em 0.9em;
        box-shadow: 3px 3px 0 rgba(245, 244, 239, 0.25);
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease,
          color 0.15s ease;
      }
      .ttt-btn:hover { background: var(--paper); color: var(--ink); }
      .ttt-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(245, 244, 239, 0.25); }
      .ttt-btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }

      .ttt-win {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: rgba(10, 10, 14, 0.84);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.35s ease, visibility 0s linear 0.35s;
      }
      .ttt-win.is-shown {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition-delay: 0s;
      }
      .ttt-win a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        font-family: var(--font-display);
        font-size: clamp(1.1rem, 2.6vw, 1.6rem);
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--yellow);
        border: 3px solid var(--ink);
        box-shadow: 6px 6px 0 var(--pink);
        padding: 1rem 1.6rem;
        text-decoration: none;
        transform: scale(0.85) rotate(-2deg);
        animation: tttGift 0.55s cubic-bezier(0.22, 1.4, 0.4, 1) 0.1s both,
          tttFloat 2.6s ease-in-out 0.65s infinite;
      }
      .ttt-win a:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
      .ttt-win a span {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        color: rgba(7, 9, 13, 0.6);
      }
      @keyframes tttGift {
        from { transform: scale(0.4) rotate(-10deg); opacity: 0; }
        to { transform: scale(1) rotate(-2deg); opacity: 1; }
      }
      @keyframes tttFloat {
        0%, 100% { transform: scale(1) rotate(-2deg) translateY(0); }
        50% { transform: scale(1) rotate(-2deg) translateY(-6px); }
      }
      .ttt-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .ttt-confetti i {
        position: absolute;
        left: 50%;
        top: 46%;
        width: var(--s);
        height: var(--s);
        background: var(--c);
        animation: tttBurst 0.95s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
      }
      @keyframes tttBurst {
        to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
      }
      @media (max-width: 760px) {
        .ttt-play { top: -14px; right: 0; font-size: 0.56rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ttt-play, .ttt-win a { animation: none; }
        .ttt-win a { transform: none; }
        .ttt-cell.mark-in .ttt-mark > *, .ttt-strike.is-on line { animation-duration: 0.01s; animation-delay: 0s; }
        .ttt-confetti { display: none; }
        .hero-game, .hero-game .hero-stats, .ttt-panel { transition-duration: 0.01s; }
      }

      .hero-card {
        position: relative;
        border: 3px solid var(--paper);
        background: var(--ink-2);
        box-shadow: 10px 10px 0 var(--blue);
        transform: rotate(1.5deg);
        margin-bottom: clamp(1.4rem, 3vw, 2.4rem);
        align-self: end;
        width: 100%;
      }
      .hero-card .hc-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--paper);
        color: var(--ink);
        padding: 0.55rem 0.9rem;
        border-bottom: 3px solid var(--ink);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .hero-card dl {
        padding: 0.9rem 0.9rem 0.5rem;
        display: grid;
        gap: 0.5rem;
      }
      .hero-card .hr {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px dashed rgba(245, 244, 239, 0.22);
        padding-bottom: 0.45rem;
      }
      .hero-card dt {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.55);
      }
      .hero-card dd {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: right;
      }
      .hero-card .on {
        color: var(--lime);
      }
      .burst {
        position: absolute;
        top: -54px;
        right: -26px;
        width: 112px;
        height: 112px;
        z-index: 4;
        animation: spin 22s linear infinite;
      }
      .burst polygon {
        fill: var(--yellow);
        stroke: var(--ink);
        stroke-width: 4;
      }
      .burst text {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1px;
        fill: var(--ink);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(7px);
        }
      }
      @media (max-width: 900px) {
        .hero-grid {
          grid-template-columns: 1fr;
        }
        .hero-card {
          max-width: 440px;
          transform: rotate(0);
        }
        .burst {
          top: -46px;
          right: -8px;
          width: 94px;
          height: 94px;
        }
      }

      /* ============================================================ ABOUT */
      .sec-about {
        background: var(--lime);
        color: var(--ink);
        overflow: hidden;
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        --focus: var(--ink);
      }
      .sec-about .ghost-num {
        color: var(--ink);
        top: -2.5rem;
        right: -1rem;
        font-size: clamp(8rem, 24vw, 20rem);
      }
      .about-rail {
        position: absolute;
        left: 0.6rem;
        top: 50%;
        transform: translateY(-50%) rotate(180deg);
        writing-mode: vertical-rl;
        font-family: var(--font-mono);
        font-size: 0.64rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      .about-title {
        font-size: clamp(2.5rem, 7vw, 6.2rem);
        max-width: 16ch;
        position: relative;
        z-index: 2;
      }
      .about-title em {
        font-family: var(--font-serif);
        font-style: italic;
        text-transform: none;
        letter-spacing: 0;
      }

      /* ---- both columns span the same height: title+copy left, photo+card right ---- */
      .about-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: clamp(1.6rem, 4vw, 3.5rem);
        margin-top: clamp(1.6rem, 3.5vw, 2.8rem);
        position: relative;
        z-index: 2;
        align-items: stretch; /* equal-height columns */
      }
      .about-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .about-main .kicker {
        margin-bottom: 0.9rem;
      }
      .about-main .about-title {
        margin-bottom: clamp(1.2rem, 2.5vw, 2rem);
      }
      .about-main .about-copy {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .about-main .about-copy p:last-child {
        margin-bottom: 0;
      }
      .about-copy p {
        margin-bottom: 1.1rem;
        max-width: 62ch;
        font-size: clamp(0.95rem, 1.15vw, 1.05rem);
        color: rgba(10, 10, 14, 0.88);
      }
      .about-copy .looking {
        border-left: 6px solid var(--ink);
        padding: 0.35rem 0 0.35rem 1.2rem;
        font-family: var(--font-serif);
        font-style: italic;
        font-size: clamp(1.1rem, 1.7vw, 1.45rem);
        line-height: 1.35;
        margin: 1.5rem 0;
      }
      .about-copy .signoff {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* right column - photo fills whatever height the left column sets, ID card sits under it */
      .about-side {
        display: flex;
        flex-direction: column;
        align-self: stretch;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
      }

      /* the photo: flexes to fill the column; image is cropped (not stretched) to fit */
      .portrait {
        margin: 0;
        border: var(--bd);
        background: var(--paper);
        box-shadow: 10px 10px 0 var(--ink);
        transform: rotate(-1.2deg);
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 300px;
      }
      .p-img {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      .p-img img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 22%;
        display: block;
      }

      .id-card {
        border: var(--bd);
        background: var(--paper);
        box-shadow: 10px 10px 0 var(--ink);
        transform: rotate(1.2deg);
        margin: 0;
      }
      .id-card .idh {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        background: var(--ink);
        color: var(--lime);
        padding: 0.65rem 1rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: 1rem;
        letter-spacing: 0.05em;
      }
      .id-card .idh .yv {
        width: 36px;
        height: 36px;
        background: var(--lime);
        color: var(--ink);
        display: grid;
        place-items: center;
        font-size: 1rem;
        border: 2px solid var(--paper);
      }
      .id-card dl {
        padding: 0.5rem 0;
      }
      .id-card .hr {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.58rem 1rem;
        border-bottom: 2px dashed rgba(10, 10, 14, 0.2);
      }
      .id-card .hr:last-child {
        border-bottom: none;
      }
      .id-card dt {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.6;
        padding-top: 0.2rem;
      }
      .id-card dd {
        font-weight: 700;
        text-align: right;
        font-size: 0.92rem;
      }
      .id-card .open {
        color: var(--pink);
      }
      .tag {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 2px solid var(--ink);
        padding: 0.42rem 0.8rem;
        background: transparent;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.15s;
      }
      .tag:hover {
        background: var(--ink);
        color: var(--lime);
        transform: rotate(-2deg);
      }
      @media (max-width: 900px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
        .about-rail {
          display: none;
        }
        .id-card {
          transform: none;
        }
        .portrait {
          transform: none;
          flex: none;
          min-height: 0;
        }
        .p-img {
          aspect-ratio: 4/5;
          flex: none;
        }
      }

      /* ============================================================ PROCESS */
      .sec-process {
        background: var(--ink-2);
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        overflow: hidden;
      }
      .sec-process .ghost-num {
        color: var(--paper);
        bottom: -3rem;
        left: -1.5rem;
        font-size: clamp(8rem, 22vw, 18rem);
        -webkit-text-stroke-color: rgba(245, 244, 239, 0.5);
      }
      .process-title {
        font-size: clamp(2.3rem, 6vw, 5.2rem);
        color: var(--paper);
      }
      .process-title .hl {
        color: var(--violet);
      }
      .process-note {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.55);
        max-width: 46ch;
        margin-top: 0.8rem;
      }
      .moves {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(1rem, 2.5vw, 2rem);
        margin-top: clamp(1.8rem, 4vw, 3rem);
        position: relative;
        z-index: 2;
      }
      .move {
        border: 3px solid var(--paper);
        padding: clamp(1.3rem, 2.6vw, 2rem);
        position: relative;
        background: var(--ink);
        box-shadow: 9px 9px 0 var(--mc);
        transform: rotate(var(--r, 0deg));
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s var(--ease);
      }
      .move:hover {
        transform: rotate(0deg) translate(-4px, -4px);
        box-shadow: 14px 14px 0 var(--mc);
      }
      .move:nth-child(1) {
        --mc: var(--cyan);
        --r: -1deg;
      }
      .move:nth-child(2) {
        --mc: var(--lime);
        --r: 1deg;
        margin-top: 1.8rem;
      }
      .move:nth-child(3) {
        --mc: var(--yellow);
        --r: 1.2deg;
        margin-top: -1rem;
      }
      .move:nth-child(4) {
        --mc: var(--pink);
        --r: -1.4deg;
        margin-top: 0.8rem;
      }
      .move .mv-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.8rem;
      }
      .move .mv-num {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--mc);
        letter-spacing: 0.1em;
      }
      .move .mv-star {
        color: var(--mc);
        font-size: 1.3rem;
      }
      .move h3 {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1.6rem, 2.8vw, 2.3rem);
        color: var(--paper);
        margin-bottom: 0.7rem;
      }
      .move p {
        color: rgba(245, 244, 239, 0.75);
        font-size: 0.93rem;
        max-width: 48ch;
      }
      @media (max-width: 760px) {
        .moves {
          grid-template-columns: 1fr;
        }
        .move {
          margin-top: 0 !important;
        }
      }

      /* ============================================================ WORK */
      .sec-work {
        background: var(--ink);
        padding-top: clamp(2.8rem, 6vw, 5rem);
      }
      .work-head {
        padding-bottom: clamp(1.4rem, 3vw, 2.2rem);
      }
      .work-title {
        font-size: clamp(2.8rem, 8.5vw, 8rem);
        color: var(--paper);
      }
      .work-title .hollow {
        color: transparent;
        -webkit-text-stroke: 2px var(--orange);
      }
      @supports not (-webkit-text-stroke: 2px black) {
        .work-title .hollow {
          color: var(--orange);
        }
      }
      .work-note {
        color: rgba(245, 244, 239, 0.6);
        max-width: 48ch;
        margin-top: 0.9rem;
      }

      .proj {
        position: relative;
      }
      .proj-1 {
        padding: clamp(1.2rem, 2.6vw, 2.2rem) 0 clamp(2.2rem, 4.5vw, 3.5rem);
        overflow: hidden;
      }
      .proj-1 .poster {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: clamp(1.4rem, 3.5vw, 3.5rem);
        background: var(--cyan);
        color: var(--ink);
        border: var(--bd);
        box-shadow: 14px 14px 0 var(--blue);
        padding: clamp(1.4rem, 3.5vw, 2.8rem);
        position: relative;
        --focus: var(--ink);
      }
      .proj-1 .poster::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        width: 42%;
        height: 46%;
        pointer-events: none;
        background-image: radial-gradient(rgba(10, 10, 14, 0.35) 1.4px, transparent 1.4px);
        background-size: 13px 13px;
        -webkit-mask-image: linear-gradient(45deg, transparent, #000 60%);
        mask-image: linear-gradient(45deg, transparent, #000 60%);
      }
      .p-index {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 3px solid currentColor;
        padding-bottom: 0.6rem;
        margin-bottom: 1.2rem;
      }
      .p-title {
        font-size: clamp(2.3rem, 5.5vw, 5rem);
        position: relative;
        z-index: 2;
      }
      .p-title .serif-word {
        font-family: var(--font-serif);
        font-style: italic;
        text-transform: none;
      }
      .p-desc {
        margin: 1.1rem 0 1.3rem;
        max-width: 58ch;
        font-size: 0.97rem;
        color: rgba(10, 10, 14, 0.85);
        position: relative;
        z-index: 2;
      }
      .p-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 1.3rem;
        position: relative;
        z-index: 2;
      }
      .stat-tile {
        border: var(--bd);
        background: var(--paper);
        padding: 0.65rem 0.95rem;
        box-shadow: 5px 5px 0 var(--ink);
        transform: rotate(var(--r, -1deg));
      }
      .stat-tile b {
        font-family: var(--font-display);
        font-size: clamp(1.4rem, 2.8vw, 2.2rem);
        display: block;
        line-height: 1;
      }
      .stat-tile span {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .p-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 2;
      }
      .p-tag {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 2px solid var(--ink);
        padding: 0.3rem 0.55rem;
        background: rgba(245, 244, 239, 0.4);
      }
      .graph-fig {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        align-items: center;
        justify-content: center;
      }
      .graph-fig svg {
        width: 100%;
        max-width: 380px;
      }
      .fig-cap {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border-top: 2px solid var(--ink);
        padding-top: 0.55rem;
        width: 100%;
        text-align: center;
      }

      .proj-2 {
        background: var(--orange);
        color: var(--ink);
        border-block: var(--bd);
        padding: clamp(2.6rem, 5.5vw, 4.5rem) 0;
        overflow: hidden;
        --focus: var(--ink);
      }
      .proj-2::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(10, 10, 14, 0.16) 1.3px, transparent 1.3px);
        background-size: 17px 17px;
        -webkit-mask-image: linear-gradient(#000 15%, transparent 70%);
        mask-image: linear-gradient(#000 15%, transparent 70%);
      }
      .proj-2 .p-title {
        font-size: clamp(2.8rem, 9vw, 8rem);
        line-height: 0.86;
      }
      .proj-2 .p-title .shade {
        color: var(--paper);
      }
      .proj-2-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(1.6rem, 4vw, 4rem);
        align-items: start;
        position: relative;
        z-index: 2;
        margin-top: 0.4rem;
      }
      .proj-2 .p-desc {
        color: rgba(10, 10, 14, 0.88);
      }
      .terminal {
        background: var(--ink);
        color: var(--lime);
        border: var(--bd);
        box-shadow: 10px 10px 0 var(--ink);
        font-family: var(--font-mono);
        font-size: clamp(0.72rem, 1.1vw, 0.86rem);
        transform: rotate(-1deg);
      }
      .terminal .t-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 2px solid rgba(201, 244, 33, 0.3);
        color: rgba(245, 244, 239, 0.6);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .terminal .t-head i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .terminal .t-head i:nth-child(1) {
        background: var(--red);
      }
      .terminal .t-head i:nth-child(2) {
        background: var(--yellow);
      }
      .terminal .t-head i:nth-child(3) {
        background: var(--lime);
      }
      .terminal pre {
        padding: 1rem;
        white-space: pre-wrap;
        line-height: 1.9;
      }
      .terminal .c-dim {
        color: rgba(245, 244, 239, 0.5);
      }
      .terminal .c-pink {
        color: var(--pink);
      }
      .terminal .c-ok {
        color: var(--lime);
        font-weight: 700;
      }
      .lang-sticker {
        margin: 1.3rem 0 0;
      }

      .proj-3 {
        background: var(--yellow);
        color: var(--ink);
        border-bottom: var(--bd);
        padding: clamp(2.6rem, 5.5vw, 4.5rem) 0;
        overflow: hidden;
        --focus: var(--ink);
      }
      .proj-3-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: clamp(1.6rem, 4vw, 4rem);
        align-items: center;
        position: relative;
        z-index: 2;
        margin-top: 0.4rem;
      }
      .uml {
        display: grid;
        gap: 0.9rem;
        max-width: 440px;
      }
      .uml-box {
        border: var(--bd);
        background: var(--paper);
        box-shadow: 7px 7px 0 var(--ink);
        font-family: var(--font-mono);
        font-size: 0.78rem;
      }
      .uml-box .ub-h {
        background: var(--ink);
        color: var(--yellow);
        padding: 0.5rem 0.8rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 0.68rem;
      }
      .uml-box .ub-b {
        padding: 0.65rem 0.8rem;
        display: grid;
        gap: 0.25rem;
      }
      .uml-inherit {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
      }
      .uml-inherit .line {
        flex: 1;
        border-top: 3px dashed var(--ink);
      }

      .gh-strip {
        padding: clamp(2rem, 4vw, 3.2rem) 0 clamp(2.2rem, 4.5vw, 3.5rem);
      }
      .gh-strip a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.2rem;
        flex-wrap: wrap;
        border: 3px dashed rgba(245, 244, 239, 0.4);
        padding: clamp(1.1rem, 2.6vw, 1.8rem);
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.2s var(--ease);
      }
      .gh-strip a:hover {
        border-color: var(--lime);
        background: rgba(201, 244, 33, 0.06);
        transform: translateX(6px);
      }
      .gh-strip .gh-l {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1.2rem, 2.8vw, 2rem);
        color: var(--paper);
      }
      .gh-strip .gh-l span {
        color: var(--lime);
      }
      .gh-strip .gh-r {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.6);
      }
      @media (max-width: 940px) {
        .proj-1 .poster,
        .proj-2-grid,
        .proj-3-grid {
          grid-template-columns: 1fr;
        }
        .uml {
          max-width: 100%;
        }
      }

      /* ============================================================ JUDGE */
      .sec-judge {
        background: var(--ink);
        border-top: 3px solid var(--ink-3);
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        overflow: hidden;
      }
      .sec-judge .ghost-num {
        color: var(--red);
        top: 0.5rem;
        right: -2rem;
        font-size: clamp(8rem, 22vw, 18rem);
        -webkit-text-stroke-color: var(--red);
        opacity: 0.1;
      }
      .judge-title {
        font-size: clamp(2.4rem, 7vw, 6.2rem);
        color: var(--paper);
      }
      .judge-title .hl {
        color: var(--red);
      }
      .meta-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 3px solid rgba(245, 244, 239, 0.28);
        margin: clamp(1.5rem, 3vw, 2.4rem) 0;
      }
      .meta-grid > div {
        padding: 0.9rem 1rem;
        border-right: 3px solid rgba(245, 244, 239, 0.28);
      }
      .meta-grid > div:last-child {
        border-right: none;
      }
      .meta-grid dt {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--red);
        margin-bottom: 0.35rem;
      }
      .meta-grid dd {
        font-size: 0.85rem;
        color: var(--paper);
        line-height: 1.45;
      }
      @media (max-width: 820px) {
        .meta-grid {
          grid-template-columns: 1fr 1fr;
        }
        .meta-grid > div {
          border-bottom: 3px solid rgba(245, 244, 239, 0.28);
        }
      }
      @media (max-width: 480px) {
        .meta-grid {
          grid-template-columns: 1fr;
        }
      }
      .flow {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        flex-wrap: wrap;
        margin: 0 0 clamp(1.8rem, 4vw, 2.8rem);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .flow .chip {
        border: 2px solid var(--paper);
        padding: 0.48rem 0.75rem;
        background: var(--ink-2);
        white-space: nowrap;
      }
      .flow .chip.hot {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }
      .flow .dash {
        flex: 1 0 30px;
        height: 3px;
        background: repeating-linear-gradient(90deg, var(--red) 0 10px, transparent 10px 20px);
        animation: dashmove 0.8s linear infinite;
      }
      @keyframes dashmove {
        to {
          background-position: 20px 0;
        }
      }
      .cs-steps {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 1.1rem;
      }
      .cs-step {
        grid-column: span 2;
        border-top: 4px solid var(--red);
        padding-top: 0.9rem;
      }
      .cs-step.wide {
        grid-column: span 3;
      }
      .cs-step .n {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--red);
      }
      .cs-step h3 {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        color: var(--paper);
        margin: 0.4rem 0 0.6rem;
      }
      .cs-step p {
        color: rgba(245, 244, 239, 0.7);
        font-size: 0.9rem;
      }
      .cs-step p code {
        font-family: var(--font-mono);
        font-size: 0.8em;
        background: var(--ink-3);
        padding: 0.1em 0.4em;
        color: var(--cyan);
      }
      @media (max-width: 900px) {
        .cs-steps {
          grid-template-columns: 1fr 1fr;
        }
        .cs-step,
        .cs-step.wide {
          grid-column: span 1;
        }
      }
      @media (max-width: 560px) {
        .cs-steps {
          grid-template-columns: 1fr;
        }
      }

      /* ============================================================ E-SUMMIT */
      .sec-summit {
        background: var(--pink);
        color: var(--ink);
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        overflow: hidden;
        border-top: var(--bd);
        --focus: var(--ink);
      }
      .sec-summit::before {
        content: "";

        color: var(--ink);

      .summit-hero {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: clamp(1.4rem, 4vw, 4rem);
        align-items: center;
        position: relative;
        z-index: 2;
      }
      .big-stat {
        font-family: var(--font-display);
        font-size: clamp(6rem, 22vw, 19rem);
        line-height: 0.8;
        color: var(--ink);
        text-shadow: 8px 8px 0 rgba(245, 244, 239, 0.9);
        letter-spacing: -0.02em;
      }
      .summit-hero .sh-r h2 {
        font-size: clamp(1.9rem, 4.6vw, 3.8rem);
        line-height: 0.95;
      }
      .summit-meta {
        border-color: var(--ink);
        margin: 1.3rem 0 0;
      }
      .summit-meta > div {
        border-color: var(--ink);
      }
      .summit-meta dt {
        color: var(--ink);
        opacity: 0.75;
      }
      .summit-meta dd {
        color: var(--ink);
        font-weight: 700;
      }
      .summit-steps {
        display: grid;
        grid-template-columns: repeat(5, 1fr);

        margin-top: clamp(1.8rem, 4.5vw, 3rem);

        z-index: 2;

      .sum-step {
        background: var(--paper);
        border: var(--bd);
        box-shadow: 6px 6px 0 var(--ink);
        padding: 1.1rem 0.95rem;
        transform: rotate(var(--r, 0deg));
        transition:
          transform 0.25s var(--ease),
          box-shadow 0.25s var(--ease);

      .sum-step:hover {
        transform: rotate(0) translate(-3px, -3px);
        box-shadow: 10px 10px 0 var(--ink);
      }
      .sum-step:nth-child(odd) {
        --r: -1deg;
      }
      .sum-step:nth-child(even) {
        --r: 1deg;
        margin-top: 0.9rem;
      }
      .sum-step .n {
        font-family: var(--font-mono);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--pink);

      .sum-step h3 {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: 1.1rem;
        margin: 0.35rem 0 0.5rem;

      @media (max-width: 1100px) {
        .summit-steps {
          grid-template-columns: repeat(2, 1fr);

        .sum-step:nth-child(even) {
          margin-top: 0;
        }
      }
      @media (max-width: 900px) {
        .summit-hero {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        .summit-steps {
          grid-template-columns: 1fr;
        }
      }

      /* ============================================================ EXPERIENCE */
      .sec-xp {
        background: var(--blue);
        color: #fff;
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        overflow: hidden;
        border-top: var(--bd);
      }
      .xp-kicker {
        color: var(--lime);
      }
      .xp-title {
        font-size: clamp(2.4rem, 6.5vw, 5.8rem);
      }
      .xp-list {
        margin-top: clamp(1.8rem, 4vw, 2.8rem);
        border-top: 3px solid rgba(245, 244, 239, 0.4);
      }
      .xp-row {
        display: grid;
        grid-template-columns: minmax(150px, 0.85fr) 1.7fr auto;
        gap: 1.3rem;
        align-items: center;
        border-bottom: 3px solid rgba(245, 244, 239, 0.4);
        padding: clamp(1.05rem, 2.2vw, 1.6rem) 0.4rem;
        transition:
          background 0.2s,
          color 0.2s,
          padding-left 0.25s var(--ease);

      .xp-row:hover {
        background: var(--lime);
        color: var(--ink);

        color: var(--pink);

      .xp-year {
        font-family: var(--font-display);

        text-transform: uppercase;

      .xp-tag {
        font-family: var(--font-mono);
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--cyan);
        display: block;
        margin-bottom: 0.3rem;
      }
      .xp-row:hover .xp-tag {
        color: var(--ink);
        opacity: 0.6;
      }
      .xp-role {
        font-weight: 700;
        font-size: clamp(1rem, 1.6vw, 1.3rem);
        line-height: 1.2;
      }
      .xp-role small {
        display: block;
        font-weight: 400;
        font-size: 0.85em;
        opacity: 0.85;
        margin-top: 0.3rem;
        max-width: 66ch;
      }
      .xp-org {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--cyan);
        text-align: right;
        max-width: 20ch;
      }
      .xp-badge {
        font-family: var(--font-display);
        background: var(--yellow);
        color: var(--ink);
        border: 2px solid var(--ink);
        padding: 0.15rem 0.5rem;
        font-size: 0.85rem;
        transform: rotate(-3deg);
        display: inline-block;
        box-shadow: 3px 3px 0 var(--ink);
        margin-left: 0.4rem;
      }
      @media (max-width: 760px) {
        .xp-row {
          grid-template-columns: 1fr;
          gap: 0.45rem;
        }
        .xp-org {
          text-align: left;
          max-width: none;
        }
      }

      /* ============================================================ SKILLS */
      .sec-skills {
        background: var(--ink);
        padding: clamp(2.8rem, 6vw, 5rem) 0;
        overflow: hidden;
      }
      .sec-skills .ghost-num {
        color: var(--paper);
        top: -2rem;
        left: -1rem;
        font-size: clamp(7rem, 20vw, 16rem);
        -webkit-text-stroke-color: rgba(245, 244, 239, 0.4);
      }
      .skills-title {
        font-size: clamp(2.4rem, 6.5vw, 5.8rem);
        color: var(--paper);
      }
      .skill-group {
        margin-top: clamp(1.5rem, 3vw, 2.2rem);
        position: relative;
        z-index: 2;
      }
      .skill-group .sg-head {
        display: flex;
        align-items: baseline;
        gap: 0.9rem;
        border-bottom: 3px solid var(--ink-3);
        padding-bottom: 0.55rem;
        margin-bottom: 1rem;
      }
      .skill-group .sg-head h3 {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1.15rem, 2.2vw, 1.8rem);
        color: var(--paper);
      }
      .skill-group .sg-head span {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        color: var(--sg, var(--lime));
      }
      .chips {
        display: flex;

      .chip {
        border: 3px solid var(--cc, var(--paper));
        color: var(--paper);
        font-family: var(--font-mono);
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.5rem 0.95rem;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.2s var(--ease);
        transform: rotate(var(--r, 0deg));
      }
      .chip:hover {
        background: var(--cc, var(--paper));
        color: var(--ink);
        transform: rotate(0) translateY(-4px);
      }
      .chip.big {
        font-size: 1.1rem;
        padding: 0.65rem 1.2rem;
      }
      .chip.small {
        font-size: 0.66rem;
        padding: 0.38rem 0.7rem;
      }
      .skill-cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.4rem;
        margin-top: clamp(2.2rem, 4.5vw, 3.6rem);
        padding-top: clamp(1.2rem, 2.5vw, 2rem);
        border-top: 3px dashed rgba(245, 244, 239, 0.18);
        position: relative;
        z-index: 2;
      }
      .skill-cols .skill-group {
        margin-top: 0;
      }
      @media (max-width: 900px) {
        .skill-cols {
          grid-template-columns: 1fr;
        }
      }

      /* ============================================================ CONTACT */
      .sec-contact {
        background: var(--cyan);
        color: var(--ink);
        padding: clamp(3rem, 7vw, 6rem) 0;
        overflow: hidden;
        border-top: var(--bd);

        content: "";

        mask-image: linear-gradient(transparent 55%, #000);

        font-size: clamp(3rem, 10.5vw, 9.5rem);

        z-index: 2;

        margin-left: clamp(1rem, 7vw, 6rem);

        font-family: var(--font-serif);
        font-style: italic;
        text-transform: none;
      }
      .contact-copy {
        max-width: 60ch;
        margin: 1.3rem 0 1.8rem;
        font-size: clamp(0.95rem, 1.2vw, 1.08rem);

        position: relative;
        z-index: 2;
      }
      .contact-cta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.3rem;

        z-index: 2;

      .email-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.9rem;
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: clamp(1rem, 2.3vw, 1.7rem);
        background: var(--ink);
        color: var(--lime);
        border: var(--bd);
        padding: 0.9rem 1.6rem;
        box-shadow: 9px 9px 0 var(--pink);
        transition:
          transform 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
        word-break: break-all;
      }
      .email-btn:hover {
        transform: translate(-4px, -4px) rotate(-1deg);
        box-shadow: 14px 14px 0 var(--pink);
      }
      .contact-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.1rem;
        position: relative;
        z-index: 2;
      }
      .c-card {
        border: var(--bd);
        background: var(--paper);
        box-shadow: 7px 7px 0 var(--ink);
        padding: 1.3rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition:
          transform 0.22s var(--ease),
          box-shadow 0.22s var(--ease);
        transform: rotate(var(--r, 0deg));
      }
      .c-card:nth-child(1) {
        --r: -0.8deg;
      }
      .c-card:nth-child(2) {
        --r: 0.6deg;
      }
      .c-card:nth-child(3) {
        --r: -0.5deg;
      }
      .c-card:hover {
        transform: rotate(0) translate(-4px, -4px);
        box-shadow: 12px 12px 0 var(--ink);
      }
      .c-card h3 {
        font-family: var(--font-display);
        text-transform: uppercase;
        font-size: 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .c-card h3 .ar {
        color: var(--pink);
      }
      .c-card .sub {
        font-weight: 700;
        font-size: 0.9rem;
      }
      .c-card p {
        font-size: 0.8rem;
        color: rgba(10, 10, 14, 0.7);
      }
      @media (max-width: 860px) {
        .contact-cards {
          grid-template-columns: 1fr;
        }
      }

      /* ============================================================ FOOTER */
      .footer {
        background: var(--ink);
        border-top: 3px solid var(--ink-3);
        overflow: hidden;
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr 0.8fr 0.9fr;
        gap: 1.6rem;
        padding: clamp(1.8rem, 4vw, 2.8rem) 0;
      }
      .footer-grid h4 {
        font-family: var(--font-mono);
        font-size: 0.64rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--lime);
        margin-bottom: 0.8rem;
      }
      .footer-grid li {
        margin-bottom: 0.45rem;
      }
      .footer-grid a {
        color: rgba(245, 244, 239, 0.75);
        font-size: 0.9rem;
        transition:
          color 0.15s,
          padding-left 0.2s var(--ease);
      }
      .footer-grid a:hover {
        color: var(--cyan);
        padding-left: 0.4rem;
      }
      .footer-brand p {
        color: rgba(245, 244, 239, 0.6);
        font-size: 0.9rem;
        max-width: 34ch;
        margin-top: 0.6rem;
      }

        border-top: 2px dashed var(--ink-3);
        padding: 1.1rem 0;

        font-size: 0.64rem;
        letter-spacing: 0.06em;
        color: rgba(245, 244, 239, 0.45);
        max-width: 92ch;

        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 2rem;
        justify-content: space-between;
        align-items: center;
        border-top: 3px solid var(--ink-3);
        padding: 1rem 0 1.4rem;
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(245, 244, 239, 0.55);
      }
      .footer-bottom a {
        color: var(--lime);
      }
      .footer-bottom a:hover {
        color: var(--pink);
      }
      @media (max-width: 900px) {
        .footer-grid {
          grid-template-columns: 1fr 1fr;
        }

      @media (max-width: 540px) {
        .footer-grid {
          grid-template-columns: 1fr;
        }

          transition-duration: 0.01ms !important;

        html.js .rv-l,
        html.js .rv-r,
        html.js .rv-pop {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }

        text-transform: uppercase;

        text-transform: uppercase;

          font-size: 0.8rem;
        }
      }

      .hc-art {

        aspect-ratio: 480/300;

        display: block;
        width: 100%;

      .hero-card .hc-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        padding: 0;
      }
      .hero-card a.hr {
        --ac: var(--lime);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.9rem;
        min-height: 5.4rem;
        padding: 0.85rem 1rem 0.9rem;
        border-right: 1px dashed rgba(245, 244, 239, 0.22);
        border-bottom: 1px dashed rgba(245, 244, 239, 0.22);
        transition:
          background-color 0.12s,
          color 0.12s;
      }
      .hero-card a.hr:nth-child(2) {
        --ac: var(--cyan);
      }
      .hero-card a.hr:nth-child(3) {
        --ac: var(--pink);
      }
      .hero-card a.hr:nth-child(4) {
        --ac: var(--yellow);
      }
      .hero-card a.hr:nth-child(2n) {
        border-right: 0;
      }
      .hero-card a.hr:nth-child(n + 3) {
        border-bottom: 0;
      }
      .hero-card .hk {
        font-size: 0.62rem;
        color: rgba(245, 244, 239, 0.6);
      }
      .hero-card .hv {
        font-family: var(--font-display);
        font-size: clamp(1.25rem, 1.7vw, 1.6rem);
        line-height: 1.02;

        text-align: left;

      .hero-card a.hr:focus-visible {
        background: var(--ac);
      }
      .hero-card a.hr:hover .hk,
      .hero-card a.hr:focus-visible .hk,
      .hero-card a.hr:hover .hv,
      .hero-card a.hr:focus-visible .hv {
        color: var(--ink);
      }
      .hero-card a.hr:focus-visible {
        outline: 2px solid var(--paper);
        outline-offset: -5px;
      }
      @media (min-width: 901px) {
        .hero-card {
          align-self: start;
          margin-top: 0.4rem;
          margin-bottom: 0;
        }
        .hero-card .hk {
          font-size: 0.66rem;
        }
        .hero-card .hv {
          font-size: clamp(1.25rem, 1.7vw, 1.6rem);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-card a.hr {
          transition: none;
        }
      }
    </style>

            <article class="move rv">
              <div class="mv-top"><span class="mv-num">/ 01</span></div>
              <h3>MODEL</h3>
              <p>
                Read the paper before writing code. When I reproduced LightGCN, the first task was
                not writing PyTorch. It was understanding what the original GCN did wrong, and why a
                simpler propagation could outperform it. The data has a shape, and the model should
                follow it rather than impose one.
              </p>
            </article>
            <article class="move rv" style="animation-delay: 0.08s">
              <div class="mv-top"><span class="mv-num">/ 02</span></div>
              <h3>BUILD</h3>
              <p>
                Building from scratch means building every part. I implemented and verified
                adjacency normalisation, layer-wise propagation, and the ranking objective
                separately before combining them. The paper's own ablations made one point clear:
                adding layers does not add signal.
              </p>
            </article>
            <article class="move rv" style="animation-delay: 0.16s">
              <div class="mv-top"><span class="mv-num">/ 03</span></div>
              <h3>TEST</h3>
              <p>
                Match the protocol, not only the metric. We used the same leave-one-out split and
                negative sampling as the paper, so any difference we saw came from the model rather
                than from our testing. The ablations over depth and dimension helped us understand
                our own implementation as much as they measured it.
              </p>
            </article>
            <article class="move rv" style="animation-delay: 0.24s">
              <div class="mv-top"><span class="mv-num">/ 04</span></div>
              <h3>SHIP</h3>
              <p>
                A result is only as trustworthy as the caveats you attach to it. Write down what you
                cannot claim - the small sample, the baseline that is not comparable, the variance
                you have not ruled out. Releasing work means being honest about its scope, not just
                loud about the number.
              </p>
            </article>
          </div>
        </div>

      <!-- JUDGE -->
      <section class="sec-judge" id="case-study" data-nav>
        <span class="ghost-num" aria-hidden="true">04</span>
        <div class="wrap">
          <p class="kicker rv" style="color: var(--red)">
            04 / CASE STUDY · JUDGE - CODEJUDGE · SPRING BOOT · RABBITMQ · DOCKER
          </p>
          <h2 class="judge-title d1 rv">
            RUNNING <span class="hl">UNTRUSTED</span><br />CODE AT SCALE.
          </h2>

          <dl class="meta-grid rv">
            <div>
              <dt>ROLE</dt>
              <dd>Design + full-stack implementation</dd>
            </div>
            <div>
              <dt>STACK</dt>
              <dd>Spring Boot · RabbitMQ · Docker · PostgreSQL · Monaco</dd>
            </div>
            <div>
              <dt>RESULT</dt>
              <dd>Async judge for Python, Java &amp; C++</dd>
            </div>
            <div>
              <dt>DEPLOY</dt>
              <dd>One-click Docker Compose · 12 pre-loaded problems</dd>
            </div>
          </dl>

          <div class="flow rv" aria-label="Submission pipeline">
            <span class="chip hot">SUBMIT</span><span class="dash" aria-hidden="true"></span>
            <span class="chip">PENDING / POSTGRES</span
            ><span class="dash" aria-hidden="true"></span> <span class="chip">RABBITMQ</span
            ><span class="dash" aria-hidden="true"></span> <span class="chip">DOCKER SANDBOX</span
            ><span class="dash" aria-hidden="true"></span>
            <span class="chip hot">VERDICT</span>
          </div>

          <div class="cs-steps">
            <div class="cs-step rv">
              <span class="n">01 / PROBLEM</span>
              <h3>Synchronous judging does not scale.</h3>
              <p>
                Most coding platforms run submissions inline. The request thread blocks while the
                compiler runs and the test cases execute, which under load leads to queue buildup,
                timeouts, and a broken experience for the user. And once you run code that someone
                else wrote, you are already dealing with security.
              </p>
            </div>
            <div class="cs-step rv" style="animation-delay: 0.06s">
              <span class="n">02 / APPROACH</span>
              <h3>Decouple submission from execution.</h3>
              <p>
                The submission endpoint only validates and enqueues. It saves the submission in
                PostgreSQL with the verdict <code>PENDING</code>, and publishes its ID to a RabbitMQ
                queue. A judge worker consumes the message, writes the code to a temporary
                directory, runs it inside an isolated Docker container, compares the output against
                visible and hidden test cases, and writes the final verdict back. The frontend polls
                until the verdict arrives.
              </p>
            </div>
            <div class="cs-step rv" style="animation-delay: 0.12s">
              <span class="n">03 / DECISION</span>
              <h3>Sandbox everything, trust nothing.</h3>
              <p>
                Every submission runs in a fresh container with networking disabled and hard
                resource limits: 128MB of memory and 0.5 CPU for Python, 512MB and 1.5 CPU for Java
                and C++, plus an execution timeout. This costs latency, but you cannot run arbitrary
                user code on the same machine that holds your database. It is the decision I would
                defend hardest in review, and the trade-off is deliberate.
              </p>
            </div>
            <div class="cs-step wide rv">
              <span class="n">04 / OUTCOME</span>
              <h3>Async, multi-language, and instructor-friendly.</h3>
              <p>
                The platform supports three languages (Python, Java and C++) and judges submissions
                asynchronously with verdicts of <code>ACCEPTED</code>, <code>WRONG_ANSWER</code> or
                <code>RUNTIME_ERROR</code>, along with the recorded execution time. 12 pre-loaded
                problems ship with visible and hidden test cases, role-based access separates admins
                from users, and the admin dashboard lets instructors create, edit and delete
                problems and test cases without touching the codebase. The candidate interface is a
                real terminal, so the assessment feels like the tools engineers already use.
              </p>
            </div>
            <div class="cs-step wide rv" style="animation-delay: 0.06s">
              <span class="n">05 / NEXT</span>
              <h3>What I would carry forward.</h3>
              <p>
                Replace polling with WebSocket live verdicts and move to stateless JWT
                authentication. Store submission history in the database instead of local storage,
                add Redis caching for problems and test cases, and scale out with multiple judge
                workers on Kubernetes behind a CI/CD pipeline. I would also harden the sandbox
                further, because the security model is never finished.
              </p>
            </div>
          </div>
        </div>
      </section>

                The workflow looked straightforward on paper: identify prospects, assign them, make
                calls, follow up, close. But conversion stayed flat - we were sending every company
                the same generic pitch, optimising for the number of companies contacted rather than
                for whether the company had a specific reason to take part.
              </p>
            </article>
            <article class="sum-step rv" style="animation-delay: 0.05s">
              <span class="n">02 / THE FIX</span>
              <h3>Research before outreach.</h3>
              <p>
                I changed the workflow so that prospect research happened before anyone reached out.
                Instead of one pitch for every company, we identified something specific about each
                one that could connect to our student audience - and split specialised outreach
                across the team: banks and PSUs offline, others on gaming partnerships.
              </p>
            </article>
            <article class="sum-step rv" style="animation-delay: 0.1s">
              <span class="n">03 / SECOND FAILURE</span>
              <h3>The workflow broke again after the close.</h3>
              <p>
                Each sponsor could have multiple commitments - branding, activations, placements -
                and missing one could delay the final payment. Fulfilment required coordination
                across event teams, so the vertical had to track what had been promised and whether
                each item had actually been delivered.
              </p>
            </article>
            <article class="sum-step rv" style="animation-delay: 0.15s">
              <span class="n">04 / CONSTRAINT</span>
              <h3>March is the wrong month.</h3>
              <p>
                E-Summit happens close to the end of the financial year. Some companies were already
                closing their budgets, so even interested companies sometimes could not complete the
                process in time. We could not remove the constraint, but knowing it let us
                prioritise the prospects who could still move.
              </p>
            </article>
            <article class="sum-step rv" style="animation-delay: 0.2s">
              <span class="n">05 / OUTCOME</span>
              <h3>Same team, different shape of work.</h3>
              <p>
                If I were fixing the workflow from scratch, I would fix prospect qualification and
                personalisation first. Once we changed how we selected and approached prospects,
                conversion improved without simply increasing the number of calls and emails. The
                sponsorship vertical grew 5× compared with the previous edition.
              </p>
            </article>
          </div>
        </div>
      </section>

      /* ============================================================ HERO TIC-TAC-TOE

      (function () {
        var LINKEDIN_URL = "https://www.linkedin.com/in/yuvraj-verma-/";

        var $ = function (id) { return document.getElementById(id); };
        var game = $("heroGame"), playBtn = $("tttPlayBtn"), boardEl = $("tttBoard");
        var statusEl = $("tttStatus"), winEl = $("tttWin"), giftLink = $("tttGiftLink");
        var confetti = $("tttConfetti");
        if (!game || !boardEl) return;
        if (giftLink && LINKEDIN_URL) giftLink.href = LINKEDIN_URL;

        var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        var MARKS = {
          X: '<svg class="ttt-mark" viewBox="0 0 40 40" aria-hidden="true"><path pathLength="1" d="M7 7L33 33"/><path pathLength="1" style="animation-delay:.12s" d="M33 7L7 33"/></svg>',

        };
        var NS = "http://www.w3.org/2000/svg";
        var cells = [], board, turn, over, timer, strike, strikeLine;
        var scores = { X: 0, O: 0, D: 0 }, dryStreak = 0;
        var scoreEls = {
          X: { n: $("tttSx"), box: $("tttSx").parentNode },
          D: { n: $("tttSd"), box: $("tttSd").parentNode },
          O: { n: $("tttSo"), box: $("tttSo").parentNode }

        var reduced = function () { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; };

        function buildBoard() {
          boardEl.innerHTML = "";
          for (var i = 0; i < 9; i++) {
            var c = document.createElement("button");
            c.type = "button";
            c.className = "ttt-cell";
            c.setAttribute("data-i", i);
            boardEl.appendChild(c);
            cells.push(c);

          strike = document.createElementNS(NS, "svg");
          strike.setAttribute("class", "ttt-strike");
          strike.setAttribute("viewBox", "0 0 100 100");
          strike.setAttribute("preserveAspectRatio", "none");
          strike.setAttribute("aria-hidden", "true");
          strikeLine = document.createElementNS(NS, "line");
          strikeLine.setAttribute("pathLength", "1");
          strike.appendChild(strikeLine);

        function label(i, m) {

            "Row " + (Math.floor(i / 3) + 1) + ", column " + (i % 3 + 1) + ", " + (m || "empty"));

        function setStatus(text, cls) {

          statusEl.className = "ttt-status" + (cls ? " " + cls : "");
