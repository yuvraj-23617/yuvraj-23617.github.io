*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--page-bg,#07090d)}
body{transition:background-color .7s ease}

/* ── STAGE: three full-screen layers, one per design ─────────────── */
.stage{position:fixed;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;z-index:1;visibility:hidden;pointer-events:none}
.layer.is-current{visibility:visible;pointer-events:auto}
.layer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  background:transparent;transform-origin:50% 50%}
.scrim{position:absolute;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none}
.ring{position:absolute;left:0;top:0;z-index:4;border-radius:50%;border:3px solid var(--ring,#fff);
  opacity:0;pointer-events:none;will-change:transform,opacity}

/* ── SWITCHER ────────────────────────────────────────────────────── */
.switcher{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;
  transform:translateX(-50%);
  font:700 11px/1 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.12em;text-transform:uppercase;
  --sw-bg:rgba(7,9,13,.78);--sw-fg:#8fa6b6;--sw-fg-on:#07090d;--sw-thumb:#00E5FF;
  --sw-border:rgba(0,229,255,.30);--sw-radius:6px;--sw-shadow:0 12px 40px rgba(0,0,0,.45);
  --sw-spark:#ffffff;--sw-glow:rgba(0,229,255,.55);
  animation:swIntro 1.6s cubic-bezier(.34,1.2,.64,1) .3s both;
}
.switcher[data-design="max"]{
  --sw-bg:rgba(10,10,14,.92);--sw-fg:#f5f4ef;--sw-fg-on:#0a0a0e;--sw-thumb:#c9f421;
  --sw-border:#f5f4ef;--sw-radius:999px;--sw-shadow:4px 4px 0 #ff2d7e;
  --sw-spark:#c9f421;--sw-glow:rgba(201,244,33,.6);
}
.switcher[data-design="paper"]{
  --sw-bg:rgba(247,244,234,.94);--sw-fg:#4A4436;--sw-fg-on:#F2EEE3;--sw-thumb:#17140C;
  --sw-border:#17140C;--sw-radius:2px;--sw-shadow:3px 3px 0 #8E1E18;
  --sw-spark:#8E1E18;--sw-glow:rgba(142,30,24,.5);
}
.sw-track{
  position:relative;display:flex;padding:4px;overflow:visible;
  background:var(--sw-bg);border:1.5px solid var(--sw-border);border-radius:var(--sw-radius);
  box-shadow:var(--sw-shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  transition:background-color .7s,border-color .7s,border-radius .7s,box-shadow .7s;
  animation:swGlow 1.8s ease-in-out 1.6s 3;
}
/* shimmer sweep: lives inside the pill, moves by background position */
.sw-track::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  border-radius:inherit;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);
  background-size:250% 100%;background-repeat:no-repeat;
  background-position:150% 0;
  animation:swSweep 1.4s ease-in-out 1.8s 2;
}
/* sparkle stars around the edges */
.sw-track::before{
  content:"";position:absolute;inset:-14px;pointer-events:none;z-index:3;
  background:
    radial-gradient(circle at 8% 20%, var(--sw-spark) 0 2px, transparent 3px),
    radial-gradient(circle at 92% 15%, var(--sw-spark) 0 2px, transparent 3px),
    radial-gradient(circle at 25% 100%, var(--sw-spark) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 95%, var(--sw-spark) 0 2px, transparent 3px),
    radial-gradient(circle at 50% -4%, var(--sw-spark) 0 2px, transparent 3px),
    radial-gradient(circle at 104% 60%, var(--sw-spark) 0 2px, transparent 3px);
  opacity:0;
  animation:swTwinkle 1.6s ease-in-out 1.8s 3;
}
.sw-thumb{
  position:absolute;left:0;top:4px;bottom:4px;width:0;
  background:var(--sw-thumb);border-radius:max(0px,calc(var(--sw-radius) - 4px));
  transition:transform .6s cubic-bezier(.34,1.32,.5,1),width .6s cubic-bezier(.34,1.32,.5,1),
             background-color .7s,border-radius .7s;
  will-change:transform,width;
  animation:swShimmer 1.2s ease-in-out 2s 3;
}
.sw-btn{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding:11px 14px;color:var(--sw-fg);background:none;border:0;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:color .5s,opacity .3s;
}
.sw-btn:hover{opacity:.78}
.sw-btn[aria-checked="true"]{color:var(--sw-fg-on);opacity:1;cursor:default}
.sw-btn:focus-visible{outline:2px solid var(--sw-thumb);outline-offset:3px;border-radius:4px}
.sw-btn .n{opacity:.5;font-weight:500}
.switcher.loading .sw-thumb{animation:swThumbPulse .7s ease-in-out infinite alternate}
@keyframes swThumbPulse{from{opacity:1}to{opacity:.45}}

/* appears in the middle of the screen, then sinks to its place */
@keyframes swIntro{
  0%   { opacity:0; transform:translate(-50%, -50vh) scale(1.25); }
  60%  { opacity:1; transform:translate(-50%, 6px) scale(.98); }
  100% { opacity:1; transform:translate(-50%, 0) scale(1); }
}
@keyframes swGlow{
  0%,100% { box-shadow:var(--sw-shadow); }
  50%     { box-shadow:var(--sw-shadow), 0 0 28px 6px var(--sw-glow); }
}
@keyframes swSweep{
  from{ background-position:150% 0; }
  to  { background-position:-50% 0; }
}
@keyframes swTwinkle{
  0%,100% { opacity:0; transform:scale(.6); }
  50%     { opacity:1; transform:scale(1.15); }
}
@keyframes swShimmer{
  0%,100% { filter:brightness(1); }
  50%     { filter:brightness(1.7) saturate(1.4); }
}

@media (max-width:520px){
  .switcher{bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:10px}
  .sw-btn{padding:11px 12px}
  .sw-btn .n{display:none}
}
@media (prefers-reduced-motion:reduce){
  .sw-thumb,.sw-track,.sw-track::before,.sw-track::after,body{transition-duration:.01s}
  .switcher,.sw-track,.sw-track::before,.sw-track::after,.sw-thumb{animation:none !important}
}
.switcher.no-anim *{transition:none!important}

.switcher.no-anim *{transition:none!important}
  
@keyframes swThumbPulse{from{opacity:1}to{opacity:.45}}

  100% { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }

@keyframes swPulse{

  100% { box-shadow:var(--sw-shadow), 0 0 0 0 transparent; }
}

@media (prefers-reduced-motion:reduce){

\n    \u003cli>\u003ca href=\"#skills\" data-cursor=\"→\">\u003cspan class=\"n\">07\u003c/span>\u003cspan class=\"ml-t\">Toolkit\u003c/span>\u003cspan class=\"m-arrow\">↗\u003c/span>\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"#contact\" data-cursor=\"→\">\u003cspan class=\"n\">08\u003c/span>\u003cspan class=\"ml-t\">Contact\u003c/span>\u003cspan class=\"m-arrow\">↗\u003c/span>\u003c/a>\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"menu-foot\">\n    \u003ca href=\"mailto:yuvrajworkemail@gmail.com\">yuvrajworkemail@gmail.com\u003c/a>\n    \u003cspan>\u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\">GITHUB\u003c/a> / \u003ca href=\"https://www.linkedin.com/in/yuvraj-verma-/\" target=\"_blank\" rel=\"noopener\">LINKEDIN\u003c/a>\u003c/span>\n    \u003cspan class=\"ist-clock mono\">DELHI — 00:00:00 IST\u003c/span>\n    \u003cspan>ESC TO CLOSE\u003c/span>\n  \u003c/div>\n\u003c/nav>\n\n\u003cmain>\n\n\u003csection class=\"hero\" id=\"home\">\n  \u003cdiv class=\"hero-topline mono\">\n    \u003cspan>ENGINEERING PORTFOLIO — VOL.01 \u003cb>//\u003c/b> ONE HTML FILE, WRITTEN BY HAND\u003c/span>\n    \u003cspan>IIIT-DELHI · COMPUTER SCIENCE\u003c/span>\n  \u003c/div>\n\n  \u003cspan class=\"avail\" data-fade>\u003ci>\u003c/i>OPEN TO SWEAI / PRODUCT ROLES — 2026 · OPEN SOURCE PRs WELCOME\u003c/span>\n\n  \u003ch1 class=\"hero-title\">\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">I BUILD\u003c/span>\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni outline\">SOFTWARE\u003c/span>\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni serif serif-line\">and systems.\u003c/span>\u003c/span>\n  \u003c/h1>\n\n  \u003cdiv class=\"hero-grid\">\n    \u003cp class=\"hero-sub\"\u003eI am studying for a \u003cstrong\u003eB.Tech in Computer Science at IIIT-Delhi (2023–2027)\u003c/strong\u003e. I write code that has to hold up under\n      load and under review: \u003cstrong class=\"glow\"\u003easync pipelines, sandboxed execution, graph-based models\u003c/strong\u003e,\n      and the tests that keep them honest. I am open to SWEAI and product roles for 2026, and\n      to open-source work at any time.\u003c/p\u003e\n    \u003cdiv class=\"hero-cta\">\n      \u003ca href=\"#work\" class=\"btn solid magnetic\" data-cursor=\"→\">VIEW THE CODE \u003cspan>↓\u003c/span>\u003c/a>\n      \u003ca href=\"#contact\" class=\"btn magnetic\" data-cursor=\"→\">LET'S TALK\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">\u003cspan data-count=\"5\">0\u003c/span>×\u003c/div>\u003cdiv class=\"k\">Sponsorship revenue · E-Summit\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">\u003cspan data-count=\"3\">0\u003c/span>\u003c/div>\u003cdiv class=\"k\">Languages in the judge\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">+\u003cspan data-count=\"3.2\" data-dec=\"1\">0\u003c/span>%\u003c/div>\u003cdiv class=\"k\">NDCG@10 uplift\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">'\u003cspan data-count=\"27\" data-pad=\"2\">0\u003c/span>\u003c/div>\u003cdiv class=\"k\">Graduating\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"scroll-cue mono\">SCROLL\u003ci>\u003c/i>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"marquee\" aria-hidden=\"true\">\u003cdiv class=\"mq-track\" id=\"mq1\">\u003c/div>\u003c/div>\n\n\u003csection id=\"about\">\n  \u003cspan class=\"sec-ghost\">01\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">01\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">ABOUT\u003c/span>\u003c/div>\n  \u003cdiv class=\"about-grid\">\n    \u003cdiv class=\"id-card\" data-fade>\n      \u003cdiv class=\"id-photo-wrap\">\n        \u003cimg src=\"yuvraj.webp\" alt=\"Yuvraj Verma\" width=\"150\" height=\"188\" loading=\"lazy\">\n        \u003ci>\u003c/i>\u003ci>\u003c/i>\n      \u003c/div>\n      \u003cdiv class=\"id-badge\">\n        \u003cdiv class=\"yy\">YV\u003c/div>\n        \u003cdiv class=\"nm\">Yuvraj Verma\u003csmall>COMPUTER SCIENCE · IIIT-DELHI\u003c/small>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>BASED IN\u003c/b>\u003cspan>Delhi, India\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>PROGRAM\u003c/b>\u003cspan>B.Tech Computer Science\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>BATCH\u003c/b>\u003cspan>2023 — 2027\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>WRITES\u003c/b>\u003cspan>Python · Java · C/C++ · SQL\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>FOCUS\u003c/b>\u003cspan>SWEAI / Product\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>STATUS\u003c/b>\u003cspan class=\"status-dot\">\u003ci>\u003c/i>Open to roles\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch2 class=\"about-statement\" data-lines>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">I write software that has to\u003c/span>\u003c/span>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni serif\">work under load.\u003c/span>\u003c/span>\n      \u003c/h2>\n      \u003cdiv class=\"about-copy\" data-fade>\n        \u003cp\u003eI am studying for a \u003cstrong\u003eB.Tech in Computer Science at IIIT-Delhi\u003c/strong\u003e. Most of my time goes to algorithms, systems, data structures, and the parts that decide whether anything else works. I work with \u003cstrong\u003elarge, high-dimensional, genuinely messy data\u003c/strong\u003e, and build the pipelines that make it usable. Every project follows the same pattern: data goes in, a system comes out, and tests check it.\u003c/p\u003e\n        \u003cp\u003eMost of my work sits in the backend and the model layer. I have built an \u003cstrong\u003easync, queue-based coding judge\u003c/strong\u003e that sandboxes untrusted code in Docker; a \u003cstrong\u003ehybrid recommender\u003c/strong\u003e that combines graph collaborative filtering with SBERT semantic matching; and Java systems that I modelled before writing code. I work in \u003cstrong\u003ePython, Java, Spring Boot, RabbitMQ, PostgreSQL, PyTorch and Docker\u003c/strong\u003e, and I care as much about how readable a change is as about the benchmark it produces.\u003c/p\u003e\n        \u003cp\u003eWhat I am looking for: engineering teams where the work is technical, \u003cstrong\u003ecode review is honest\u003c/strong\u003e, and shipping is measured by uptime and error budgets — rather than by slide decks.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cp class=\"aside\" data-fade\u003e— In my projects, the hardest problems have come from messy data. \u003cb>That is the work I want to keep doing.\u003c/b>\u003c/p\u003e\n      \u003cdiv class=\"chips\" data-fade\u003e\n        \u003cspan class=\"chip\"\u003eAlgorithm Design\u003c/span\u003e\u003cspan class=\"chip\"\u003eDistributed Systems\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003eMachine Learning\u003c/span\u003e\u003cspan class=\"chip\"\u003eBackend Engineering\u003c/span\u003e\n        \u003cspan class=\"chip\"\u003eLarge-Scale Data\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section>\n\n\u003csection id=\"process\">\n  \u003cspan class=\"sec-ghost\">02\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">02\u003c/span\u003e\u003cspan class=\"sec-rule\">\u003c/span\u003e\u003cspan class=\"sec-label mono\">HOW I BUILD\u003c/span>\u003c/div>\n  \u003ch2 class=\"h2\" data-lines>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">FROM THE PAPER\u003c/span\u003e\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">to \u003cspan class=\"serif\" style=\"color:var(--acc)\"\u003eshipped code.\u003c/span\u003e\u003c/span\u003e\u003c/span>\n  \u003c/h2>\n  \u003c\u003cp class=\"kicker mono\" data-fade style=\"margin-top:22px\"\u003e\u003cb\u003e/\u003c/b\u003e FOUR STEPS I USE ON EVERY PROJECT, SHAPED BY REPRODUCING LIGHTGCN FROM SCRATCH.\u003c/p\u003e\n\n  \u003cdiv class=\"proc-grid\"\u003e\n    \u003cdiv class=\"proc\" data-fade\u003e\n      \u003cspan class=\"proc-n mono\"\u003e/ 01\u003c/span\u003e\n      \u003ch4\u003eModel\u003c/h4\u003e\n      \u003cp\u003eRead the paper before writing code. When I reproduced \u003cem\u003eLightGCN\u003c/em\u003e, the first task was not writing PyTorch. It was understanding \u003cstrong\u003ewhat the original GCN did wrong\u003c/strong\u003e, and why a simpler propagation could outperform it. The data has a shape, and the model should follow it rather than impose one.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"proc\" data-fade\u003e\n      \u003cspan class=\"proc-n mono\"\u003e/ 02\u003c/span\u003e\n      \u003ch4\u003eBuild\u003c/h4\u003e\n      \u003cp\u003eBuilding from scratch means building every part. I implemented and verified \u003cstrong\u003eadjacency normalisation, layer-wise propagation, and the ranking objective\u003c/strong\u003e separately before combining them. The paper's own ablations made one point clear: \u003cstrong\u003eadding layers does not add signal.\u003c/strong\u003e\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"proc\" data-fade\u003e\n      \u003cspan class=\"proc-n mono\"\u003e/ 03\u003c/span\u003e\n      \u003ch4\u003eTest\u003c/h4\u003e\n      \u003cp\u003eMatch the protocol, not only the metric. We used the same \u003cstrong\u003eleave-one-out split and negative sampling\u003c/strong\u003e as the paper, so any difference we saw came from the model rather than from our testing. The ablations over depth and dimension helped us understand our own implementation as much as they measured it.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"proc\" data-fade\u003e\n      \u003cspan class=\"proc-n mono\"\u003e/ 04\u003c/span\u003e\n      \u003ch4\u003eShip\u003c/h4\u003e\n      \u003cp\u003eA result is only as trustworthy as the caveats you attach to it. \u003cstrong\u003eWrite down what you cannot claim\u003c/strong\u003e — the small sample, the baseline that is not comparable, the variance you have not ruled out. Releasing work means being honest about its scope, not just loud about the number.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section>\n\n\u003csection id=\"work\"\u003e\n  \u003cspan class=\"sec-ghost\"\u003e03\u003c/span\u003e\n  \u003cdiv class=\"sec-head\"\u003e\u003cspan class=\"sec-idx mono\"\u003e03\u003c/span\u003e\u003cspan class=\"sec-rule\"\u003e\u003c/span\u003e\u003cspan class=\"sec-label mono\"\u003eCODE &amp; PROJECTS\u003c/span\u003e\u003c/div\u003e\n  \u003cp class=\"kicker mono\" data-fade\u003e\u003cb\u003e/\u003c/b\u003e THREE REPOSITORIES THAT SHOW HOW I WORK: BACKEND SYSTEMS, MACHINE LEARNING, AND MODELLING.\u003c/p\u003e\n\n  \u003cdiv class=\"work-list\"\u003e\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/lightgcn-hybrid-recommender\" target=\"_blank\" rel=\"noopener\" data-project=\"0\" data-cursor=\"OPEN ↗\"\u003e\n      \u003cdiv class=\"work-idx mono\"\u003e/ 01\u003c/div\u003e\n      \u003cdiv class=\"work-main\"\u003e\n        \u003ch3 class=\"work-title\"\u003eLightGCN Recommendation&nbsp;Engine\u003c/h3\u003e\n        \u003cp class=\"work-desc\"\u003eA hybrid recommender that combines graph-based collaborative filtering (LightGCN) with \u003cstrong\u003eSBERT semantic matching\u003c/strong\u003e and Groq-powered query refinement. In evaluation it improved NDCG@10 by \u003cstrong\u003e3.2%\u003c/strong\u003e and raised HR@10 to \u003cstrong\u003e0.80\u003c/strong\u003e. Built under Dr. Angshul Majumdar.\u003c/p\u003e\n        \u003cdiv class=\"work-tags mono\"\u003ePYTHON \u003cb\u003e·\u003c/b\u003e PYTORCH \u003cb\u003e·\u003c/b\u003e LIGHTGCN \u003cb\u003e·\u003c/b\u003e SBERT \u003cb\u003e·\u003c/b\u003e GROQ\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"work-side\"\u003e\n        \u003cspan class=\"work-cat mono\"\u003eML · RECOMMENDERS\u003c/span\u003e\n        \u003cspan class=\"work-arrow\"\u003e↗\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/a\u003e\n\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/CodeJudge-with-Docker-sandbox-and-RabbitMQ-worker\" target=\"_blank\" rel=\"noopener\" data-project=\"1\" data-cursor=\"OPEN ↗\"\u003e\n      \u003cdiv class=\"work-idx mono\"\u003e/ 02\u003c/div\u003e\n      \u003cdiv class=\"work-main\"\u003e\n        \u003ch3 class=\"work-title\"\u003eCodeJudge — Distributed Assessment&nbsp;Platform\u003c/h3\u003e\n        \u003cp class=\"work-desc\"\u003eA distributed coding assessment platform built on \u003cstrong\u003eJava Spring Boot\u003c/strong\u003e. It judges submissions in Python, Java and C++ \u003cstrong\u003easynchronously\u003c/strong\u003e: the API saves each submission as \u003ccode\u003ePENDING\u003c/code\u003e in PostgreSQL and publishes its ID to RabbitMQ. A judge worker picks up the message and runs the code inside an \u003cstrong\u003eisolated Docker container with no network access and hard memory and CPU limits\u003c/strong\u003e, then writes the verdict back. The platform has a role-based admin panel for problems and visible or hidden test cases, 12 pre-loaded problems, and a one-click Docker Compose deploy.\u003c/p\u003e\n        \u003cdiv class=\"work-tags mono\"\u003eSPRING BOOT \u003cb\u003e·\u003c/b\u003e RABBITMQ \u003cb\u003e·\u003c/b\u003e DOCKER \u003cb\u003e·\u003c/b\u003e POSTGRESQL \u003cb\u003e·\u003c/b\u003e MONACO\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"work-side\"\u003e\n        \u003cspan class=\"work-cat mono\"\u003eSYSTEMS · BACKEND\u003c/span\u003e\n        \u003cspan class=\"work-arrow\"\u003e↗\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/a\u003e\n\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/Course-Registration-System\" target=\"_blank\" rel=\"noopener\" data-project=\"2\" data-cursor=\"OPEN ↗\"\u003e\n      \u003cdiv class=\"work-idx mono\"\u003e/ 03\u003c/div\u003e\n      \u003cdiv class=\"work-main\"\u003e\n        \u003ch3 class=\"work-title\"\u003eCourse Registration&nbsp;System\u003c/h3\u003e\n        \u003cp class=\"work-desc\"\u003eA Java system built on clean object-oriented design and UML modelling — \u003cstrong\u003e4 user roles and more than 8 features\u003c/strong\u003e covering the registration lifecycle: enrolment, CGPA calculation, and complaint handling. I modelled it before writing code, because \u003cstrong\u003ethe specification is part of the source\u003c/strong\u003e.\u003c/p\u003e\n        \u003cdiv class=\"work-tags mono\"\u003eJAVA \u003cb\u003e·\u003c/b\u003e OOP \u003cb\u003e·\u003c/b\u003e UML \u003cb\u003e·\u003c/b\u003e DESIGN PATTERNS\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"work-side\"\u003e\n        \u003cspan class=\"work-cat mono\"\u003eJAVA · OOP\u003c/span\u003e\n        \u003cspan class=\"work-arrow\"\u003e↗\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/a\u003e\n  \u003c/div\u003e\n  \u003cp class=\"work-note mono\" data-fade\u003eALSO ON GITHUB — EXPERIMENTS, TOOLING &amp; OPEN SOURCE → \u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\" data-cursor=\"↗\"\u003egithub.com/yuvraj-23617\u003c/a\u003e\u003c/p\u003e\n\u003c/section>\n\n\u003cdiv class=\"pv\" id=\"pv\" aria-hidden=\"true\"\u003e\n  \u003cdiv class=\"pv-slide pv-s1\"\u003e\u003cspan class=\"lab mono\"\u003e/ 01 — ML · RECOMMENDERS\u003c/span\u003e\u003cspan class=\"big\"\u003eLightGCN\u003cbr\u003eHybrid Engine\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"pv-slide pv-s2\"\u003e\u003cspan class=\"lab mono\"\u003e/ 02 — SYSTEMS · BACKEND\u003c/span\u003e\u003cspan class=\"big\"\u003eCodeJudge\u003cbr\u003eDistributed\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"pv-slide pv-s3\"\u003e\u003cspan class=\"lab mono\"\u003e/ 03 — JAVA · OOP\u003c/span\u003e\u003cspan class=\"big\"\u003eCourse\u003cbr\u003eRegistration\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"scan\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003csection id=\"case-study\"\u003e\n  \u003cspan class=\"sec-ghost\"\u003e04\u003c/span\u003e\n  \u003cdiv class=\"sec-head\"\u003e\u003cspan class=\"sec-idx mono\"\u003e04\u003c/span\u003e\u003cspan class=\"sec-rule\"\u003e\u003c/span\u003e\u003cspan class=\"sec-label mono\"\u003eCASE STUDY · 01\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"cs-grid\"\u003e\n    \u003cdiv class=\"cs-left\"\u003e\n      \u003cp class=\"kicker mono\" data-fade\u003e\u003cb\u003e/\u003c/b\u003e CODEJUDGE — DISTRIBUTED CODING ASSESSMENT PLATFORM · SPRING BOOT · RABBITMQ · DOCKER\u003c/p\u003e\n      \u003ch2 class=\"h2\" data-lines\u003e\n        \u003cspan class=\"ln\"\u003e\u003cspan class=\"lni\"\u003eRunning untrusted\u003c/span\u003e\u003c/span\u003e\n        \u003cspan class=\"ln\"\u003e\u003cspan class=\"lni\"\u003ecode at scale.\u003c/span\u003e\u003c/span\u003e\n      \u003c/h2\u003e\n      \u003cdiv class=\"cs-five\"\u003e3\u003cspan style=\"font-size:.35em;color:var(--ink);margin-left:.15em\"\u003eLANG\u003c/span\u003e\u003c/div\u003e\n      \u003cp class=\"meta\" data-fade\u003eROLE — DESIGN + FULL-STACK IMPLEMENTATION\u003cbr\u003eSTACK — SPRING BOOT · RABBITMQ · DOCKER · POSTGRESQL · MONACO\u003cbr\u003eRESULT — ASYNC JUDGE FOR PYTHON, JAVA &amp; C++\u003cbr\u003eDEPLOY — ONE-CLICK DOCKER COMPOSE, 12 PRE-LOADED PROBLEMS\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"cs-right\"\u003e\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e01 / PROBLEM\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eSynchronous judging \u003cspan\u003edoes not scale.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eMost coding platforms run submissions inline. The request thread blocks while the compiler runs and the test cases execute, which under load leads to \u003cstrong\u003equeue buildup, timeouts, and a broken experience for the user\u003c/strong\u003e. And once you run code that someone else wrote, you are already dealing with security.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e02 / APPROACH\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eDecouple submission \u003cspan\u003efrom execution.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eThe submission endpoint only validates and enqueues. It saves the submission in \u003cstrong\u003ePostgreSQL\u003c/strong\u003e with the verdict \u003ccode\u003ePENDING\u003c/code\u003e and publishes its ID to a \u003cstrong\u003eRabbitMQ\u003c/strong\u003e queue. A judge worker consumes the message, writes the code to a temporary directory, runs it inside an isolated \u003cstrong\u003eDocker\u003c/strong\u003e container, compares the output against visible and hidden test cases, and writes the final verdict back. The frontend polls the submission until the verdict arrives. Spring Boot handles the API, and PostgreSQL holds users, problems, submissions and test cases.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e03 / DECISION\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eSandbox everything, \u003cspan\u003etrust nothing.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eEvery submission runs in a fresh container with \u003cstrong\u003enetworking disabled\u003c/strong\u003e and hard resource limits: \u003cstrong\u003e128MB of memory and 0.5 CPU for Python, 512MB and 1.5 CPU for Java and C++\u003c/strong\u003e, plus an execution timeout. This costs latency, but \u003cstrong\u003eyou cannot run arbitrary user code on the same machine that holds your database\u003c/strong\u003e. It is the decision I would defend hardest in review, and the trade-off is deliberate.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e04 / OUTCOME\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eAsync, multi-language, \u003cspan\u003eand instructor-friendly.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eThe platform supports three languages (Python, Java and C++) and judges submissions asynchronously with verdicts of \u003cstrong\u003eACCEPTED, WRONG_ANSWER or RUNTIME_ERROR\u003c/strong\u003e, along with the recorded execution time. It ships with \u003cstrong\u003e12 pre-loaded problems\u003c/strong\u003e and their visible and hidden test cases. Role-based access separates admins from users, and the admin dashboard lets instructors \u003cstrong\u003ecreate, edit and delete problems and test cases without touching the codebase\u003c/strong\u003e. The candidate interface is a real terminal, so the assessment feels like the tools engineers already use.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e05 / NEXT\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eWhat I would carry \u003cspan\u003eforward.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eReplace polling with \u003cstrong\u003eWebSocket live verdicts\u003c/strong\u003e and move to \u003cstrong\u003estateless JWT authentication\u003c/strong\u003e. Store submission history in the database instead of local storage, add \u003cstrong\u003eRedis caching\u003c/strong\u003e for problems and test cases, and scale out with \u003cstrong\u003emultiple judge workers\u003c/strong\u003e on Kubernetes behind a CI/CD pipeline. I would also harden the sandbox further, because \u003cstrong\u003ethe security model is never finished\u003c/strong\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cblockquote class=\"cs-quote\" data-fade\u003e\"The hard part is not running code. It is \u003cb\u003erunning untrusted code safely.\u003c/b\u003e\"\u003c/blockquote\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003csection id=\"case-study-2\"\u003e\n  \u003cspan class=\"sec-ghost\"\u003e05\u003c/span\u003e\n  \u003cdiv class=\"sec-head\"\u003e\u003cspan class=\"sec-idx mono\"\u003e05\u003c/span\u003e\u003cspan class=\"sec-rule\"\u003e\u003c/span\u003e\u003cspan class=\"sec-label mono\"\u003eCASE STUDY · 02\u003c/span\u003e\u003c/div\u003e\n  \u003cdiv class=\"cs-grid\"\u003e\n    \u003cdiv class=\"cs-left\"\u003e\n      \u003cp class=\"kicker mono\" data-fade\u003e\u003cb\u003e/\u003c/b\u003e E-SUMMIT'26 — IIIT-DELHI'S FLAGSHIP ENTREPRENEURSHIP SUMMIT\u003c/p\u003e\n      \u003ch2 class=\"h2\" data-lines\u003e\n        \u003cspan class=\"ln\"\u003e\u003cspan class=\"lni\"\u003eQualify the prospect,\u003c/span\u003e\u003c/span\u003e\n        \u003cspan class=\"ln\"\u003e\u003cspan class=\"lni\"\u003ethen pitch.\u003c/span\u003e\u003c/span\u003e\n      \u003c/h2\u003e\n      \u003cdiv class=\"cs-five\"\u003e\u003cspan data-count=\"5\"\u003e0\u003c/span\u003e×\u003c/div\u003e\n      \u003cp class=\"meta\" data-fade\u003eROLE — HEAD OF SPONSORSHIP DOMAIN\u003cbr\u003eWINDOW — OCT 2025 → MAR 2026\u003cbr\u003eRESULT — 5× GROWTH IN THE SPONSORSHIP VERTICAL\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"cs-right\"\u003e\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e01 / PROBLEM\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eProspect conversion \u003cspan\u003ewas the broken step.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eThe workflow looked straightforward on paper: identify prospects, assign them to team members, make calls, send emails, follow up, close the sponsorship, and hand the agreed deliverables to the event teams. We tracked prospects and follow-ups in Google Sheets and reviewed progress in weekly meetings. Conversion stayed flat, because we sent every company the same generic pitch: \u003cstrong\u003ewe are organising an entrepreneurship summit, would you like to sponsor us\u003c/strong\u003e. Team members could make the calls and send the emails quickly, but the company had little reason to respond. We were optimising for \u003cstrong\u003ehow many companies we contacted\u003c/strong\u003e, not for whether a company had a specific reason to take part.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e02 / THE FIX\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eResearch before \u003cspan\u003eoutreach.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eI changed the workflow so that \u003cstrong\u003eprospect research happened before anyone reached out\u003c/strong\u003e. Instead of one pitch for every company, we identified something specific about each one that could connect to our student audience. When we approached \u003cstrong\u003ea major consumer brand\u003c/strong\u003e, we tied \u003cstrong\u003ea seasonal campaign it was already running\u003c/strong\u003e to our student audience and positioned E-Summit as a campus opportunity to activate that campaign. We took similar company-specific approaches with other prospects. At the same time, we split specialised outreach across the team: some members handled \u003cstrong\u003ebanks and PSUs through offline outreach\u003c/strong\u003e, while others focused on \u003cstrong\u003egaming partnerships\u003c/strong\u003e.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e03 / SECOND FAILURE\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eThe workflow broke again \u003cspan\u003eafter the close.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eA second problem appeared once sponsors signed on. On event day the workflow became error-prone: each sponsor could have multiple commitments — \u003cstrong\u003ebranding, activations, placements\u003c/strong\u003e and other agreed benefits — and \u003cstrong\u003emissing one could delay or affect the final payment\u003c/strong\u003e. Fulfilment required coordination across different event teams, so the sponsorship vertical had to track what had been promised and whether each item had actually been delivered.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e04 / CONSTRAINT\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eMarch is \u003cspan\u003ethe wrong month.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eThere was also a constraint we could not fully work around: \u003cstrong\u003eE-Summit happens in March, close to the end of the financial year\u003c/strong\u003e. Some companies were already closing their budgets and their sponsorship decisions, which meant that \u003cstrong\u003eeven interested companies sometimes could not complete the process within our timeline\u003c/strong\u003e. We could not remove the constraint, but knowing it let us prioritise the prospects who could still move in time.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cdiv class=\"cs-chapter\" data-fade\u003e\u003cspan class=\"cs-num mono\"\u003e05 / OUTCOME\u003c/span\u003e\n        \u003cdiv\u003e\u003ch4\u003eSame team, \u003cspan\u003edifferent shape of work.\u003c/span\u003e\u003c/h4\u003e\n        \u003cp\u003eIf I were fixing the workflow from scratch, I would fix \u003cstrong\u003eprospect qualification and personalisation first\u003c/strong\u003e. Increasing outreach volume would only have made the first problem larger — more generic pitches to companies with no clear reason to respond. Once we changed how we selected and approached prospects, conversion improved \u003cstrong\u003ewithout simply increasing the number of calls and emails\u003c/strong\u003e. The overall sponsorship vertical grew \u003cstrong\u003e5×\u003c/strong\u003e compared with the previous edition.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\n      \u003cblockquote class=\"cs-quote\" data-fade\u003e\"More outreach volume would only have \u003cb\u003emade the first problem larger.\u003c/b\u003e\"\u003c/blockquote\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\n\u003csection id=\"experience\"\u003e\n  \u003cspan class=\"sec-ghost\"\u003e06\u003c/span\u003e\n  \u003cdiv class=\"sec-head\"\u003e\u003cspan class=\"sec-idx mono\"\u003e06\u003c/span\u003e\u003cspan class=\"sec-rule\"\u003e\u003c/span\u003e\u003cspan class=\"sec-label mono\"\u003eEXPERIENCE\u003c/span\u003e\u003c/div\u003e\n  \u003cp class=\"kicker mono\" data-fade\u003e\u003cb\u003e/\u003c/b\u003e REVERSE CHRONOLOGICAL ORDER — THE WORK OUTSIDE COURSEWORK.\u003c/p\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003e2023 — 2027\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eEDUCATION\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eB.Tech — Computer Science\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eIIIT-DELHI\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eRelevant coursework: \u003cstrong\u003eData Structures & Algorithms, Advanced Programming, Operating Systems, Computer Organisation, Database Management Systems, Collaborative Filtering\u003c/strong\u003e.\u003c/p\u003e\n  \u003c/article\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003eOCT 2025 — MAR 2026\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eLEADERSHIP · IMPACT\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eHead of Sponsorship Domain\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eIIIT-DELHI E-SUMMIT 2026\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eI owned the sponsorship workflow end to end — prospecting, outreach, closing, and delivering the promised benefits — and led a cross-functional team across sponsorship, marketing, and operations. The first broken step was \u003cstrong\u003eprospect conversion\u003c/strong\u003e: a single generic pitch sent to every company. I rebuilt the workflow so that \u003cstrong\u003eprospect research happened before outreach\u003c/strong\u003e, with company-specific positioning (tying Swiggy's Boyfriend's/Single's Day campaign to our student audience) and separate outreach tracks for banks, PSUs, and gaming partnerships. The sponsorship vertical grew \u003cstrong\u003e5×\u003c/strong\u003e over the previous edition.\u003c/p\u003e\n  \u003c/article\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003eAUG 2025 — PRESENT\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eCONTENT\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eMember, Media Service Committee\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eIIIT-DELHI\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eI cover events, produce promotional content, and handle \u003cstrong\u003evisual storytelling\u003c/strong\u003e for institute initiatives, turning what happened into material people want to watch.\u003c/p\u003e\n  \u003c/article\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003eAPR 2025 — AUG 2025\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eDELIVERY\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eGeneral Secretary\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eESYA 2025 · IIIT-DELHI ANNUAL TECH FEST\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eI served as General Secretary for IIIT-Delhi's annual tech fest and worked across the \u003cstrong\u003etechnical, content, and operations teams\u003c/strong\u003e to deliver the event end to end, coordinating cross-functional teams and institute stakeholders against a fixed launch date.\u003c/p\u003e\n  \u003c/article\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003eAUG 2024 — JUL 2025\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eCOMMUNITY\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eCoordinator\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eIEEE-IIIT DELHI STUDENT BRANCH\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eI ran technical sessions, events, and institute-level outreach with the core IEEE team, handling \u003cstrong\u003elogistics, speakers, and the attendee experience\u003c/strong\u003e.\u003c/p\u003e\n  \u003c/article\u003e\n\n  \u003carticle class=\"xp\" data-fade\u003e\n    \u003cdiv class=\"xp-top\"\u003e\u003cspan class=\"xp-date mono\"\u003e2025\u003c/span\u003e\u003cspan class=\"xp-tag mono\"\u003eAWARD\u003c/span\u003e\n      \u003ch4 class=\"xp-role\"\u003eDean's Communication Award\u003c/h4\u003e\u003cspan class=\"xp-org mono\"\u003eIIIT-DELHI · CERTIFICATE OF EXCELLENCE\u003c/span\u003e\u003c/div\u003e\n    \u003cp class=\"xp-desc\"\u003eThe Dean recognised my work in \u003cstrong\u003ephotography, video production, and visual communication\u003c/strong\u003e. I apply the same care to technical write-ups and documentation, and to explaining complex systems to people who were not in the room.\u003c/p\u003e\n  \u003c/article\u003e\n\u003c/section\u003e\n\n\u003csection id=\"skills\"\u003e\n  \u003cspan class=\"sec-ghost\"\u003e07\u003c/span\u003e\n  \u003cdiv class=\"sec-head\"\u003e\u003cspan class=\"sec-idx mono\"\u003e07\u003c/span\u003e\u003cspan class=\"sec-rule\"\u003e\u003c/span\u003e\u003cspan class=\"sec-label mono\"\u003eTOOLKIT\u003c/span\u003e\u003c/div\u003e\n  \u003ch2 class=\"h2\" data-lines\u003e\u003cspan class=\"ln\"\u003e\u003cspan class=\"lni\"\u003eWhat I build with.\u003c/span\u003e\u003c/span\u003e\u003c/h2\u003e\n  \u003cp class=\"kicker mono\" data-fade style=\"margin-top:22px\"\u003e\u003cb\u003e/\u003c/b\u003e THE STACK I REACH FOR, GROUPED BY WHERE IT SITS IN THE SYSTEM.\u003c/p\u003e\n\n  \u003cdiv class=\"tk-grid\"\u003e\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003eLanguages\u003c/h4\u003e\u003cspan\u003e04 +\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n        \u003cspan class=\"tk-item\"\u003ePython\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eJava\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eC\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eC++\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eSQL\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eJavaScript\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eHTML / CSS\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003eSystems &amp; Backend\u003c/h4\u003e\u003cspan\u003e09\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n        \u003cspan class=\"tk-item\"\u003eSpring Boot\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eRabbitMQ\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eDocker\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003ePostgreSQL\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eREST APIs\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eLinux\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eGit &amp; GitHub\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eDistributed Systems\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eAsync Pipelines\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003eML / AI &amp; Data\u003c/h4\u003e\u003cspan\u003e08\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n        \u003cspan class=\"tk-item\"\u003ePyTorch\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eSBERT\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eLightGCN\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eRecommender Systems\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eLLM Integration\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eRAG\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eNumPy · pandas\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eLarge-Scale Data\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003eCS Foundations\u003c/h4\u003e\u003cspan\u003e06\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n        \u003cspan class=\"tk-item\"\u003eData Structures &amp; Algorithms\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eObject-Oriented Design\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eDBMS\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eOperating Systems\u003c/span\u003e\n        \u003cspan class=\"tk-item\"\u003eComputer Organisation\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eUML Modelling\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003eDomain\u003c/h4\u003e\u003cspan\u003e02\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n        \u003cspan class=\"tk-item\"\u003eCollaborative Filtering\u003c/span\u003e\u003cspan class=\"tk-item\"\u003eGraph Learning\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"tk-card\" data-fade\u003e\n      \u003cdiv class=\"tk-head\"\u003e\u003ch4\u003ePractices\u003c/h4\u003e\u003cspan\u003e05\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"tk-list\"\u003e\n dow.addEventListener('resize', () => lenis && lenis.resize(), { passive: true });\n  }\n\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', e => {\n      const id = a.getAttribute('href');\n      if(!id || id.length \u003c 2) return;\n      const t = document.querySelector(id);\n      if(!t) return;\n      e.preventDefault();\n      closeMenu();\n      const offset = -10;\n      if(lenis) lenis.scrollTo(t, { offset, duration: 1.4 });\n      else window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY + offset, behavior: 'smooth' });\n    });\n  });\n\n  ScrollTrigger.create({\n    start: 0, end: 'max',\n    onUpdate: s => {\n      const p = document.getElementById('progress');\n      if(p) p.style.transform = 'scaleX(' + s.progress + ')';\n    }\n  });\n\n  const navEl = document.getElementById('nav');\n  window.addEventListener('scroll', () => {\n    if(navEl) navEl.classList.toggle('scrolled', window.scrollY > 60);\n  }, { passive: true });\n\n  document.querySelectorAll('[data-lines]').forEach(el => {\n    gsap.to(el.querySelectorAll('.lni'), {\n      y: 0, duration: 1.1, ease: 'power4.out', stagger: 0.09,\n      scrollTrigger: { trigger: el, start: 'top 86%' }\n    });\n  });\n  document.querySelectorAll('[data-fade]').forEach(el => {\n    gsap.to(el, {\n      opacity: 1, y: 0, duration: 1, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 88%' }\n    });\n  });\n  document.querySelectorAll('.xp,.cs-chapter,.work,.proc,.tk-card').forEach(el => {\n    gsap.fromTo(el, { y: 44, opacity: 0 }, {\n      y: 0, opacity: 1, duration: 0.95, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 90%' }\n    });\n  });\n  document.querySelectorAll('[data-count]').forEach(el => {\n    const target = parseFloat(el.dataset.count),\n          pad = parseInt(el.dataset.pad || '0'),\n          dec = parseInt(el.dataset.dec || '0'),\n          o = { v: 0 };\n    gsap.to(o, {\n      v: target, duration: 1.8, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 92%' },\n      onUpdate(){\n        let s;\n        if(dec > 0) s = o.v.toFixed(dec);\n        else s = String(Math.round(o.v));\n        if(pad && dec === 0) s = s.padStart(pad, '0');\n        el.textContent = s;\n      }\n    });\n  });\n} else {\n  document.documentElement.classList.remove('js');\n}\n\n/* ================= LOADER + INTRO ================= */\nif(hasST){\n  const intro = gsap.timeline({ paused: true });\n  intro.to('.nav', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0)\n    .to('.hero-title .lni', { y: 0, duration: 1.25, ease: 'power4.out', stagger: 0.11 }, 0.1)\n    .to('.hero-topline', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.5)\n    .to('.avail', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.55)\n    .to('.hero-sub', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.7)\n    .to('.hero-cta', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.8)\n    .to('.stats', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.9);\n\n  const loader = document.getElementById('loader');\n  const logEl = document.getElementById('loadLog');\n  if(reduced){\n    if(loader) loader.style.display = 'none';\n    gsap.set('.nav', { opacity: 1, y: 0 });\n    gsap.set('.hero-title .lni', { y: 0 });\n    gsap.set(['.hero-topline','.avail','.hero-sub','.hero-cta','.stats'], { opacity: 1, y: 0 });\n    gsap.set('[data-fade],[data-lines] .lni', { opacity: 1, y: 0 });\n  } else {\n    const num = document.getElementById('loadNum'),\n          bar = document.getElementById('loadBar'),\n          o = { v: 0 };\n    gsap.to(o, {\n      v: 100, duration: 1.6, ease: 'power2.inOut', delay: 0.2,\n      onUpdate(){\n        if(num) num.textContent = Math.round(o.v);\n        if(bar) bar.style.transform = 'scaleX(' + (o.v / 100) + ')';\n      },\n      onComplete(){\n        gsap.to('#loader', {\n          yPercent: -100, duration: 0.9, ease: 'power4.inOut', delay: 0.15,\n          onComplete(){ if(loader) loader.style.display = 'none'; }\n        });\n        intro.play();\n      }\n    });\n  }\n  window.addEventListener('load', () => {\n    ScrollTrigger.refresh();\n    if(window.gsap && document.fonts && document.fonts.ready){\n      document.fonts.ready.then(() => ScrollTrigger.refresh());\n    }\n  });\n} else {\n  const loader = document.getElementById('loader');\n  if(loader) loader.style.display = 'none';\n}\n\n/* ================= MENU ================= */\nconst menu = document.getElementById('menu');\nconst burger = document.getElementById('burger');\nlet menuOpen = false;\n\nfunction openMenu(){\n  if(menuOpen) return;\n  menuOpen = true;\n  menu.classList.add('open');\n  menu.setAttribute('aria-hidden', 'false');\n  burger.classList.add('open');\n  burger.setAttribute('aria-expanded', 'true');\n  document.documentElement.classList.add('lock');\n  if(lenis) lenis.stop();\n}\nfunction closeMenu(){\n  if(!menuOpen) return;\n  menuOpen = false;\n  menu.classList.remove('open');\n  menu.setAttribute('aria-hidden', 'true');\n  burger.classList.remove('open');\n  burger.setAttribute('aria-expanded', 'false');\n  document.documentElement.classList.remove('lock');\n  if(lenis) lenis.start();\n}\nif(burger) burger.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());\nwindow.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });\nwindow.addEventListener('resize', () => { if(window.innerWidth > 1024 && menuOpen) closeMenu(); });\n\n/* ================= SIDE NAV ================= */\n(function(){\n  const items = [].slice.call(document.querySelectorAll('.sn-item'));\n  const sections = [].slice.call(document.querySelectorAll('main section[id]'));\n  if(!items.length || !sections.length) return;\n\n  function setActive(id){\n    items.forEach(a => a.classList.toggle('active', a.dataset.sn === id));\n  }\n\n  if('IntersectionObserver' in window){\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(en => { if(en.isIntersecting) setActive(en.target.id); });\n    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });\n    sections.forEach(s => io.observe(s));\n  } else {\n    window.addEventListener('scroll', () => {\n      let current = sections[0].id;\n      const y = window.scrollY + window.innerHeight * 0.35;\n      sections.forEach(s => { if(s.offsetTop \u003c= y) current = s.id; });\n      setActive(current);\n    }, { passive: true });\n  }\n})();\n\n/* ================= CURSOR ================= */\nif(!isTouch && !reduced){\n  document.documentElement.classList.add('has-cursor');\n  const dot = document.getElementById('cDot'),\n        ring = document.getElementById('cRing'),\n        label = document.getElementById('cLabel');\n  let mx = window.innerWidth / 2, my = window.innerHeight / 2;\n  let rx = mx, ry = my;\n\n  window.addEventListener('mousemove', e => {\n    mx = e.clientX; my = e.clientY;\n    dot.style.left = mx + 'px';\n    dot.style.top = my + 'px';\n  }, { passive: true });\n\n  (function rl(){\n    rx += (mx - rx) * 0.16;\n    ry += (my - ry) * 0.16;\n    ring.style.left = rx + 'px';\n    ring.style.top = ry + 'px';\n    requestAnimationFrame(rl);\n  })();\n\n  document.addEventListener('mouseover', e => {\n    const lab = e.target.closest('[data-cursor]');\n    const hov = e.target.closest('a,button,.chip,.tk-item');\n    if(lab){\n      ring.classList.add('is-label');\n      ring.classList.remove('is-hover');\n      label.textContent = lab.dataset.cursor;\n    } else if(hov){\n      ring.classList.add('is-hover');\n      ring.classList.remove('is-label');\n    } else {\n      ring.classList.remove('is-hover', 'is-label');\n    }\n  });\n}\n\n/* ================= MAGNETIC ================= */\nif(!isTouch && !reduced && hasGSAP){\n  document.querySelectorAll('.magnetic').forEach(el => {\n    el.addEventListener('mousemove', e => {\n      const r = el.getBoundingClientRect();\n      gsap.to(el, {\n        x: (e.clientX - r.left - r.width/2) * 0.28,\n        y: (e.clientY - r.top - r.height/2) * 0.28,\n        duration: 0.4, ease: 'power3.out'\n      });\n    });\n    el.addEventListener('mouseleave', () => {\n      gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });\n    });\n  });\n}\n\n/* ================= WORK PREVIEW ================= */\nif(!isTouch && !reduced && hasGSAP){\n  const pv = document.getElementById('pv');\n  if(pv){\n    const slides = pv.querySelectorAll('.pv-slide');\n    let shown = false;\n    const px = gsap.quickTo(pv, 'x', { duration: 0.55, ease: 'power3' });\n    const py = gsap.quickTo(pv, 'y', { duration: 0.55, ease: 'power3' });\n    gsap.set(pv, { scale: 0.92, opacity: 0, transformOrigin: 'center' });\n\n    document.querySelectorAll('.work[data-project]').forEach(row => {\n      row.addEventListener('mouseenter', e => {\n        slides.forEach(s => s.classList.remove('active'));\n        const s = slides[+row.dataset.project];\n        if(s) s.classList.add('active');\n        if(!shown){\n          shown = true;\n          gsap.set(pv, { x: e.clientX + 30, y: e.clientY - 120 });\n          gsap.to(pv, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' });\n        }\n      });\n      row.addEventListener('mousemove', e => {\n        px(e.clientX + 30);\n        py(e.clientY - 120);\n        gsap.to(pv, { rotation: clamp((e.movementX || 0) * 0.12, -5, 5), duration: 0.4 });\n      });\n      row.addEventListener('mouseleave', () => {\n        shown = false;\n        gsap.to(pv, { opacity: 0, scale: 0.92, rotation: 0, duration: 0.35, ease: 'power3.in' });\n      });\n    });\n  }\n}\n\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"</script>
<script type="application/json" id="doc-max">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>/* injected by merge_portfolio.py */\n(function(){\n  try{var rs=history.replaceState;history.replaceState=function(){try{return rs.apply(history,arguments);}catch(e){}};}catch(e){}\n  /* in-page links (#about, or a bare #) must scroll this design, never navigate the frame */\n  addEventListener('click',function(e){\n    if(e.defaultPrevented)return;\n    var a=e.target&&e.target.closest?e.target.closest('a[href^=\"#\"]'):null;\n    if(!a)return;\n    e.preventDefault();\n    var h=a.getAttribute('href'),t=null;\n    if(h.length>1){try{t=document.getElementById(decodeURIComponent(h.slice(1)));}catch(_){}}\n    if(t)t.scrollIntoView();else scrollTo(0,0);\n  });\n  /* relay the 1/2/3 shortcuts to the outer page */\n  addEventListener('keydown',function(e){\n    if(parent===window||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey)return;\n    var t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;\n    if(e.key==='1'||e.key==='2'||e.key==='3')parent.postMessage({__portfolioSwitch:true,key:e.key},'*');\n  });\n})();\n\u003c/script>\n\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Yuvraj Verma — SWEAI / Product Engineer\u003c/title>\n\u003cmeta name=\"description\" content=\"Yuvraj Verma — Computer Science at IIIT-Delhi. Distributed systems, ML, and the code that ties it together. Open to SWEAI / Product roles, 2026.\">\n\u003clink rel=\"icon\" href=\"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003crect width='100' height='100' fill='%23c9f421'/>\u003ctext x='50' y='72' font-size='62' font-family='Arial Black' text-anchor='middle' fill='%230a0a0e'>YV\u003c/text>\u003c/svg>\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cscript>document.documentElement.classList.add('js');\u003c/script>\n\n\u003cstyle>\n/* ============================================================\n   YUVRAJ VERMA — VOL.03\n   NFS UNBOUND ENERGY × SPOTIFY WRAPPED STORYTELLING\n   ============================================================ */\n\n:root{\n  --ink:#0a0a0e;\n  --ink-2:#12121a;\n  --ink-3:#1a1a26;\n  --paper:#f5f4ef;\n  --white:#ffffff;\n  --blue:#2745ff;\n  --cyan:#16e0ff;\n  --lime:#c9f421;\n  --pink:#ff2d7e;\n  --orange:#ff5a1f;\n  --yellow:#ffd21f;\n  --violet:#8a5cff;\n  --red:#ff3524;\n  --font-display:'Anton', Impact, sans-serif;\n  --font-body:'Space Grotesk', sans-serif;\n  --font-serif:'Instrument Serif', Georgia, serif;\n  --font-mono:'JetBrains Mono', monospace;\n  --page-pad:clamp(1rem, 4vw, 4rem);\n  --content-max:1560px;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --bd:3px solid var(--ink);\n  --focus:var(--pink);\n}\n\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-padding-top:88px;}\nhtml,body{overflow-x:clip;}\nbody{\n  background:var(--ink);color:var(--paper);\n  font-family:var(--font-body);font-size:1rem;line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\nimg,svg{max-width:100%;display:block;}\na{color:inherit;text-decoration:none;}\nul,ol{list-style:none;}\nbutton{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}\n::selection{background:var(--pink);color:#fff;}\n:focus-visible{outline:3px dashed var(--focus);outline-offset:4px;}\n::-webkit-scrollbar{width:11px;}\n::-webkit-scrollbar-track{background:var(--ink);}\n::-webkit-scrollbar-thumb{background:var(--lime);border:3px solid var(--ink);}\n\n.skip{position:fixed;top:-100px;left:1rem;z-index:400;background:var(--lime);color:var(--ink);\n  font-weight:700;padding:.7rem 1.2rem;border:var(--bd);transition:top .2s;}\n.skip:focus{top:1rem;}\n\n/* ---------- TYPE ---------- */\n.d1{font-family:var(--font-display);text-transform:uppercase;line-height:.88;letter-spacing:.01em;text-wrap:balance;}\n.serif{font-family:var(--font-serif);font-style:italic;text-transform:none;letter-spacing:0;}\n.mono{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;}\n.wrap{width:min(var(--content-max), 100% - 2*var(--page-pad));margin-inline:auto;}\n\n/* ---------- DECOR ---------- */\n.sticker{\n  display:inline-flex;align-items:center;gap:.5rem;\n  font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n  border:var(--bd);padding:.42rem .8rem;background:var(--paper);color:var(--ink);\n  box-shadow:4px 4px 0 var(--ink);transform:rotate(var(--r,-2deg));\n}\n.st-lime{background:var(--lime);} .st-pink{background:var(--pink);color:#fff;}\n.st-cyan{background:var(--cyan);} .st-yellow{background:var(--yellow);}\n.st-ink{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 rgba(0,0,0,.35);}\n.ghost-num{\n  position:absolute;z-index:0;pointer-events:none;user-select:none;\n  font-family:var(--font-display);line-height:.8;\n  color:transparent;-webkit-text-stroke:2px currentColor;opacity:.14;\n}\n\n/* ---------- BUTTONS ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:.7rem;\n  font-family:var(--font-display);text-transform:uppercase;\n  font-size:clamp(.95rem,1.4vw,1.15rem);letter-spacing:.04em;\n  padding:.8rem 1.4rem;border:var(--bd);background:var(--paper);color:var(--ink);\n  box-shadow:6px 6px 0 var(--shc,#000);\n  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s;\n  will-change:transform;\n}\n.btn:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--shc,#000);}\n.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shc,#000);}\n.btn .ar{transition:transform .18s var(--ease);}\n.btn:hover .ar{transform:translate(3px,-3px);}\n.btn-lime{background:var(--lime);}\n.btn-ink{background:var(--ink);color:var(--paper);}\n.btn-ghost{background:transparent;color:inherit;}\n\n/* ---------- PROGRESS + CURSOR ---------- */\n#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:350;\n  background:linear-gradient(90deg,var(--cyan),var(--pink),var(--orange),var(--lime));}\n#curDot,#curRing{position:fixed;top:0;left:0;pointer-events:none;z-index:380;border-radius:50%;display:none;}\nhtml.cursor-on #curDot,html.cursor-on #curRing{display:block;}\nhtml.cursor-on,html.cursor-on a,html.cursor-on button{cursor:none;}\n#curDot{width:9px;height:9px;background:var(--lime);mix-blend-mode:difference;transform:translate(-50%,-50%);}\n#curRing{width:38px;height:38px;border:2px solid var(--lime);mix-blend-mode:difference;\n  transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s;}\n#curRing.big{width:64px;height:64px;border-color:var(--pink);}\n\n/* ---------- NAV ---------- */\n.nav{\n  position:fixed;top:0;left:0;right:0;z-index:300;\n  display:flex;align-items:center;justify-content:space-between;gap:1rem;\n  padding:.75rem var(--page-pad);\n  background:rgba(10,10,14,.86);backdrop-filter:blur(8px);\n  border-bottom:3px solid var(--ink-3);\n}\n.nav-logo{display:flex;align-items:baseline;gap:.4rem;font-family:var(--font-display);\n  font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;}\n.nav-logo .reg{color:var(--lime);font-size:.8em;}\n.nav-links{display:flex;gap:1.1rem;}\n.nav-link{\n  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;\n  color:var(--paper);opacity:.72;padding:.35rem .15rem;border-bottom:2px solid transparent;\n  transition:opacity .15s, border-color .15s, color .15s;\n}\n.nav-link i{font-style:normal;color:var(--lime);margin-right:.3rem;}\n.nav-link:hover,.nav-link.active{opacity:1;border-color:var(--pink);color:#fff;}\n.nav-right{display:flex;align-items:center;gap:1rem;}\n.clockchip{display:flex;align-items:center;gap:.55rem;font-family:var(--font-mono);\n  font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--paper);opacity:.85;}\n.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:blink 1.6s infinite;}\n@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}\n.burger{display:flex;flex-direction:column;gap:5px;padding:.6rem;border:2px solid var(--paper);}\n.burger span{width:24px;height:3px;background:var(--paper);transition:transform .25s var(--ease), opacity .2s;}\nbody.menu-open .burger span:nth-child(1){transform:translateY(8px) rotate(45deg);background:var(--lime);}\nbody.menu-open .burger span:nth-child(2){opacity:0;}\nbody.menu-open .burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg);background:var(--lime);}\n@media (max-width:1120px){.nav-links{display:none;}}\n@media (max-width:640px){.clockchip .clk-label{display:none;}}\n\n/* ---------- MENU ---------- */\n.menu{\n  position:fixed;inset:0;z-index:290;background:var(--ink);\n  transform:translateY(-102%);transition:transform .55s var(--ease);\n  display:flex;flex-direction:column;padding:5.5rem var(--page-pad) 1.6rem;overflow-y:auto;\n}\nbody.menu-open .menu{transform:translateY(0);}\nbody.menu-open{overflow:hidden;}\n.menu-list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.1rem;}\n.menu-link{\n  display:flex;align-items:baseline;gap:1.2rem;\n  font-family:var(--font-display);text-transform:uppercase;\n  font-size:clamp(1.9rem,6vw,4.2rem);line-height:1.08;\n  border-bottom:2px solid var(--ink-3);padding:.3rem 0;\n  transition:color .15s, padding-left .25s var(--ease);\n}\n.menu-link i{font-style:normal;font-family:var(--font-mono);font-size:.8rem;color:var(--lime);min-width:2.2rem;}\n.menu-link:hover{padding-left:1.2rem;}\n.menu-link:nth-child(1):hover{color:var(--lime);}\n.menu-link:nth-child(2):hover{color:var(--violet);}\n.menu-link:nth-child(3):hover{color:var(--cyan);}\n.menu-link:nth-child(4):hover{color:var(--orange);}\n.menu-link:nth-child(5):hover{color:var(--pink);}\n.menu-link:nth-child(6):hover{color:var(--blue);}\n.menu-link:nth-child(7):hover{color:var(--yellow);}\n.menu-link:nth-child(8):hover{color:var(--red);}\n.menu-foot{display:flex;flex-wrap:wrap;gap:.9rem 1.4rem;justify-content:space-between;align-items:center;\n  padding-top:1.2rem;border-top:3px solid var(--ink-3);}\n.menu-foot a{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;\n  border-bottom:2px solid var(--lime);padding-bottom:2px;}\n.menu-close{position:absolute;top:1rem;right:var(--page-pad);font-family:var(--font-mono);\n  font-size:.7rem;letter-spacing:.1em;border:2px solid var(--paper);padding:.55rem .9rem;}\n.menu-close:hover{background:var(--pink);border-color:var(--pink);color:#fff;}\n\n/* ---------- MARQUEE ---------- */\n.marquee{overflow:hidden;border-block:3px solid var(--ink);position:relative;z-index:2;}\n.marquee-track{display:flex;width:max-content;animation:marquee 26s linear infinite;}\n.marquee:hover .marquee-track{animation-play-state:paused;}\n.marquee-track > span{\n  display:flex;align-items:center;gap:2.2rem;padding:.5rem 1.1rem;white-space:nowrap;\n  font-family:var(--font-display);text-transform:uppercase;\n  font-size:clamp(1.15rem,2.3vw,1.8rem);letter-spacing:.03em;\n}\n.m-lime{background:var(--lime);color:var(--ink);}\n@keyframes marquee{to{transform:translateX(-50%);}}\n\n/* ---------- SECTION SCAFFOLD ---------- */\nsection{position:relative;}\n.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;\n  margin-bottom:clamp(1.5rem,3.5vw,2.6rem);}\n.kicker{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;\n  display:inline-flex;align-items:center;gap:.6rem;margin-bottom:.9rem;}\n.kicker::before{content:\"\";width:34px;height:3px;background:currentColor;}\n\n/* ---------- REVEA
