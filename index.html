<!DOCTYPE html>
<!--
  Yuvraj Verma - portfolio (three designs in one page)

  FILE MAP
    1. <style>                the switcher bar and the page around it
    2. <script id="cfg">      settings: default design, section ids, title and colours per design
    3. <script id="doc-...">  the three designs (base, max, paper). Each one is a complete HTML
                              page with its own head, styles, body and scripts, stored as plain
                              text and loaded into an iframe by the switcher script
    4. <script> (last one)    the switcher: loads the designs, keeps scroll in sync, keys 1 / 2 / 3

  EDITING A DESIGN
    Edit it like a normal HTML page (2-space indentation). One rule: inside a design block, a
    closing script tag must be written as  <\/script>  - the switcher turns it back into a real one.
-->
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--page-bg,#07090d)}
body{transition:background-color .7s ease}

/* ── STAGE: three full-screen layers, one per design ─────────────── */
.stage{position:fixed;inset:0;overflow:hidden}
.layer{position:absolute;inset:0;z-index:1;visibility:hidden;pointer-events:none}
.layer.is-current{visibility:visible;pointer-events:auto}
.layer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
  background:transparent;transform-origin:50% 50%}
.scrim{position:absolute;inset:0;z-index:2;background:#000;opacity:0;pointer-events:none}
.ring{position:absolute;left:0;top:0;z-index:4;border-radius:50%;border:3px solid var(--ring,#fff);
  opacity:0;pointer-events:none;will-change:transform,opacity}

/* ── SWITCHER ────────────────────────────────────────────────────── */
.switcher{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:10;
  transform:translateX(-50%);
  font:700 11px/1 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.12em;text-transform:uppercase;
  --sw-bg:rgba(7,9,13,.78);--sw-fg:#8fa6b6;--sw-fg-on:#07090d;--sw-thumb:#00E5FF;
  --sw-border:rgba(0,229,255,.30);--sw-radius:6px;--sw-shadow:0 12px 40px rgba(0,0,0,.45);
  --sw-glow:rgba(0,229,255,.24);
  animation:swRise .9s cubic-bezier(.2,.7,.2,1) .2s both;
}
.switcher[data-design="max"]{
  --sw-bg:rgba(10,10,14,.92);--sw-fg:#f5f4ef;--sw-fg-on:#0a0a0e;--sw-thumb:#c9f421;
  --sw-border:#f5f4ef;--sw-radius:999px;--sw-shadow:4px 4px 0 #ff2d7e;
  --sw-glow:rgba(201,244,33,.22);
}
.switcher[data-design="paper"]{
  --sw-bg:rgba(247,244,234,.94);--sw-fg:#4A4436;--sw-fg-on:#F2EEE3;--sw-thumb:#17140C;
  --sw-border:#17140C;--sw-radius:2px;--sw-shadow:3px 3px 0 #8E1E18;
  --sw-glow:rgba(142,30,24,.2);
}
.sw-track{
  position:relative;display:flex;padding:4px;
  background:var(--sw-bg);border:1.5px solid var(--sw-border);border-radius:var(--sw-radius);
  box-shadow:var(--sw-shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  transition:background-color .7s,border-color .7s,border-radius .7s,box-shadow .7s;
  animation:swLight 3.6s ease-in-out 1s 1;
}
.sw-thumb{
  position:absolute;left:0;top:4px;bottom:4px;width:0;
  background:var(--sw-thumb);border-radius:max(0px,calc(var(--sw-radius) - 4px));
  transition:transform .5s cubic-bezier(.22,.8,.24,1),width .5s cubic-bezier(.22,.8,.24,1),
             background-color .7s,border-radius .7s;
  will-change:transform,width;
}
.sw-btn{
  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding:11px 14px;color:var(--sw-fg);background:none;border:0;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:color .5s,opacity .3s;
}
.sw-btn:hover{opacity:.78}
.sw-btn[aria-checked="true"]{color:var(--sw-fg-on);opacity:1;cursor:default}
.sw-btn:focus-visible{outline:2px solid var(--sw-thumb);outline-offset:3px;border-radius:4px}
.sw-btn .n{opacity:.5;font-weight:500}
.switcher.loading .sw-btn[aria-checked="true"]{opacity:.55}

@keyframes swRise{
  from{opacity:0;transform:translateX(-50%) translateY(14px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
@keyframes swLight{
  0%,100%{box-shadow:var(--sw-shadow),0 0 0 0 transparent}
  35%{box-shadow:var(--sw-shadow),0 0 22px 0 var(--sw-glow)}
}

@media (max-width:520px){
  .switcher{bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:10px}
  .sw-btn{padding:11px 12px}
  .sw-btn .n{display:none}
}
@media (prefers-reduced-motion:reduce){
  .switcher,.sw-track{animation:none !important}
  .sw-thumb,.sw-track,.sw-btn{transition-duration:.01s !important}
}
.switcher.no-anim *{transition:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px system-ui;padding:2rem;text-align:center}
</style>
</head>

<!-- ══════════ DESIGN 1 of 3 - BASE (a complete HTML page, loaded into an iframe) ══════════ -->

<script type="text/html" id="doc-base">
<!doctype html>
<html lang="en">
  <head>
    <script>
      /* injected by merge_portfolio.py */
      (function () {
        try {
          var rs = history.replaceState;
          history.replaceState = function () {
            try {
              return rs.apply(history, arguments);
            } catch (e) {}
          };
        } catch (e) {}
        /* in-page links (#about, or a bare #) must scroll this design, never navigate the frame */
        addEventListener("click", function (e) {
          if (e.defaultPrevented) return;
          var a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
          if (!a) return;
          e.preventDefault();
          var h = a.getAttribute("href"),
            t = null;
          if (h.length > 1) {
            try {
              t = document.getElementById(decodeURIComponent(h.slice(1)));
            } catch (_) {}
          }
          if (t) t.scrollIntoView();
          else scrollTo(0, 0);
        });
        /* relay the 1/2/3 shortcuts to the outer page */
        addEventListener("keydown", function (e) {
          if (parent === window || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
          var t = e.target;
          if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
          if (e.key === "1" || e.key === "2" || e.key === "3")
            parent.postMessage({ __portfolioSwitch: true, key: e.key }, "*");
        });
      })();
    <\/script>

    <style>
      /* ═══════════════════════════════════════════════════════════════
   ★  THEME - FLAT SOLID + PIXEL-BLUEPRINT FRAME                 ★
   ═══════════════════════════════════════════════════════════════ */
      :root {
        --acc: #00e5ff;
        --acc-rgb: 0, 229, 255;
        --acc2: #ff3d00;
        --acc2-rgb: 255, 61, 0;

        --bg: #07090d;
        --bg-rgb: 7, 9, 13;
        --bg-2: #0a0e15;
        --bg-3: #0e141c;
        --bg-overlay: #07090d;

        --on-acc: #07090d;

        --rail-line: rgba(120, 180, 200, 0.2);
        --rail-w: min(1300px, calc(100% - 32px));

        --grid-size: 64px;
        --grid-line: rgba(0, 229, 255, 0.045);
        --grid-line-strong: rgba(0, 229, 255, 0.09);
      }

      :root {
        --ink: #d8e4ec;
        --dim: #5f7688;
        --line: rgba(120, 180, 200, 0.14);
        --line-2: rgba(0, 229, 255, 0.24);
        --pad: clamp(18px, 4.2vw, 68px);
        --nav-h: 64px;
        --disp: "Chakra Petch", sans-serif;
        --mono: "JetBrains Mono", monospace;
        --serif: "Instrument Serif", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: auto;
      }

      html,
      body {
        background-color: var(--bg);
      }
      body {
        color: var(--ink);
        background-color: var(--bg);
        font-family: var(--disp);
        font-size: 16px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        min-height: 100%;
        -webkit-tap-highlight-color: transparent;
        font-weight: 400;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      /* ============================================================
   ★  BACKGROUND GRID - clean two-tier grid, GPU parallax
   ============================================================ */
      .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        --off: 0px;
        -webkit-mask-image: radial-gradient(115% 80% at 50% 45%, #000 32%, transparent 96%);
        mask-image: radial-gradient(115% 80% at 50% 45%, #000 32%, transparent 96%);
      }
      .bg-grid::before,
      .bg-grid::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--grid-size) * -2);
        bottom: calc(var(--grid-size) * -2);
        background-repeat: repeat;
        background-position: 0 0;
        will-change: transform;
        transform: translate3d(0, calc(-1 * var(--off)), 0);
        backface-visibility: hidden;
      }
      .bg-grid::before {
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: var(--grid-size) var(--grid-size);
      }
      .bg-grid::after {
        background-image:
          linear-gradient(to right, var(--grid-line-strong) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line-strong) 1px, transparent 1px);
        background-size: calc(var(--grid-size) * 5) calc(var(--grid-size) * 5);
      }

      /* ============================================================
   PIXEL-BLUEPRINT RAILS - dashed vertical frame at content edge
   ============================================================ */
      .rails {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .rails::before,
      .rails::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background-image: linear-gradient(to bottom, var(--rail-line) 0 6px, transparent 6px 14px);
        background-size: 1px 14px;
        background-repeat: repeat-y;
      }
      .rails::before {
        left: calc(var(--pad) - 8px);
      }
      .rails::after {
        right: calc(var(--pad) - 8px);
      }
      @media (max-width: 900px) {
        .rails::before,
        .rails::after {
          display: none;
        }
      }

      /* ============================================================
   PIXEL MARK - stepped triangle motif (SVG mask)
   ============================================================ */
      .px-mark {
        display: inline-block;
        width: 22px;
        height: 7px;
        flex: 0 0 auto;
        background-color: var(--acc);
        opacity: 0.85;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 6' shape-rendering='crispEdges'><rect x='6' y='0' width='4' height='1.04'/><rect x='4' y='1' width='8' height='1.04'/><rect x='14' y='1' width='3' height='1.04'/><rect x='3' y='2' width='14' height='1.04'/><rect x='1' y='3' width='17' height='1.04'/><rect x='0' y='4' width='20' height='1.04'/><rect x='1' y='5' width='18' height='1.04' opacity='.4'/></svg>")
          center/contain no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 6' shape-rendering='crispEdges'><rect x='6' y='0' width='4' height='1.04'/><rect x='4' y='1' width='8' height='1.04'/><rect x='14' y='1' width='3' height='1.04'/><rect x='3' y='2' width='14' height='1.04'/><rect x='1' y='3' width='17' height='1.04'/><rect x='0' y='4' width='20' height='1.04'/><rect x='1' y='5' width='18' height='1.04' opacity='.4'/></svg>")
          center/contain no-repeat;
      }

      /* ============================================================
   FIXED OVERLAY LAYERS (grain + vignette + progress)
   ============================================================ */
      .vignette {
        position: fixed;
        inset: 0;
        z-index: 87;
        pointer-events: none;
        background: radial-gradient(120% 90% at 50% 50%, transparent 58%, rgba(0, 0, 0, 0.5) 100%);
      }
      @keyframes grain {
        0%,
        100% {
          transform: translate(0, 0);
        }
        20% {
          transform: translate(-4%, -7%);
        }
        40% {
          transform: translate(3%, -10%);
        }
        60% {
          transform: translate(7%, 3%);
        }
        80% {
          transform: translate(-8%, 5%);
        }
      }
      .progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, var(--acc), var(--acc2));
        transform: scaleX(0);
        transform-origin: left;
        z-index: 120;
        box-shadow: 0 0 12px rgba(var(--acc-rgb), 0.6);
      }

      ::selection {
        background: var(--acc);
        color: var(--on-acc);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .mono {

      /* ================= CURSOR ================= */
      .cursor-dot {
        position: fixed;
        z-index: 212;
        width: 5px;
        height: 5px;
        background: var(--acc);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        left: -99px;
        top: -99px;
        box-shadow: 0 0 10px var(--acc);
      }
      .cursor-ring {
        position: fixed;
        z-index: 211;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(var(--acc-rgb), 0.55);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        left: -99px;
        top: -99px;
        transition:
          width 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.3s,
          background 0.3s;
      }
      .cursor-ring::before,
      .cursor-ring::after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        border: 1px solid var(--acc);
        opacity: 0.6;
      }
      .cursor-ring::before {
        top: -3px;
        left: -3px;
        border-right: none;
        border-bottom: none;
      }
      .cursor-ring::after {
        bottom: -3px;
        right: -3px;
        border-left: none;
        border-top: none;

      .cursor-label {

      .cursor-ring.is-label {

      }
      .cursor-ring.is-label .cursor-label {
        opacity: 1;
      }
      @media (hover: none), (pointer: coarse) {
        .cursor-dot,
        .cursor-ring {
          display: none !important;
        }
      }

      /* ================= RIGHT SIDE NAV ================= */
      .sidenav {
        position: fixed;
        right: clamp(10px, 1.7vw, 24px);

      }

      .sn-item:hover {
        color: var(--ink);
      }
      .sn-item:hover .sn-label {
        opacity: 1;
        transform: translateX(0);
      }
      .sn-item:hover .sn-tick {
        width: 24px;
        background: var(--ink);
      }
      .sn-item.active {
        color: var(--acc);
      }
      .sn-item.active .sn-label {
        opacity: 1;
        transform: translateX(0);
      }
      .sn-item.active .sn-tick {
        width: 32px;
        background: var(--acc);
        box-shadow: 0 0 8px var(--acc);
      }
      @media (max-width: 1024px) {
        .sidenav {
          display: none;
        }
      }

      /* ================= LOADER ================= */
      .loader {
        display: none;
      }
      @keyframes logIn {
        to {
          opacity: 1;
        }
      }

      /* ================= NAV / MENU ================= */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px var(--pad);
        border-bottom: 1px solid transparent;
        transition:
          background 0.4s,
          border-color 0.4s;
      }
      .nav.scrolled {
        background: rgba(var(--bg-rgb), 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom-color: var(--line);
      }
      html.js .nav {
        opacity: 0;
        transform: translateY(-16px);
      }
      .nav-logo {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 0.06em;
      }
      .nav-logo .tag {
        font-family: var(--mono);
        font-weight: 400;
        font-size: 10px;
        color: var(--dim);
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .talk {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        padding: 11px 18px;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.14em;
        overflow: hidden;
        transition:
          border-color 0.4s,
          background 0.4s,
          color 0.4s;
        background: transparent;
        --px: 8px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .talk-txt {
        display: block;
        height: 1em;
        overflow: hidden;
        position: relative;
        line-height: 1;
      }
      .talk-txt span {
        display: block;
        line-height: 1;
        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .talk-txt .talk-b {
        position: absolute;
        top: 100%;
        left: 0;
      }
      .talk .talk-arrow {
        display: inline-block;
        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .talk:hover {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--on-acc);
        box-shadow: 0 0 24px rgba(var(--acc-rgb), 0.4);
      }
      .talk:hover .talk-txt span {
        transform: translateY(-100%);
      }
      .talk:hover .talk-arrow {
        transform: translate(3px, -3px) rotate(45deg);
      }
      @media (max-width: 720px) {
        .talk {
          display: none;
        }
      }

      .burger {
        width: 44px;
        height: 44px;
        border: 1px solid var(--line);
        position: relative;
        transition:
          border-color 0.3s,
          background 0.3s;
        flex: 0 0 auto;
        --px: 8px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .burger:hover {
        border-color: var(--acc);
      }
      .burger span {
        position: absolute;
        left: 12px;
        right: 12px;
        height: 1.5px;
        background: var(--ink);
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          top 0.3s,
          bottom 0.3s,
          background 0.3s;
      }
      .burger span:first-child {
        top: 18px;
      }
      .burger span:last-child {
        bottom: 18px;
      }
      .burger.open {
        border-color: var(--acc);
      }
      .burger.open span {
        background: var(--acc);
      }
      .burger.open span:first-child {
        top: 21px;
        transform: rotate(45deg);
      }
      .burger.open span:last-child {
        bottom: 21px;
        transform: rotate(-45deg);
      }

      .menu {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgba(var(--bg-rgb), 0.94);
        backdrop-filter: blur(20px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: calc(var(--nav-h) + 20px) var(--pad) 32px;
        overflow-y: auto;
        overscroll-behavior: contain;
        clip-path: inset(0 0 100% 0);
        visibility: hidden;
        transition:
          clip-path 0.8s cubic-bezier(0.76, 0, 0.24, 1),
          visibility 0s linear 0.8s;
      }
      .menu.open {
        clip-path: inset(0 0 0 0);
        visibility: visible;
        transition:
          clip-path 0.8s cubic-bezier(0.76, 0, 0.24, 1),
          visibility 0s linear 0s;
      }
      .menu-links {
        list-style: none;
        width: 100%;
      }
      .menu-links li {
        border-bottom: 1px solid var(--line);
        overflow: hidden;
      }
      .menu-links a {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 18px;
        padding: clamp(9px, 1.6vh, 16px) 0;
        font-weight: 600;
        text-transform: uppercase;
        font-size: clamp(1.25rem, 4.2vw, 2.8rem);
        letter-spacing: 0.01em;
        line-height: 1;
        transition:
          color 0.35s,
          padding-left 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .menu-links a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: var(--acc);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .menu-links a:hover {
        color: var(--acc);
        padding-left: 18px;
      }
      .menu-links a:hover::after {
        transform: scaleX(1);
      }
      .menu-links .n {
        font-family: var(--mono);
        font-weight: 400;
        font-size: 12px;
        color: var(--dim);
        transition: color 0.35s;
      }
      .menu-links a:hover .n {
        color: var(--acc);
      }
      .menu-links .m-arrow {
        margin-left: auto;
        font-size: 0.5em;
        opacity: 0;
        transform: translateX(-16px);
        transition:
          opacity 0.4s,
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .menu-links a:hover .m-arrow {
        opacity: 1;
        transform: translateX(0);
      }
      .ml-t {
        display: inline-block;
        transform: translateY(112%);
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        transition-delay: 0s;
      }
      .menu.open .ml-t {
        transform: translateY(0);
      }
      .menu.open .menu-links li:nth-child(1) .ml-t {
        transition-delay: 0.14s;
      }
      .menu.open .menu-links li:nth-child(2) .ml-t {
        transition-delay: 0.19s;
      }
      .menu.open .menu-links li:nth-child(3) .ml-t {
        transition-delay: 0.24s;
      }
      .menu.open .menu-links li:nth-child(4) .ml-t {
        transition-delay: 0.29s;
      }
      .menu.open .menu-links li:nth-child(5) .ml-t {
        transition-delay: 0.34s;
      }
      .menu.open .menu-links li:nth-child(6) .ml-t {
        transition-delay: 0.39s;
      }
      .menu.open .menu-links li:nth-child(7) .ml-t {
        transition-delay: 0.44s;
      }
      .menu.open .menu-links li:nth-child(8) .ml-t {
        transition-delay: 0.49s;
      }
      .menu-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 26px;
        justify-content: space-between;
        margin-top: 5vh;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.6s 0.55s,
          transform 0.6s 0.55s;
      }
      .menu.open .menu-foot {
        opacity: 1;
        transform: translateY(0);
      }
      .menu-foot a:hover {
        color: var(--acc);
      }
      @media (max-height: 820px) {
        .menu-links a {
          font-size: clamp(1rem, 3.2vw, 1.8rem);
          padding: clamp(6px, 1vh, 10px) 0;
        }
      }

      /* ================= LAYOUT ================= */
      main {
        position: relative;
        z-index: 2;
      }
      section {
        padding: clamp(74px, 12vh, 170px) var(--pad);
        border-top: 1px solid var(--line);
        position: relative;
        scroll-margin-top: 70px;
      }
      section::before {
        content: "";
        position: absolute;
        top: 0;
        left: var(--pad);
        width: 60px;
        height: 1px;
        background: var(--acc);
        opacity: 0.6;
      }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: clamp(34px, 6.5vh, 80px);
      }
      .sec-idx {
        font-size: 11px;
        color: var(--acc);
        letter-spacing: 0.18em;
        font-weight: 500;
      }
      .sec-rule {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--line), transparent);
      }
      .sec-label {
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 0.18em;
      }
      .sec-head::after {
        content: "";
        display: block;
        width: 22px;
        height: 7px;
        flex: 0 0 auto;
        background-color: var(--acc);
        opacity: 0.85;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 6' shape-rendering='crispEdges'><rect x='6' y='0' width='4' height='1.04'/><rect x='4' y='1' width='8' height='1.04'/><rect x='14' y='1' width='3' height='1.04'/><rect x='3' y='2' width='14' height='1.04'/><rect x='1' y='3' width='17' height='1.04'/><rect x='0' y='4' width='20' height='1.04'/><rect x='1' y='5' width='18' height='1.04' opacity='.4'/></svg>")
          center/contain no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 6' shape-rendering='crispEdges'><rect x='6' y='0' width='4' height='1.04'/><rect x='4' y='1' width='8' height='1.04'/><rect x='14' y='1' width='3' height='1.04'/><rect x='3' y='2' width='14' height='1.04'/><rect x='1' y='3' width='17' height='1.04'/><rect x='0' y='4' width='20' height='1.04'/><rect x='1' y='5' width='18' height='1.04' opacity='.4'/></svg>")
          center/contain no-repeat;
      }
      .sec-ghost {
        position: absolute;
        top: clamp(34px, 6vh, 66px);
        right: var(--pad);
        font-weight: 700;
        font-size: clamp(4rem, 13vw, 11rem);
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 1px rgba(var(--acc-rgb), 0.14);
        pointer-events: none;
        user-select: none;
        font-family: var(--mono);
      }
      .h2 {
        font-weight: 700;
        text-transform: uppercase;
        font-size: clamp(1.85rem, 4.8vw, 4.2rem);
        line-height: 1.02;
        letter-spacing: 0.01em;
      }
      .kicker {
        font-size: 11px;
        color: var(--dim);
        margin-bottom: 22px;
        line-height: 1.8;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .kicker b {
        color: var(--acc);
        font-weight: 400;
      }
      .ln {
        display: block;
        overflow: hidden;
      }
      .lni {
        display: inline-block;
        will-change: transform;
      }
      html.js .lni {
        transform: translateY(114%);
      }
      html.js [data-fade] {
        opacity: 0;
        transform: translateY(28px);
      }

      /* ================= HERO ================= */
      .hero {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: calc(var(--nav-h) + 56px) var(--pad) 34px;
        border-top: none;
      }
      .hero::before {
        display: none;
      }
      html.js .hero-topline,
      html.js .avail,
      html.js .hero-sub,
      html.js .hero-cta,
      html.js .stats {
        opacity: 0;
        transform: translateY(20px);
      }
      .avail {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        border: 1px solid var(--line);
        padding: 9px 16px 9px 9px;
        width: max-content;
        margin-bottom: 3vh;
        max-width: 100%;
        background: rgba(var(--bg-rgb), 0.4);
        backdrop-filter: blur(6px);
        --px: 8px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .avail i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--acc);
        animation: pulse 1.8s infinite;
        flex: 0 0 auto;
        margin-left: 4px;
      }
      .hero-title {
        font-weight: 700;
        text-transform: uppercase;
        line-height: 0.88;
        letter-spacing: 0.005em;
        font-size: clamp(3rem, 12vw, 12rem);
        margin-bottom: 4.5vh;
      }
      .hero-title .serif-line {
        color: var(--acc);
        font-size: 0.98em;
      }
      .hero-title .outline {
        color: transparent;
        -webkit-text-stroke: 1.5px var(--ink);
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 40px;
        align-items: end;
        margin-bottom: 6vh;
      }
      .hero-sub {
        max-width: 54ch;
        color: var(--dim);
        font-size: clamp(0.95rem, 1.15vw, 1.06rem);
      }
      .hero-sub strong {
        color: var(--ink);
        font-weight: 600;
      }
      .hero-sub .glow {
        color: var(--acc);
      }
      .hero-cta {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      .btn {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        padding: 15px 24px;
        border: 1px solid var(--line);
        display: inline-flex;
        gap: 10px;
        align-items: center;
        transition:
          background 0.35s,
          color 0.35s,
          border-color 0.35s,
          box-shadow 0.35s;
        --px: 10px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .btn:hover {
        background: var(--acc);
        color: var(--on-acc);
        border-color: var(--acc);
        box-shadow: 0 0 28px rgba(var(--acc-rgb), 0.45);
      }
      .btn.solid {
        background: var(--ink);
        color: var(--on-acc);
        border-color: var(--ink);
      }
      .btn.solid:hover {
        background: var(--acc);
        border-color: var(--acc);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
      }
      .stat {
        padding: 20px 18px 4px;
        border-left: 1px solid var(--line);
      }
      .stat:first-child {
        border-left: none;
        padding-left: 0;
      }
      .stat .v {
        font-family: var(--mono);
        font-size: clamp(1.25rem, 2.4vw, 2rem);
        color: var(--ink);
      }
      .stat .v sup {
        color: var(--acc);
        font-size: 0.6em;
      }
      .stat .k {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.12em;
        color: var(--dim);
        margin-top: 7px;
        text-transform: uppercase;
        line-height: 1.6;
      }
      @keyframes cue {
        to {
          top: 110%;
        }
      }
      @media (max-width: 1024px) {
      }
      @media (max-width: 820px) {
        .hero-grid {
          grid-template-columns: 1fr;
          gap: 26px;
        }
        .hero-cta {
          justify-content: flex-start;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .stat:nth-child(3) {
          border-left: none;
          padding-left: 0;
        }
      }

      /* ================= MARQUEE ================= */
      .marquee {
        overflow: hidden;
        border-top: 1px solid var(--line);
        padding: clamp(14px, 2.6vh, 30px) 0;
        position: relative;
        z-index: 2;
        background: rgba(var(--bg-rgb), 0.35);
        backdrop-filter: blur(4px);
      }
      @keyframes mq {
        to {
          transform: translateX(-50%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
      }

      /* ================= ABOUT ================= */
      .about-grid {
        display: grid;
        grid-template-columns: 5fr 7fr;
        gap: clamp(36px, 5vw, 90px);
      }
      .id-card {
        border: 1px solid var(--line);
        padding: 26px;
        position: sticky;
        top: 110px;
        background: rgba(var(--bg-2), 0.72);
        backdrop-filter: blur(12px);
        align-self: start;
        --px: 14px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .id-card::before,
      .id-card::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border: 1px solid var(--acc);
      }
      .id-card::before {
        top: 6px;
        left: 6px;
        border-right: none;
        border-bottom: none;
      }
      .id-card::after {
        bottom: 6px;
        right: 6px;
        border-left: none;
        border-top: none;
      }
      .id-card .mono-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 11px 0;
        border-bottom: 1px dashed rgba(120, 180, 200, 0.16);
        font-family: var(--mono);
        font-size: 11px;
      }
      .id-card .mono-row:last-child {
        border-bottom: none;
      }
      .id-card .mono-row b {
        color: var(--dim);
        font-weight: 400;
      }
      .id-card .mono-row span {
        text-align: right;
      }
      .id-badge {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
      }
      .id-badge .yy {
        width: 52px;
        height: 52px;
        background: var(--acc);
        color: var(--on-acc);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 20px;
        flex: 0 0 auto;
        box-shadow: 0 0 20px rgba(var(--acc-rgb), 0.4);
      }
      .id-badge .nm {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 16px;
        line-height: 1.15;
      }
      .id-badge .nm small {
        display: block;
        font-family: var(--mono);
        font-weight: 400;
        font-size: 10px;
        color: var(--dim);
        margin-top: 4px;
      }
      .status-dot {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--acc);
      }
      .status-dot i {
        width: 7px;
        height: 7px;
        background: var(--acc);
        border-radius: 50%;
        animation: pulse 1.8s infinite;
      }
      .about-statement {
        font-weight: 700;
        text-transform: uppercase;
        font-size: clamp(1.8rem, 4.4vw, 3.6rem);
        line-height: 1.02;
        letter-spacing: 0.01em;
        margin-bottom: 34px;
      }
      .about-statement .serif {
        font-size: 1.12em;
        color: var(--acc);
      }
      .about-copy {
        display: grid;
        gap: 20px;
        color: var(--dim);
        max-width: 64ch;
        margin-bottom: 26px;
      }
      .about-copy strong {
        color: var(--ink);
        font-weight: 600;
      }
      .aside {
        font-family: var(--serif);
        font-style: italic;
        font-size: clamp(1.1rem, 1.8vw, 1.45rem);
        color: var(--ink);
        max-width: 38ch;
        margin-bottom: 34px;
      }
      .aside b {
        color: var(--acc);
        font-weight: 400;
      }
      .chip {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 15px;
        border: 1px solid var(--line);
        transition:
          background 0.3s,
          color 0.3s,
          border-color 0.3s,
          box-shadow 0.3s;
        color: var(--dim);
        --px: 6px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .chip:hover {
        background: var(--acc);
        color: var(--on-acc);
        border-color: var(--acc);
        box-shadow: 0 0 18px rgba(var(--acc-rgb), 0.4);
      }
      @media (max-width: 900px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
        .id-card {
          position: static;
        }
      }

      /* ================= PROCESS ================= */
      .proc-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--line);
        margin-top: clamp(34px, 6vh, 64px);
      }
      .proc {
        border-left: 1px solid var(--line);
        padding: 34px 26px 40px;
        transition: background 0.4s;
        position: relative;
      }
      .proc:first-child {
        border-left: none;
        padding-left: 0;
      }
      .proc:hover {
        background: rgba(var(--acc-rgb), 0.03);
      }
      .proc-n {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--acc);
        display: block;
        margin-bottom: 24px;
        letter-spacing: 0.14em;
      }
      .proc h4 {
        font-weight: 600;
        text-transform: uppercase;
        font-size: clamp(1rem, 1.5vw, 1.25rem);
        letter-spacing: 0.02em;
        margin-bottom: 12px;
      }
      .proc p {
        color: var(--dim);
        font-size: 0.9rem;
        max-width: 38ch;
      }
      .proc p strong {
        color: var(--ink);
        font-weight: 600;
      }
      .proc p em {
        font-family: var(--serif);
        font-style: italic;
        color: var(--ink);
        font-size: 1.03em;
      }
      @media (max-width: 900px) {
        .proc-grid {
          grid-template-columns: 1fr;
        }
        .proc {
          border-left: none;
          border-top: 1px solid var(--line);
          padding: 24px 0;
        }
        .proc:first-child {
          border-top: none;
          padding-top: 0;
        }
      }

      /* ================= WORK ================= */
      .work-list {
        border-bottom: 1px solid var(--line);
      }
      .work {
        display: grid;
        grid-template-columns: 70px 1fr 250px;
        gap: 28px;
        padding: 44px 0;
        border-top: 1px solid var(--line);
        position: relative;
        transition: padding-left 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .work-idx {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        padding-top: 10px;
        transition: color 0.3s;
        letter-spacing: 0.14em;
      }
      .work-title {
        font-weight: 600;
        text-transform: uppercase;
        font-size: clamp(1.5rem, 3.4vw, 3rem);
        line-height: 1;
        letter-spacing: 0.005em;
        transition: color 0.3s;
      }
      .work-desc {
        color: var(--dim);
        max-width: 66ch;
        margin: 16px 0 18px;
        font-size: 0.95rem;
      }
      .work-desc strong {
        color: var(--ink);
        font-weight: 600;
      }
      .work-tags {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--dim);
        line-height: 1.8;
      }
      .work-tags b {
        color: var(--acc);
        font-weight: 400;
      }
      .work-side {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        text-align: right;
        gap: 14px;
      }
      .work-cat {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--dim);
        transition: color 0.3s;
      }
      .work-arrow {
        font-size: 28px;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.3s;
      }
      .work.soon {
        border-top: 1px dashed rgba(120, 180, 200, 0.28);
      }
      .work.soon .work-title {
        font-family: var(--serif);
        font-style: italic;
        text-transform: none;
        font-weight: 400;
        letter-spacing: 0;
        font-size: clamp(1.7rem, 3.6vw, 3.2rem);
      }
      .soon-tag {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--acc);
        border: 1px solid rgba(var(--acc-rgb), 0.45);
        padding: 4px 10px;
      }
      .work-note {
        padding: 22px 0;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        line-height: 2;
      }
      .work-note a {
        color: var(--ink);
        border-bottom: 1px solid var(--acc);
        padding-bottom: 1px;
        transition: color 0.3s;
      }
      .work-note a:hover {
        color: var(--acc);
      }
      @media (hover: hover) {
        .work:hover {
          padding-left: 22px;
        }
        .work:hover .work-idx {
          color: var(--acc);
        }
        .work:hover .work-title {
          color: var(--acc);
        }
        .work:hover .work-cat {
          color: var(--ink);
        }
        .work:hover .work-arrow {
          transform: translate(8px, -8px);
          color: var(--acc);
        }
      }
      @media (max-width: 820px) {
        .work {
          grid-template-columns: 1fr;
          gap: 14px;
          padding: 32px 0;
        }
        .work-idx {
          padding-top: 0;
        }
        .work-side {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          width: 100%;
        }
        .work-arrow {
          margin-left: auto;
          font-size: 22px;
        }
      }

      /* ================= WORK HOVER PREVIEW ================= */
      .pv {
        position: fixed;
        top: 0;
        left: 0;
        width: min(370px, 72vw);
        aspect-ratio: 16/10.5;
        z-index: 60;
        pointer-events: none;
        opacity: 0;
        overflow: hidden;
        border: 1px solid var(--line-2);
        will-change: transform;
        display: none;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(var(--acc-rgb), 0.15);
        --px: 12px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      @media (hover: hover) and (pointer: fine) {
        .pv {
          display: block;
        }
      }
      .pv-slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.35s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        background-color: var(--bg-3);
      }
      .pv-slide.active {
        opacity: 1;
      }
      .pv-slide .lab {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--acc);
      }
      .pv-slide .big {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 25px;
        line-height: 0.95;
        letter-spacing: 0.01em;
        color: var(--ink);
      }
      .pv-s1 {
        background-image: radial-gradient(
          120% 120% at 20% 15%,
          rgba(var(--acc-rgb), 0.42) 0%,
          rgba(var(--acc-rgb), 0.1) 45%,
          rgba(var(--acc-rgb), 0) 100%
        );
      }
      .pv-s2 {
        background-image:
          repeating-linear-gradient(
            0deg,
            rgba(var(--acc-rgb), 0.18) 0 2px,
            rgba(var(--acc-rgb), 0) 2px 26px
          ),
          radial-gradient(
            80% 90% at 80% 90%,
            rgba(var(--acc-rgb), 0.38),
            rgba(var(--acc-rgb), 0) 100%
          );
      }
      .pv-s3 {
        background-image:
          repeating-linear-gradient(
            90deg,
            rgba(var(--acc-rgb), 0.2) 0 1px,
            rgba(var(--acc-rgb), 0) 1px 30px
          ),
          radial-gradient(
            90% 90% at 30% 80%,
            rgba(var(--acc-rgb), 0.36),
            rgba(var(--acc-rgb), 0) 100%
          );
      }
      .pv .scan {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, 0.22) 3px 4px);
        pointer-events: none;
      }

      /* ================= CASE STUDY ================= */
      .cs-grid {
        display: grid;
        grid-template-columns: 5fr 7fr;
        gap: clamp(36px, 5vw, 90px);
      }
      .cs-left {
        position: sticky;
        top: 110px;
        align-self: start;
      }
      .cs-five {
        font-weight: 700;
        font-size: clamp(4.6rem, 15vw, 13rem);
        line-height: 0.9;
        letter-spacing: -0.02em;
        color: var(--acc);
        margin: 26px 0 18px;
      }
      .cs-left .meta {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.1em;
        line-height: 2.1;
      }
      .cs-chapter {
        border-top: 1px solid var(--line);
        padding: 34px 0;
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 24px;
      }
      .cs-num {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--acc);
        padding-top: 5px;
        letter-spacing: 0.14em;
      }
      .cs-chapter h4 {
        font-weight: 600;
        text-transform: uppercase;
        font-size: clamp(1.05rem, 1.7vw, 1.45rem);
        margin-bottom: 12px;
        letter-spacing: 0.02em;
      }
      .cs-chapter h4 span {
        color: var(--dim);
        font-weight: 400;
      }
      .cs-chapter p {
        color: var(--dim);
        max-width: 58ch;
      }
      .cs-chapter p strong {
        color: var(--ink);
        font-weight: 600;
      }
      .playbook {
        list-style: none;
        margin-top: 18px;
        display: grid;
        gap: 12px;
        max-width: 62ch;
      }
      .playbook li {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 12px;
        font-size: 0.92rem;
        color: var(--dim);
        border-left: 1px solid var(--line);
        padding-left: 16px;
        transition:
          border-color 0.35s,
          color 0.35s;
      }
      .playbook li:hover {
        border-color: var(--acc);
      }
      .playbook li b {
        font-family: var(--mono);
        color: var(--acc);
        font-weight: 400;
        font-size: 11px;
      }
      .playbook li strong {
        color: var(--ink);
        font-weight: 600;
      }
      @media (max-width: 900px) {
        .cs-grid {
          grid-template-columns: 1fr;
        }
        .cs-left {
          position: static;
        }
      }
      @media (max-width: 560px) {
        .cs-chapter {
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 26px 0;
        }
        .cs-num {
          padding-top: 0;
        }
      }

      /* ================= EXPERIENCE ================= */
      .xp {
        border-top: 1px solid var(--line);
        padding: 32px 0;
        transition:
          padding-left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.3s;
      }
      .xp:last-of-type {
        border-bottom: 1px solid var(--line);
      }
      .xp-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px 24px;
        margin-bottom: 12px;
      }
      .xp-date {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
        letter-spacing: 0.1em;
        min-width: 168px;
      }
      .xp-tag {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.14em;
        padding: 5px 12px;
        border: 1px solid var(--line);
        color: var(--acc);
        transition: border-color 0.35s;
      }
      .xp-role {
        font-weight: 600;
        text-transform: uppercase;
        font-size: clamp(1.05rem, 1.9vw, 1.55rem);
        letter-spacing: 0.02em;
      }
      .xp-org {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        margin-left: auto;
        text-align: right;
      }
      .xp-desc {
        color: var(--dim);
        max-width: 78ch;
        font-size: 0.95rem;
      }
      .xp-desc strong {
        color: var(--ink);
        font-weight: 600;
      }
      @media (hover: hover) {
        .xp:hover {
          padding-left: 20px;
          background: rgba(var(--acc-rgb), 0.03);
        }
        .xp:hover .xp-tag {
          border-color: rgba(var(--acc-rgb), 0.6);
          box-shadow: 0 0 14px rgba(var(--acc-rgb), 0.2);
        }
      }
      @media (max-width: 760px) {
        .xp-org {
          margin-left: 0;
          text-align: left;
          width: 100%;
        }
        .xp-date {
          min-width: 0;
        }
      }

      /* ================= TOOLKIT ================= */
      .tk-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: clamp(34px, 5vh, 54px);
      }
      .tk-card {
        position: relative;
        border: 1px solid var(--line);
        background: rgba(var(--bg-2), 0.72);
        backdrop-filter: blur(10px);
        padding: 26px 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow: hidden;
        transition:
          background 0.4s,
          border-color 0.4s,
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s;
        --px: 12px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .tk-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--acc);
        transform: scaleY(0);
        transform-origin: top;
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 12px var(--acc);
      }
      .tk-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      .tk-head h4 {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 500;
        color: var(--ink);
      }
      .tk-head span {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--acc);
      }
      .tk-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tk-item {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.05em;
        padding: 7px 11px;
        border: 1px solid var(--line);
        color: var(--dim);
        transition:
          background 0.28s,
          color 0.28s,
          border-color 0.28s,
          transform 0.28s,
          box-shadow 0.28s;
      }
      .tk-item:hover {
        color: var(--on-acc);
        background: var(--acc);
        border-color: var(--acc);
        transform: translateY(-2px);
        box-shadow: 0 0 16px rgba(var(--acc-rgb), 0.5);
      }
      @media (hover: hover) {
        .tk-card:hover {
          background: var(--bg-3);
          border-color: rgba(var(--acc-rgb), 0.38);
          transform: translateY(-4px);
          box-shadow:
            0 20px 40px rgba(0, 0, 0, 0.4),
            0 0 30px rgba(var(--acc-rgb), 0.08);
        }
        .tk-card:hover::before {
          transform: scaleY(1);
        }
      }
      @media (max-width: 900px) {
        .tk-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ================= CONTACT ================= */
      .contact-big {
        font-weight: 700;
        text-transform: uppercase;
        font-size: clamp(2.1rem, 8vw, 7rem);
        line-height: 0.96;
        letter-spacing: 0.005em;
        margin-bottom: 36px;
      }
      .contact-big .serif {
        color: var(--acc);
        font-size: 1.06em;
      }
      .contact-big .outline {
        color: transparent;
        -webkit-text-stroke: 1.4px var(--ink);
      }
      .lead {
        color: var(--dim);
        max-width: 60ch;
        font-size: clamp(0.95rem, 1.2vw, 1.08rem);
        margin-bottom: 40px;
      }
      .email-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 14px 20px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 26px 0;
        margin-bottom: 48px;
      }
      .email-line .lbl {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 0.16em;
      }
      .email-big {
        font-family: var(--mono);
        font-size: clamp(1rem, 3.1vw, 2rem);
        position: relative;
        word-break: break-word;
      }
      .email-big::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        height: 1px;
        width: 100%;
        background: var(--acc);
        box-shadow: 0 0 8px var(--acc);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .email-big:hover {
        color: var(--acc);
      }
      .email-big:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }
      .email-line .hint {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
        margin-left: auto;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        border: 1px solid var(--line);
        background: rgba(var(--bg-2), 0.72);
        backdrop-filter: blur(10px);
        padding: 26px;
        display: flex;
        flex-direction: column;
        gap: 34px;
        min-height: 190px;
        transition:
          background 0.4s,
          color 0.4s,
          border-color 0.4s,
          transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s;
        --px: 12px;
        clip-path: polygon(
          0 var(--px),
          var(--px) var(--px),
          var(--px) 0,
          calc(100% - var(--px)) 0,
          calc(100% - var(--px)) var(--px),
          100% var(--px),
          100% calc(100% - var(--px)),
          calc(100% - var(--px)) calc(100% - var(--px)),
          calc(100% - var(--px)) 100%,
          var(--px) 100%,
          var(--px) calc(100% - var(--px)),
          0 calc(100% - var(--px))
        );
      }
      .card:hover {
        background: var(--acc);
        color: var(--on-acc);
        border-color: var(--acc);
        transform: translateY(-4px);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(var(--acc-rgb), 0.4);
      }
      .card:hover .c-tag,
      .card:hover .c-desc {
        color: rgba(var(--bg-rgb), 0.75);
      }
      .c-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .c-tag {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--dim);
        transition: color 0.4s;
      }
      .c-arrow {
        font-size: 22px;
        transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card:hover .c-arrow {
        transform: translate(6px, -6px);
      }
      .c-title {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      .c-desc {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);

      <section id="process">
        <span class="sec-ghost">02</span>
        <div class="sec-head">
          <span class="sec-idx mono">02</span><span class="sec-rule"></span
          ><span class="sec-label mono">HOW I BUILD</span>
        </div>
        <h2 class="h2" data-lines>
          <span class="ln"><span class="lni">FROM THE PAPER</span></span>
          <span class="ln"
            ><span class="lni"
              >to <span class="serif" style="color: var(--acc)">shipped code.</span></span
            ></span
          >
        </h2>

        <div class="proc-grid">
          <div class="proc" data-fade>
            <span class="proc-n mono">/ 01</span>
            <h4>Model</h4>
            <p>
              Read the paper before writing code. When I reproduced <em>LightGCN</em>, the first
              task was not writing PyTorch. It was understanding
              <strong>what the original GCN did wrong</strong>, and why a simpler propagation could
              outperform it. The data has a shape, and the model should follow it rather than impose
              one.
            </p>
          </div>
          <div class="proc" data-fade>
            <span class="proc-n mono">/ 02</span>
            <h4>Build</h4>
            <p>
              Building from scratch means building every part. I implemented and verified
              <strong
                >adjacency normalisation, layer-wise propagation, and the ranking objective</strong
              >
              separately before combining them. The paper's own ablations made one point clear:
              <strong>adding layers does not add signal.</strong>
            </p>
          </div>
          <div class="proc" data-fade>
            <span class="proc-n mono">/ 03</span>
            <h4>Test</h4>
            <p>
              Match the protocol, not only the metric. We used the same
              <strong>leave-one-out split and negative sampling</strong> as the paper, so any
              difference we saw came from the model rather than from our testing. The ablations over
              depth and dimension helped us understand our own implementation as much as they
              measured it.
            </p>
          </div>
          <div class="proc" data-fade>
            <span class="proc-n mono">/ 04</span>
            <h4>Ship</h4>
            <p>
              A result is only as trustworthy as the caveats you attach to it.
              <strong>Write down what you cannot claim</strong> - the small sample, the baseline
              that is not comparable, the variance you have not ruled out. Releasing work means
              being honest about its scope, not just loud about the number.
            </p>
          </div>
        </div>
      </section>

        <div class="sec-head">
          <span class="sec-idx mono">04</span><span class="sec-rule"></span
          ><span class="sec-label mono">CASE STUDY · 01</span>
        </div>
        <div class="cs-grid">
          <div class="cs-left">
            <p class="kicker mono" data-fade>
              <b>/</b> CODEJUDGE - DISTRIBUTED CODING ASSESSMENT PLATFORM · SPRING BOOT · RABBITMQ ·
              DOCKER
            </p>
            <h2 class="h2" data-lines>
              <span class="ln"><span class="lni">Running untrusted</span></span>
              <span class="ln"><span class="lni">code at scale.</span></span>
            </h2>
            <div class="cs-five">
              3<span style="font-size: 0.35em; color: var(--ink); margin-left: 0.15em">LANG</span>
            </div>
            <p class="meta" data-fade>
              ROLE - DESIGN + FULL-STACK IMPLEMENTATION<br />STACK - SPRING BOOT · RABBITMQ · DOCKER
              · POSTGRESQL · MONACO<br />RESULT - ASYNC JUDGE FOR PYTHON, JAVA &amp; C++<br />DEPLOY
              - ONE-CLICK DOCKER COMPOSE, 12 PRE-LOADED PROBLEMS
            </p>
          </div>
          <div class="cs-right">
            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">01 / PROBLEM</span>
              <div>
                <h4>Synchronous judging <span>does not scale.</span></h4>
                <p>
                  Most coding platforms run submissions inline. The request thread blocks while the
                  compiler runs and the test cases execute, which under load leads to
                  <strong>queue buildup, timeouts, and a broken experience for the user</strong>.
                  And once you run code that someone else wrote, you are already dealing with
                  security.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">02 / APPROACH</span>
              <div>
                <h4>Decouple submission <span>from execution.</span></h4>
                <p>
                  The submission endpoint only validates and enqueues. It saves the submission in
                  <strong>PostgreSQL</strong> with the verdict <code>PENDING</code> and publishes
                  its ID to a <strong>RabbitMQ</strong> queue. A judge worker consumes the message,
                  writes the code to a temporary directory, runs it inside an isolated
                  <strong>Docker</strong> container, compares the output against visible and hidden
                  test cases, and writes the final verdict back. The frontend polls the submission
                  until the verdict arrives. Spring Boot handles the API, and PostgreSQL holds
                  users, problems, submissions and test cases.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">03 / DECISION</span>
              <div>
                <h4>Sandbox everything, <span>trust nothing.</span></h4>
                <p>
                  Every submission runs in a fresh container with
                  <strong>networking disabled</strong> and hard resource limits:
                  <strong
                    >128MB of memory and 0.5 CPU for Python, 512MB and 1.5 CPU for Java and
                    C++</strong
                  >, plus an execution timeout. This costs latency, but
                  <strong
                    >you cannot run arbitrary user code on the same machine that holds your
                    database</strong
                  >. It is the decision I would defend hardest in review, and the trade-off is
                  deliberate.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">04 / OUTCOME</span>
              <div>
                <h4>Async, multi-language, <span>and instructor-friendly.</span></h4>
                <p>
                  The platform supports three languages (Python, Java and C++) and judges
                  submissions asynchronously with verdicts of
                  <strong>ACCEPTED, WRONG_ANSWER or RUNTIME_ERROR</strong>, along with the recorded
                  execution time. It ships with <strong>12 pre-loaded problems</strong> and their
                  visible and hidden test cases. Role-based access separates admins from users, and
                  the admin dashboard lets instructors
                  <strong
                    >create, edit and delete problems and test cases without touching the
                    codebase</strong
                  >. The candidate interface is a real terminal, so the assessment feels like the
                  tools engineers already use.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">05 / NEXT</span>
              <div>
                <h4>What I would carry <span>forward.</span></h4>
                <p>
                  Replace polling with <strong>WebSocket live verdicts</strong> and move to
                  <strong>stateless JWT authentication</strong>. Store submission history in the
                  database instead of local storage, add <strong>Redis caching</strong> for problems
                  and test cases, and scale out with <strong>multiple judge workers</strong> on
                  Kubernetes behind a CI/CD pipeline. I would also harden the sandbox further,
                  because <strong>the security model is never finished</strong>.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="case-study-2">
        <span class="sec-ghost">05</span>
        <div class="sec-head">
          <span class="sec-idx mono">05</span><span class="sec-rule"></span
          ><span class="sec-label mono">CASE STUDY · 02</span>
        </div>
        <div class="cs-grid">
          <div class="cs-left">
            <p class="kicker mono" data-fade>
              <b>/</b> E-SUMMIT'26 - IIIT-DELHI'S FLAGSHIP ENTREPRENEURSHIP SUMMIT
            </p>
            <h2 class="h2" data-lines>
              <span class="ln"><span class="lni">Qualify the prospect,</span></span>
              <span class="ln"><span class="lni">then pitch.</span></span>
            </h2>
            <div class="cs-five"><span data-count="5">0</span>×</div>
            <p class="meta" data-fade>
              ROLE - HEAD OF SPONSORSHIP DOMAIN<br />WINDOW - OCT 2025 → MAR 2026<br />RESULT - 5×
              GROWTH IN THE SPONSORSHIP VERTICAL
            </p>
          </div>
          <div class="cs-right">
            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">01 / PROBLEM</span>
              <div>
                <h4>Prospect conversion <span>was the broken step.</span></h4>
                <p>
                  The workflow looked straightforward on paper: identify prospects, assign them to
                  team members, make calls, send emails, follow up, close the sponsorship, and hand
                  the agreed deliverables to the event teams. We tracked prospects and follow-ups in
                  Google Sheets and reviewed progress in weekly meetings. Conversion stayed flat,
                  because we sent every company the same generic pitch:
                  <strong
                    >we are organising an entrepreneurship summit, would you like to sponsor
                    us</strong
                  >. Team members could make the calls and send the emails quickly, but the company
                  had little reason to respond. We were optimising for
                  <strong>how many companies we contacted</strong>, not for whether a company had a
                  specific reason to take part.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">02 / THE FIX</span>
              <div>
                <h4>Research before <span>outreach.</span></h4>
                <p>
                  I changed the workflow so that
                  <strong>prospect research happened before anyone reached out</strong>. Instead of
                  one pitch for every company, we identified something specific about each one that
                  could connect to our student audience. When we approached
                  <strong>a major consumer brand</strong>, we tied
                  <strong>a seasonal campaign it was already running</strong> to our student
                  audience and positioned E-Summit as a campus opportunity to activate that
                  campaign. We took similar company-specific approaches with other prospects. At the
                  same time, we split specialised outreach across the team: some members handled
                  <strong>banks and PSUs through offline outreach</strong>, while others focused on
                  <strong>gaming partnerships</strong>.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">03 / SECOND FAILURE</span>
              <div>
                <h4>The workflow broke again <span>after the close.</span></h4>
                <p>
                  A second problem appeared once sponsors signed on. On event day the workflow
                  became error-prone: each sponsor could have multiple commitments -
                  <strong>branding, activations, placements</strong> and other agreed benefits - and
                  <strong>missing one could delay or affect the final payment</strong>. Fulfilment
                  required coordination across different event teams, so the sponsorship vertical
                  had to track what had been promised and whether each item had actually been
                  delivered.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">04 / CONSTRAINT</span>
              <div>
                <h4>March is <span>the wrong month.</span></h4>
                <p>
                  There was also a constraint we could not fully work around:
                  <strong>E-Summit happens in March, close to the end of the financial year</strong
                  >. Some companies were already closing their budgets and their sponsorship
                  decisions, which meant that
                  <strong
                    >even interested companies sometimes could not complete the process within our
                    timeline</strong
                  >. We could not remove the constraint, but knowing it let us prioritise the
                  prospects who could still move in time.
                </p>
              </div>
            </div>

            <div class="cs-chapter" data-fade>
              <span class="cs-num mono">05 / OUTCOME</span>
              <div>
                <h4>Same team, <span>different shape of work.</span></h4>
                <p>
                  If I were fixing the workflow from scratch, I would fix
                  <strong>prospect qualification and personalisation first</strong>. Increasing
                  outreach volume would only have made the first problem larger - more generic
                  pitches to companies with no clear reason to respond. Once we changed how we
                  selected and approached prospects, conversion improved
                  <strong>without simply increasing the number of calls and emails</strong>. The
                  overall sponsorship vertical grew <strong>5×</strong> compared with the previous
                  edition.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>

          document.querySelectorAll("[data-count]").forEach((el) => {

              dec = parseInt(el.dataset.dec || "0"),
              o = { v: 0 };

              v: target,
              duration: 1.8,
              ease: "power3.out",
              scrollTrigger: { trigger: el, start: "top 92%" },
              onUpdate() {

                if (dec > 0) s = o.v.toFixed(dec);
                else s = String(Math.round(o.v));
                if (pad && dec === 0) s = s.padStart(pad, "0");
                el.textContent = s;
              },
            });
          });
        } else {
          document.documentElement.classList.remove("js");

          const intro = gsap.timeline({ paused: true });

            .to(
              ".hero-title .lni",
              { y: 0, duration: 1.25, ease: "power4.out", stagger: 0.11 },
              0.1,
            )
            .to(".hero-topline", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5)
            .to(".avail", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.55)
            .to(".hero-sub", { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.7)
            .to(".hero-cta", { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.8)

        const menu = document.getElementById("menu");
        const burger = document.getElementById("burger");

        function openMenu() {
          if (menuOpen) return;

          menu.classList.add("open");
          menu.setAttribute("aria-hidden", "false");
          burger.classList.add("open");
          burger.setAttribute("aria-expanded", "true");
          document.documentElement.classList.add("lock");
          if (lenis) lenis.stop();
        }
        function closeMenu() {
          if (!menuOpen) return;
          menuOpen = false;
          menu.classList.remove("open");
          menu.setAttribute("aria-hidden", "true");
          burger.classList.remove("open");
          burger.setAttribute("aria-expanded", "false");
          document.documentElement.classList.remove("lock");
          if (lenis) lenis.start();

          if (e.key === "Escape") closeMenu();
        });
        window.addEventListener("resize", () => {
          if (window.innerWidth > 1024 && menuOpen) closeMenu();
        });
