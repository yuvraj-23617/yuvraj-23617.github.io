}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ca class=\"skip-link\" href=\"#home\">Skip to contents\u003c/a>\n\u003cdiv class=\"grain\" aria-hidden=\"true\">\u003c/div>\n\n\u003cdiv class=\"sheet\">\n\n  \u003c!-- ============================================================\n       TOP STRIP\n       ============================================================ --\u003e\n  \u003cdiv class=\"top-strip\">\n    \u003cspan\u003e\u003cb\u003eThe Weather\u003c/b\u003e — New Delhi: clear skies, with conditions suited to writing software\u003c/span\u003e\n    \u003cspan\u003eDigital Edition · Pages 01–07\u003c/span\u003e\n    \u003cspan\u003e\u003cb id=\"topClock\"\u003eDelhi — 00:00:00 IST\u003c/b\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\n  \u003c!-- ============================================================\n       PAGE 01 — FRONT PAGE\n       ============================================================ --\u003e\n  \u003cmain id=\"home\">\n  \u003cheader class=\"masthead\">\n    \u003cdiv class=\"stamp\" aria-hidden=\"true\"\u003eLate\u003cbr\u003eCity\u003cbr\u003eFinal\u003c/div\u003e\n    \u003cdiv class=\"masthead-grid\">\n      \u003cdiv class=\"mast-box mast-box--l\"\u003eEst. MMXXVI\u003cbr\u003eVol. I · No. 01\u003c/div\u003e\n      \u003ch1 class=\"mast-title\"\u003eThe Yuvraj Verma Chronicle\u003c/h1\u003e\n      \u003cdiv class=\"mast-box mast-box--r\"\u003eNew Delhi · India\u003cbr\u003ePrice: Gratis\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"mast-rule\"\u003e\u003cspan\u003eAn Independent Record of Engineering, Leadership &amp; Selected Works\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"dateline\"\u003e\n      \u003cspan\u003e\u003cb id=\"dateline-date\"\u003e—\u003c/b\u003e\u003c/span\u003e\n      \u003cspan\u003ePublished from IIIT-Delhi\u003c/span\u003e\n      \u003cspan\u003eOpen to SWEAI / Product roles — \u003cb\u003e2026\u003c/b\u003e\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/header\u003e\n\n  \u003cnav class=\"section-nav\" aria-label=\"Newspaper sections\"\u003e\n    \u003cul\u003e\n      \u003cli\u003e\u003ca href=\"#home\" aria-current=\"true\"\u003eFront Page\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#about\"\u003eProfile\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#work\"\u003eTechnology\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#case-study\"\u003eSpecial Report\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#case-study-2\"\u003eCampus\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#process\"\u003eOpinion\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#skills\"\u003eThe Exchange\u003c/a\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ca href=\"#contact\"\u003eClassifieds\u003c/a\u003e\u003c/li\u003e\n    \u003c/ul\u003e\n  \u003c/nav\u003e\n\n  \u003csection class=\"front page\" aria-label=\"Front page\"\u003e\n    \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 01\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eFront Page\u003c/span\u003e\u003c/div\u003e\n\n    \u003c!-- CONTENTS STRIP --\u003e\n    \u003cnav class=\"contents-strip reveal\" aria-label=\"Contents of this edition\"\u003e\n      \u003cspan class=\"contents-label\"\u003eIn This Edition\u003c/span\u003e\n      \u003cul\u003e\n        \u003cli\u003e\u003ca href=\"#about\"\u003e\u003cspan class=\"pg\"\u003e02\u003c/span\u003e\u003cspan\u003eProfile\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\"#work\"\u003e\u003cspan class=\"pg\"\u003e03\u003c/span\u003e\u003cspan\u003eTechnology Desk\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\"#case-study\"\u003e\u003cspan class=\"pg\"\u003e04\u003c/span\u003e\u003cspan\u003eSpecial Report\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\"#case-study-2\"\u003e\u003cspan class=\"pg\"\u003e05\u003c/span\u003e\u003cspan\u003eCampus &amp; Record\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\"#process\"\u003e\u003cspan class=\"pg\"\u003e06\u003c/span\u003e\u003cspan\u003eOpinion\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n        \u003cli\u003e\u003ca href=\"#skills\"\u003e\u003cspan class=\"pg\"\u003e07\u003c/span\u003e\u003cspan\u003eExchange &amp; Classifieds\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/nav\u003e\n\n    \u003cdiv class=\"front-grid\"\u003e\n      \u003c!-- MAIN — LEAD STORY --\u003e\n      \u003cdiv class=\"front-col front-col--main reveal\"\u003e\n        \u003cp class=\"kicker\"\u003eLead Story — From All Desks\u003c/p\u003e\n        \u003ch2 class=\"lead-hed\"\u003eSoftware Systems, Campus Leadership, and the Work Behind Both\u003c/h2\u003e\n        \u003cp class=\"lead-dek\"\u003eA Computer Science undergraduate at IIIT-Delhi works on distributed systems and machine learning, and has led teams on campus. This edition records both.\u003c/p\u003e\n        \u003cp class=\"byline\"\u003eBy \u003cb\u003eYuvraj Verma\u003c/b\u003e · Staff Correspondent · New Delhi\u003c/p\u003e\n        \u003cdiv class=\"article-body article-body--cols\"\u003e\n          \u003cp class=\"dropcap\"\u003eNEW DELHI — Yuvraj Verma is studying for a B.Tech in Computer Science at IIIT-Delhi (2023–2027). The record shows work that has to hold up under load and under review: async pipelines, sandboxed execution, graph-based models, and the tests that keep them honest. He is open to SWEAI and product roles for 2026, and to open-source work at any time.\u003c/p\u003e\n          \u003cp\u003eThree repositories anchor this edition: a distributed assessment platform that runs untrusted code inside isolated containers; a hybrid recommender that combines graph collaborative filtering with semantic matching; and a registration system modelled before it was coded. Each is covered in full on Page 03.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cp class=\"jump\" style=\"margin-top:1rem;\"\u003e\u003ca href=\"#about\"\u003eProfile, Page 02 →\u003c/a\u003e &nbsp;·&nbsp; \u003ca href=\"#work\"\u003eSelected Works, Page 03 →\u003c/a\u003e\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003c!-- RAIL — SIDE STORIES --\u003e\n      \u003caside class=\"front-col front-col--rail reveal\"\u003e\n        \u003carticle class=\"side-story\"\u003e\n          \u003cp class=\"kicker\"\u003eCampus Report\u003c/p\u003e\n          \u003ch2 class=\"side-hed\"\u003e\u003ca href=\"#case-study-2\"\u003eIIIT Delhi Student Leads Sponsorship at E-Summit ’26\u003c/a\u003e\u003c/h2\u003e\n          \u003cdiv class=\"stat-box\"\u003e\n            \u003cspan class=\"figure\"\u003e5×\u003c/span\u003e\n            \u003cspan class=\"label\"\u003eGrowth in the Sponsorship Vertical\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cp class=\"side-body\"\u003eThe team replaced a single generic pitch with prospect research carried out before outreach. Conversion improved without an increase in call volume.\u003c/p\u003e\n          \u003cp class=\"jump\"\u003e\u003ca href=\"#case-study-2\"\u003eContinued on Page 05 →\u003c/a\u003e\u003c/p\u003e\n        \u003c/article\u003e\n\n        \u003carticle class=\"side-story\"\u003e\n          \u003cp class=\"kicker\"\u003eTechnology Desk — Brief\u003c/p\u003e\n          \u003ch2 class=\"side-hed\"\u003e\u003ca href=\"#work\"\u003eHybrid Recommender Posts 3.2% Gain in NDCG@10\u003c/a\u003e\u003c/h2\u003e\n          \u003cp class=\"side-body\"\u003eThe LightGCN-based engine, built under Dr. Angshul Majumdar, records HR@10 of 0.80 in evaluation.\u003c/p\u003e\n          \u003cp class=\"jump\"\u003e\u003ca href=\"#work\"\u003eContinued on Page 03 →\u003c/a\u003e\u003c/p\u003e\n        \u003c/article\u003e\n\n        \u003carticle class=\"side-story\"\u003e\n          \u003cp class=\"kicker\"\u003eNotice\u003c/p\u003e\n          \u003ch2 class=\"side-hed\"\u003eDean’s Communication Award Conferred\u003c/h2\u003e\n          \u003cp class=\"side-body\"\u003eRecognition for photography, video production and visual communication; the certificate enters the record on Page 05.\u003c/p\u003e\n        \u003c/article\u003e\n      \u003c/aside\u003e\n    \u003c/div\u003e\n\n    \u003c!-- NUMBERS BAND --\u003e\n    \u003cdiv class=\"numbers-band reveal\"\u003e\n      \u003cdiv\u003e\u003cspan class=\"figure\"\u003e3\u003c/span\u003e\u003cspan class=\"label\"\u003eLanguages judged by CodeJudge\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cspan class=\"figure\"\u003e+3.2%\u003c/span\u003e\u003cspan class=\"label\"\u003eNDCG@10 uplift, hybrid recommender\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cspan class=\"figure\"\u003e5×\u003c/span\u003e\u003cspan class=\"label\"\u003eSponsorship revenue · E-Summit\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cspan class=\"figure\"\u003e’27\u003c/span\u003e\u003cspan class=\"label\"\u003eExpected graduation, IIIT-Delhi\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- IN BRIEF BAND --\u003e\n    \u003cdiv class=\"inbrief-band reveal\"\u003e\n      \u003cp class=\"kicker\"\u003eIn Brief\u003c/p\u003e\n      \u003cul class=\"briefs briefs--row\"\u003e\n        \u003cli\u003e\u003cspan class=\"tag\"\u003eSandbox\u003c/span\u003e\u003cb\u003eJudge runs three languages\u003c/b\u003e — Python, Java and C++ executed asynchronously in isolated containers.\u003c/li\u003e\n        \u003cli\u003e\u003cspan class=\"tag\"\u003eML\u003c/span\u003e\u003cb\u003eHR@10 reaches 0.80\u003c/b\u003e — graph filtering joined to SBERT semantic matching and Groq query refinement.\u003c/li\u003e\n        \u003cli\u003e\u003cspan class=\"tag\"\u003eOpen Source\u003c/span\u003e\u003cb\u003ePRs welcome\u003c/b\u003e — experiments and tooling filed at \u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\" style=\"border-bottom:1px solid var(--rule-soft);\"\u003egithub.com/yuvraj-23617\u003c/a\u003e.\u003c/li\u003e\n      \u003c/ul\u003e\n    \u003c/div\u003e\n\n    \u003c!-- THE WIRE --\u003e\n    \u003cdiv class=\"wire\" aria-label=\"News ticker\"\u003e\n      \u003cspan class=\"wire-tag\"\u003eThe Wire\u003c/span\u003e\n      \u003cdiv class=\"wire-track\"\u003e\n        \u003cdiv class=\"wire-inner\"\u003e\n          \u003cspan\u003e+++ CodeJudge now judges Python, Java and C++ asynchronously +++ Sponsorship vertical grows fivefold over previous edition +++ LightGCN hybrid engine posts +3.2% NDCG@10 and HR@10 of 0.80 +++ Dean’s Communication Award conferred +++ Edition set entirely in black ink on paper +++ Updated daily from New Delhi +++&nbsp;\u003c/span\u003e\n          \u003cspan aria-hidden=\"true\"\u003e+++ CodeJudge now judges Python, Java and C++ asynchronously +++ Sponsorship vertical grows fivefold over previous edition +++ LightGCN hybrid engine posts +3.2% NDCG@10 and HR@10 of 0.80 +++ Dean’s Communication Award conferred +++ Edition set entirely in black ink on paper +++ Updated daily from New Delhi +++&nbsp;\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n  \u003c/main\u003e\n\n  \u003c!-- ============================================================\n       PAGE 02 — PROFILE\n       ============================================================ --\u003e\n  \u003csection id=\"about\" class=\"page\" aria-label=\"Profile\"\u003e\n    \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 02\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eProfile\u003c/span\u003e\u003c/div\u003e\n    \u003cheader class=\"desk-banner reveal\"\u003e\n      \u003cspan class=\"kicker\"\u003eSection B · Feature\u003c/span\u003e\n      \u003ch2 class=\"desk-title\"\u003eProfile\u003c/h2\u003e\n    \u003c/header\u003e\n\n    \u003cdiv class=\"profile-grid\"\u003e\n      \u003cdiv class=\"profile-rail reveal\"\u003e\n        \u003cfigure class=\"ph\"\u003e\n          \u003cimg src=\"yuvraj.webp\" alt=\"Portrait of Yuvraj Verma\" loading=\"lazy\"\u003e\n          \u003cfigcaption\u003eFor the profile feature. \u003cspan class=\"credit\"\u003ePhotograph — The Archive\u003c/span\u003e\u003c/figcaption\u003e\n        \u003c/figure\u003e\n        \u003cdiv class=\"facts\"\u003e\n          \u003ch3\u003eAt a Glance\u003c/h3\u003e\n          \u003cdl\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eName\u003c/dt\u003e\u003cdd\u003eYuvraj Verma\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eProgramme\u003c/dt\u003e\u003cdd\u003eB.Tech Computer Science\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eInstitute\u003c/dt\u003e\u003cdd\u003eIIIT-Delhi\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eBatch\u003c/dt\u003e\u003cdd\u003e2023 — 2027\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eBased\u003c/dt\u003e\u003cdd\u003eDelhi, India\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eWrites\u003c/dt\u003e\u003cdd\u003ePython · Java · C/C++ · SQL\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eFocus\u003c/dt\u003e\u003cdd\u003eSWEAI / Product\u003c/dd\u003e\u003c/div\u003e\n            \u003cdiv class=\"row\"\u003e\u003cdt\u003eStatus\u003c/dt\u003e\u003cdd\u003eOpen to roles\u003c/dd\u003e\u003c/div\u003e\n          \u003c/dl\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"reveal\"\u003e\n        \u003cp class=\"kicker\"\u003eThe Person Behind the Work\u003c/p\u003e\n        \u003ch3 class=\"profile-hed\"\u003eI Build Software That Has to Work Under Load\u003c/h3\u003e\n        \u003cp class=\"profile-dek\"\u003eMost of his time goes to algorithms, systems and data structures. He works with large, high-dimensional, genuinely messy data, and builds the pipelines that make it usable. Every project follows the same pattern: data goes in, a system comes out, and tests check it.\u003c/p\u003e\n\n        \u003cdiv class=\"article-body article-body--cols\"\u003e\n          \u003cp class=\"dropcap\"\u003eHe is studying for a B.Tech in Computer Science at IIIT-Delhi. His time goes to algorithms, systems, data structures, and the parts that decide whether anything else works. He works with large, high-dimensional, genuinely messy data, and builds the pipelines that make it usable.\u003c/p\u003e\n          \u003cp\u003eMost of the work lives in the backend and the model layer: an async, queue-based coding judge that sandboxes untrusted code in Docker; a hybrid recommender that combines graph collaborative filtering with SBERT semantic matching; and Java systems that he modelled before writing code. His stack spans Python, Java, Spring Boot, RabbitMQ, PostgreSQL, PyTorch and Docker — and the readability of a change matters to him as much as the benchmark number.\u003c/p\u003e\n          \u003cp\u003eWhat he is looking for: engineering teams where the work is technical, code review is honest, and shipping is measured by uptime and error budgets — rather than by slide decks.\u003c/p\u003e\n        \u003c/div\u003e\n\n        \u003cblockquote class=\"pullquote\"\u003e\n          “In my projects, the hardest problems have come from messy data. That is the work I want to keep doing.”\n          \u003ccite\u003e— From the subject’s own correspondence\u003c/cite\u003e\n        \u003c/blockquote\u003e\n\n        \u003cp class=\"kicker\" style=\"margin-bottom:.5rem;\"\u003eFields of Interest\u003c/p\u003e\n        \u003cul class=\"fields\"\u003e\n          \u003cli\u003eAlgorithm Design\u003c/li\u003e\n          \u003cli\u003eDistributed Systems\u003c/li\u003e\n          \u003cli\u003eMachine Learning\u003c/li\u003e\n          \u003cli\u003eBackend Engineering\u003c/li\u003e\n          \u003cli\u003eLarge-Scale Data\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       PAGE 03 — TECHNOLOGY DESK\n       ============================================================ --\u003e\n  \u003csection id=\"work\" class=\"page\" aria-label=\"Technology desk — selected works\"\u003e\n    \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 03\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eTechnology Desk\u003c/span\u003e\u003c/div\u003e\n    \u003cheader class=\"desk-banner reveal\"\u003e\n      \u003cspan class=\"kicker\"\u003eSection C · Selected Works\u003c/span\u003e\n      \u003ch2 class=\"desk-title\"\u003eFrom the Technology Desk\u003c/h2\u003e\n    \u003c/header\u003e\n    \u003cp class=\"kicker kicker--soft reveal\" style=\"text-align:center;margin:-1rem 0 1.7rem;\"\u003eThree repositories that show how he works: backend systems, machine learning, and modelling.\u003c/p\u003e\n\n    \u003c!-- STORY I — LIGHTGCN --\u003e\n    \u003carticle class=\"story reveal\"\u003e\n      \u003cdiv class=\"story-text\"\u003e\n        \u003cp class=\"kicker\"\u003e01 — ML · Recommenders\u003c/p\u003e\n        \u003ch3 class=\"story-hed\"\u003eLightGCN Recommendation Engine\u003c/h3\u003e\n        \u003cp class=\"story-dek\"\u003eA student-built hybrid of graph collaborative filtering and semantic matching, supervised from the bench at IIIT-Delhi.\u003c/p\u003e\n        \u003cdiv class=\"article-body\"\u003e\n          \u003cp\u003eThe engine combines graph-based collaborative filtering (LightGCN) with SBERT semantic matching and Groq-powered query refinement. In evaluation it improved NDCG@10 by 3.2% and raised HR@10 to 0.80. The work was built under Dr. Angshul Majumdar.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003ctable class=\"spec-table\"\u003e\n          \u003ccaption\u003eMateria Technica\u003c/caption\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eApparatus\u003c/th\u003e\u003ctd\u003ePYTHON · PYTORCH · LIGHTGCN · SBERT · GROQ\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eFindings\u003c/th\u003e\u003ctd\u003eNDCG@10 +3.2% · HR@10 = 0.80\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eSupervisor\u003c/th\u003e\u003ctd\u003eDR. ANGSUL MAJUMDAR, IIIT-DELHI\u003c/td\u003e\u003c/tr\u003e\n        \u003c/table\u003e\n        \u003ca class=\"source-link\" href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003eSource Material ↗\u003c/a\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"story-media\"\u003e\n        \u003cfigure class=\"code-figure\"\u003e\n          \u003cdiv class=\"code-header\"\u003e\n            \u003cspan class=\"code-title\"\u003eFig.01 / Graph — User → Item Propagation\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"code-body graph\"\u003e\n            \u003cdiv class=\"graph-col\"\u003e\n              \u003cdiv class=\"graph-node\"\u003eU1\u003c/div\u003e\n              \u003cdiv class=\"graph-node\"\u003eU2\u003c/div\u003e\n              \u003cdiv class=\"graph-node\"\u003eU3\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"graph-edges\"\u003e\n              \u003cdiv\u003e— — — — —\u003c/div\u003e\n              \u003cdiv\u003e— — — — —\u003c/div\u003e\n              \u003cdiv\u003e— — — — —\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"graph-col\"\u003e\n              \u003cdiv class=\"graph-node\"\u003eI1\u003c/div\u003e\n              \u003cdiv class=\"graph-node\"\u003eI2\u003c/div\u003e\n              \u003cdiv class=\"graph-node\"\u003eI3\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cfigcaption\u003eNDCG@10 +3.2% · HR@10 = 0.80 \u003cspan class=\"credit\"\u003eDiagram — The Archive\u003c/span\u003e\u003c/figcaption\u003e\n        \u003c/figure\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003c!-- STORY II — CODEJUDGE --\u003e\n    \u003carticle class=\"story reveal\"\u003e\n      \u003cdiv class=\"story-text\"\u003e\n        \u003cp class=\"kicker\"\u003e02 — Systems · Backend\u003c/p\u003e\n        \u003ch3 class=\"story-hed\"\u003eCodeJudge — Distributed Assessment Platform\u003c/h3\u003e\n        \u003cp class=\"story-dek\"\u003eSubmissions in Python, Java and C++ are judged asynchronously; no untrusted code touches the machine that holds the database.\u003c/p\u003e\n        \u003cdiv class=\"article-body\"\u003e\n          \u003cp\u003eBuilt on Java Spring Boot: the API saves each submission as \u003ccode style=\"font-family:var(--wire);font-size:.8em;background:var(--paper-card);border:1px solid var(--rule-faint);padding:.05em .3em;\"\u003ePENDING\u003c/code\u003e in PostgreSQL and publishes its ID to RabbitMQ. A judge worker picks up the message and runs the code inside an isolated Docker container with no network access and hard memory and CPU limits, then writes the verdict back. The platform has role-based administration for problems and visible or hidden test cases, 12 pre-loaded problems, and a one-click Docker Compose deploy.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"diagram\"\u003e\n          \u003ch4\u003eInfographic — Route of a Submission\u003c/h4\u003e\n          \u003col\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eSUBMISSION\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003eAPI\u003c/span\u003e\u003c/li\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eAPI\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003ePOSTGRESQL\u003c/span\u003e\u003cspan class=\"note\"\u003e[VERDICT: PENDING]\u003c/span\u003e\u003c/li\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eAPI\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003eRABBITMQ\u003c/span\u003e\u003c/li\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eRABBITMQ\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003eJUDGE WORKER\u003c/span\u003e\u003c/li\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eWORKER\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003eDOCKER SANDBOX\u003c/span\u003e\u003cspan class=\"note\"\u003e[NO NETWORK · HARD CAPS]\u003c/span\u003e\u003c/li\u003e\n            \u003cli\u003e\u003cspan class=\"node\"\u003eSANDBOX\u003c/span\u003e\u003cspan class=\"arr\"\u003e──▶\u003c/span\u003e\u003cspan class=\"node\"\u003eVERDICT\u003c/span\u003e\u003cspan class=\"note\"\u003eACCEPTED / WRONG_ANSWER / RUNTIME_ERROR\u003c/span\u003e\u003c/li\u003e\n          \u003c/ol\u003e\n        \u003c/div\u003e\n        \u003ctable class=\"spec-table\"\u003e\n          \u003ccaption\u003eMateria Technica\u003c/caption\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eApparatus\u003c/th\u003e\u003ctd\u003eSPRING BOOT · RABBITMQ · DOCKER · POSTGRESQL · MONACO\u003c/td\u003e\u003c/tr\u003e\n        \u003c/table\u003e\n        \u003ca class=\"source-link\" href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003eSource Material ↗\u003c/a\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"story-media\"\u003e\n        \u003cfigure class=\"code-figure\"\u003e\n          \u003cdiv class=\"code-header\"\u003e\n            \u003cspan class=\"dot\"\u003e\u003c/span\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e\u003cspan class=\"dot\"\u003e\u003c/span\u003e\n            \u003cspan class=\"code-title\"\u003eFig.02 / Sandbox — Docker — Judge-Worker\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"code-body terminal\"\u003e\n            \u003cdiv\u003e\u003cspan class=\"prompt\"\u003e$\u003c/span\u003e submit solution.py\u003c/div\u003e\n            \u003cdiv\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e status: \u003cspan class=\"hl\"\u003ePENDING\u003c/span\u003e · queued via RabbitMQ\u003c/div\u003e\n            \u003cdiv\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e sandbox: docker · no-net · 128MB\u003c/div\u003e\n            \u003cdiv\u003e\u003cspan class=\"prompt\"\u003e$\u003c/span\u003e run tests (6 hidden)\u003c/div\u003e\n            \u003cdiv\u003e\u003cspan class=\"check\"\u003e✔\u003c/span\u003e verdict: \u003cspan class=\"hl-green\"\u003eACCEPTED\u003c/span\u003e · 0.42s\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cfigcaption\u003eAsynchronous execution trace \u003cspan class=\"credit\"\u003eDiagram — The Archive\u003c/span\u003e\u003c/figcaption\u003e\n        \u003c/figure\u003e\n        \u003cp class=\"jump\" style=\"margin-top:.9rem;\"\u003eA full investigation of the sandbox appears on \u003ca href=\"#case-study\"\u003ePage 04 →\u003c/a\u003e\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003c!-- STORY III — REGISTRATION --\u003e\n    \u003carticle class=\"story reveal\"\u003e\n      \u003cdiv class=\"story-text\"\u003e\n        \u003cp class=\"kicker\"\u003e03 — Java · OOP\u003c/p\u003e\n        \u003ch3 class=\"story-hed\"\u003eCourse Registration System\u003c/h3\u003e\n        \u003cdiv class=\"article-body\"\u003e\n          \u003cp\u003eA Java system built on clean object-oriented design and UML modelling — 4 user roles and more than 8 features covering the registration lifecycle: enrolment, CGPA calculation, and complaint handling. He modelled it before writing code, because the specification is part of the source.\u003c/p\u003e\n        \u003c/div\u003e\n        \u003ctable class=\"spec-table\"\u003e\n          \u003ccaption\u003eMateria Technica\u003c/caption\u003e\n          \u003ctr\u003e\u003cth scope=\"row\"\u003eApparatus\u003c/th\u003e\u003ctd\u003eJAVA · OOP · UML · DESIGN PATTERNS\u003c/td\u003e\u003c/tr\u003e\n        \u003c/table\u003e\n        \u003ca class=\"source-link\" href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003eSource Material ↗\u003c/a\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"story-media\"\u003e\n        \u003cfigure class=\"code-figure\"\u003e\n          \u003cdiv class=\"code-header\"\u003e\n            \u003cspan class=\"code-title\"\u003eFig.03 / UML — 4 Roles · 8+ Features\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"code-body uml\"\u003e\n            \u003cdiv class=\"uml-box\"\u003e\n              \u003cdiv class=\"uml-header\"\u003eUSER\u003c/div\u003e\n              \u003cdiv class=\"uml-row\"\u003e# id : int\u003c/div\u003e\n              \u003cdiv class=\"uml-row\"\u003e# role : Role\u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"uml-inherits\"\u003e▲ ─────────────── INHERITS\u003c/div\u003e\n            \u003cdiv class=\"uml-box\"\u003e\n              \u003cdiv class=\"uml-header\"\u003eSTUDENT\u003c/div\u003e\n              \u003cdiv class=\"uml-row\"\u003e+ enroll(course)\u003c/div\u003e\n              \u003cdiv class=\"uml-row\"\u003e+ calcCGPA()\u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cfigcaption\u003eModelled before it was coded \u003cspan class=\"credit\"\u003eDiagram — The Archive\u003c/span\u003e\u003c/figcaption\u003e\n        \u003c/figure\u003e\n      \u003c/div\u003e\n    \u003c/article\u003e\n\n    \u003cp class=\"asterism\" aria-hidden=\"true\"\u003e⁂\u003c/p\u003e\n    \u003cp style=\"text-align:center;\" class=\"jump reveal\"\u003eAlso on file — experiments, tooling &amp; open source: \u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003egithub.com/yuvraj-23617\u003c/a\u003e\u003c/p\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       PAGE 04 — SPECIAL REPORT\n       ============================================================ --\u003e\n  \u003csection id=\"case-study\" class=\"report\" aria-label=\"Special report — CodeJudge\"\u003e\n    \u003cdiv class=\"page\"\u003e\n      \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 04\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eSpecial Report\u003c/span\u003e\u003c/div\u003e\n      \u003cp class=\"kicker reveal\" style=\"text-align:center;\"\u003eSpecial Report · Case Study No. 1\u003c/p\u003e\n      \u003ch2 class=\"report-hed reveal\"\u003eRunning Untrusted Code at Scale\u003c/h2\u003e\n      \u003cp class=\"report-dek reveal\"\u003eCodeJudge — a distributed coding assessment platform · Spring Boot · RabbitMQ · Docker. Five findings, entered in full.\u003c/p\u003e\n\n      \u003cdl class=\"report-meta reveal\"\u003e\n        \u003cdiv\u003e\u003cdt\u003eRole\u003c/dt\u003e\u003cdd\u003eDesign + full-stack implementation\u003c/dd\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003cdt\u003eStack\u003c/dt\u003e\u003cdd\u003eSpring Boot · RabbitMQ · Docker · PostgreSQL · Monaco\u003c/dd\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003cdt\u003eResult\u003c/dt\u003e\u003cdd\u003eAsync judge for Python, Java &amp; C++\u003c/dd\u003e\u003c/div\u003e\n        \u003cdiv\u003e\u003cdt\u003eDeploy\u003c/dt\u003e\u003cdd\u003eOne-click Docker Compose · 12 pre-loaded problems\u003c/dd\u003e\u003c/div\u003e\n      \u003c/dl\u003e\n\n      \u003cdl class=\"report-steps reveal\"\u003e\n        \u003cdiv class=\"report-step\"\u003e\n          \u003cdt\u003e\u003cspan class=\"step-no\"\u003e01\u003c/span\u003e\u003cspan class=\"step-name\"\u003eProblem\u003c/span\u003e\u003c/dt\u003e\n          \u003cdd\u003e\n            \u003ch4\u003eSynchronous judging does not scale.\u003c/h4\u003e\n            \u003cp\u003eMost coding platforms run submissions inline. The request thread blocks while the compiler runs and the test cases execute, which under load leads to queue buildup, timeouts, and a broken experience for the user. And once you run code that someone else wrote, you are already dealing with security.\u003c/p\u003e\n          \u003c/dd\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"report-step\"\u003e\n          \u003cdt\u003e\u003cspan class=\"step-no\"\u003e02\u003c/span\u003e\u003cspan class=\"step-name\"\u003eApproach\u003c/span\u003e\u003c/dt\u003e\n          \u003cdd\u003e\n            \u003ch4\u003eDecouple submission from execution.\u003c/h4\u003e\n            \u003cp\u003eThe submission endpoint only validates and enqueues. It saves the submission in PostgreSQL with the verdict \u003ccode\u003ePENDING\u003c/code\u003e, and publishes its ID to a RabbitMQ queue. A judge worker consumes the message, writes the code to a temporary directory, runs it inside an isolated Docker container, compares the output against visible and hidden test cases, and writes the final verdict back. The frontend polls the submission until the verdict arrives. Spring Boot handles the API, and PostgreSQL holds users, problems, submissions and test cases.\u003c/p\u003e\n          \u003c/dd\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"report-step\"\u003e\n          \u003cdt\u003e\u003cspan class=\"step-no\"\u003e03\u003c/span\u003e\u003cspan class=\"step-name\"\u003eDecision\u003c/span\u003e\u003c/dt\u003e\n          \u003cdd\u003e\n            \u003ch4\u003eSandbox everything, trust nothing.\u003c/h4\u003e\n            \u003cp\u003eEvery submission runs in a fresh container with networking disabled and hard resource limits: 128MB of memory and 0.5 CPU for Python, 512MB and 1.5 CPU for Java and C++, plus an execution timeout. This costs latency, but you cannot run arbitrary user code on the same machine that holds your database. It is the decision he would defend hardest in review, and the trade-off is deliberate.\u003c/p\u003e\n          \u003c/dd\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"report-step\"\u003e\n          \u003cdt\u003e\u003cspan class=\"step-no\"\u003e04\u003c/span\u003e\u003cspan class=\"step-name\"\u003eOutcome\u003c/span\u003e\u003c/dt\u003e\n          \u003cdd\u003e\n            \u003ch4\u003eAsync, multi-language, and instructor-friendly.\u003c/h4\u003e\n            \u003cp\u003eThe platform supports three languages (Python, Java and C++) and judges submissions asynchronously with verdicts of ACCEPTED, WRONG_ANSWER or RUNTIME_ERROR, along with the recorded execution time. Twelve pre-loaded problems ship with visible and hidden test cases; role-based access separates admins from users; the admin dashboard lets instructors create, edit and delete problems and test cases without touching the codebase. The candidate interface is a real terminal, so the assessment feels like the tools engineers already use.\u003c/p\u003e\n          \u003c/dd\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"report-step\"\u003e\n          \u003cdt\u003e\u003cspan class=\"step-no\"\u003e05\u003c/span\u003e\u003cspan class=\"step-name\"\u003eNext\u003c/span\u003e\u003c/dt\u003e\n          \u003cdd\u003e\n            \u003ch4\u003eWhat would be carried forward.\u003c/h4\u003e\n            \u003cp\u003eReplace polling with WebSocket live verdicts and move to stateless JWT authentication. Store submission history in the database instead of local storage, add Redis caching for problems and test cases, and scale out with multiple judge workers on Kubernetes behind a CI/CD pipeline. He would also harden the sandbox further, because the security model is never finished.\u003c/p\u003e\n          \u003c/dd\u003e\n        \u003c/div\u003e\n      \u003c/dl\u003e\n\n      \u003cblockquote class=\"report-quote reveal\"\u003e“The hard part is not running code. It is running untrusted code safely.”\u003c/blockquote\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       PAGE 05 — CAMPUS DESK + ON THE RECORD\n       ============================================================ --\u003e\n  \u003csection id=\"case-study-2\" class=\"page\" aria-label=\"Campus desk — E-Summit and the record\"\u003e\n    \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 05\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eCampus Desk\u003c/span\u003e\u003c/div\u003e\n    \u003cheader class=\"desk-banner reveal\"\u003e\n      \u003cspan class=\"kicker\"\u003eSection D · Case Study No. 2\u003c/span\u003e\n      \u003ch2 class=\"desk-title\"\u003eThe Campus Desk\u003c/h2\u003e\n    \u003c/header\u003e\n\n    \u003cdiv class=\"campus-lead\"\u003e\n      \u003cdiv class=\"reveal\"\u003e\n        \u003cp class=\"kicker\"\u003eE-Summit ’26 — IIIT-Delhi’s Flagship Entrepreneurship Summit\u003c/p\u003e\n        \u003ch3 class=\"story-hed\" style=\"font-size:clamp(1.7rem,3.4vw,2.7rem);\"\u003eQualify the Prospect, Then Pitch\u003c/h3\u003e\n        \u003cdl class=\"report-meta\" style=\"grid-template-columns:repeat(3,1fr);\"\u003e\n          \u003cdiv\u003e\u003cdt\u003eRole\u003c/dt\u003e\u003cdd\u003eHead of Sponsorship Domain\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eWindow\u003c/dt\u003e\u003cdd\u003eOct 2025 → Mar 2026\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eResult\u003c/dt\u003e\u003cdd\u003e5× growth in the sponsorship vertical\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n\n        \u003cdiv class=\"campus-steps\"\u003e\n          \u003cdiv class=\"campus-step\"\u003e\n            \u003cspan class=\"no\"\u003e01 / Problem\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003ch4\u003eProspect conversion was the broken step.\u003c/h4\u003e\n              \u003cp\u003eThe workflow looked straightforward on paper: identify prospects, assign them to team members, make calls, send emails, follow up, close the sponsorship, and hand the agreed deliverables to the event teams. Prospects and follow-ups were tracked in Google Sheets and reviewed in weekly meetings. Conversion stayed flat because everyone received the same generic pitch: “we are organising an entrepreneurship summit; would you like to sponsor us?” The calls and emails went out quickly, yet companies had little reason to respond. The operation was optimised for the number of companies contacted rather than for whether a company had a specific reason to take part.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"campus-step\"\u003e\n            \u003cspan class=\"no\"\u003e02 / The Fix\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003ch4\u003eResearch before outreach.\u003c/h4\u003e\n              \u003cp\u003eThe workflow changed so that prospect research became part of the process, before anyone reached out. Instead of one pitch for every company, something specific was identified about each one that could connect to the student audience. Approaching a major consumer brand, the team tied a seasonal campaign it was already running to the student audience and positioned E-Summit as a campus opportunity to activate that campaign. Similar company-specific approaches were used with other prospects. At the same time, specialised outreach was split across the team — some members handled banks and PSUs through offline outreach, while others focused on gaming partnerships.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"campus-step\"\u003e\n            \u003cspan class=\"no\"\u003e03 / Second Failure\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003ch4\u003eThe workflow broke again after the close.\u003c/h4\u003e\n              \u003cp\u003eA second problem appeared once sponsors signed on. On event day the workflow became error-prone: each sponsor could have multiple commitments — branding, activations, placements and other agreed benefits — and missing one could delay or affect the final payment. Fulfilment required coordination across different event teams, so the sponsorship vertical had to track what had been promised and whether each item had actually been delivered.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"campus-step\"\u003e\n            \u003cspan class=\"no\"\u003e04 / Constraint\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003ch4\u003eMarch is the wrong month.\u003c/h4\u003e\n              \u003cp\u003eThere was also a constraint that could not be fully worked around: E-Summit happens in March, close to the end of the financial year. Some companies were already closing their budgets and their sponsorship decisions, which meant that even interested companies sometimes could not complete the process within the timeline. The constraint could not be removed, but knowing it let the team prioritise the prospects who could still move in time.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"campus-step\"\u003e\n            \u003cspan class=\"no\"\u003e05 / Outcome\u003c/span\u003e\n            \u003cdiv\u003e\n              \u003ch4\u003eSame team, different shape of work.\u003c/h4\u003e\n              \u003cp\u003eFixing the workflow from scratch would begin with prospect qualification and personalisation. Increasing outreach volume would only have made the first problem larger — more generic pitches to companies with no clear reason to respond. Once the way prospects were selected and approached changed, conversion improved without simply increasing the number of calls and emails. The overall sponsorship vertical grew 5× compared with the previous edition.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cblockquote class=\"pullquote reveal\"\u003e“More outreach volume would only have made the first problem larger.”\u003c/blockquote\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"reveal\"\u003e\n        \u003c!-- Certificate image with warm, paper-matched treatment --\u003e\n        \u003cfigure class=\"ph ph--cert\" style=\"margin-bottom:1.2rem;\"\u003e\n          \u003c!-- Save your certificate image as certificate.png in the same folder --\u003e\n          \u003cdiv class=\"cert-plate\"\u003e\n            \u003cimg src=\"certificate.webp\" alt=\"Dean's Communication Award Certificate for Yuvraj Verma\" loading=\"lazy\"\u003e\n          \u003c/div\u003e\n          \u003cfigcaption\u003eDean's Communication Award Certificate · 2025-2026. \u003cspan class=\"credit\"\u003eDocument — The Archive\u003c/span\u003e\u003c/figcaption\u003e\n        \u003c/figure\u003e\n\n        \u003c!-- ON THE RECORD --\u003e\n        \u003cdiv id=\"experience\"\u003e\n          \u003cp class=\"kicker\" style=\"margin-bottom:.3rem;\"\u003eOn the Record\u003c/p\u003e\n          \u003cp class=\"jump\" style=\"margin-bottom:.6rem;\"\u003eAppointments and distinctions, in reverse chronological order.\u003c/p\u003e\n          \u003ctable class=\"ledger\"\u003e\n            \u003ccaption\u003eThe Ledger — Career &amp; Leadership\u003c/caption\u003e\n            \u003cthead\u003e\n              \u003ctr\u003e\u003cth scope=\"col\"\u003eDated\u003c/th\u003e\u003cth scope=\"col\"\u003eEntry\u003c/th\u003e\u003c/tr\u003e\n            \u003c/thead\u003e\n            \u003ctbody\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003e2023 — 2027\u003cem\u003eEducation\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eB.Tech — Computer Science\u003c/span\u003e\u003cspan class=\"l-org\"\u003eIIIT-Delhi\u003c/span\u003eRelevant coursework: Data Structures &amp; Algorithms, Advanced Programming, Operating Systems, Computer Organisation, Database Management Systems, Collaborative Filtering.\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003eOct 2025 — Mar 2026\u003cem\u003eLeadership · Impact\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eHead of Sponsorship Domain\u003c/span\u003e\u003cspan class=\"l-org\"\u003eIIIT-Delhi E-Summit 2026\u003c/span\u003eHe owned the sponsorship workflow end to end — prospecting, outreach, closing, and delivering the promised benefits — and led a cross-functional team across sponsorship, marketing, and operations. He rebuilt the workflow so prospect research preceded outreach, with company-specific positioning and specialised tracks for banks, PSUs, and gaming partnerships. The vertical grew 5× over the previous edition.\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003eAug 2025 — Present\u003cem\u003eContent\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eMember, Media Service Committee\u003c/span\u003e\u003cspan class=\"l-org\"\u003eIIIT-Delhi\u003c/span\u003eHe covers events, produces promotional content, and handles visual storytelling for institute initiatives, turning what happened into material people want to watch.\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003eApr 2025 — Aug 2025\u003cem\u003eDelivery\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eGeneral Secretary\u003c/span\u003e\u003cspan class=\"l-org\"\u003eESYA 2025 · IIIT-Delhi Annual Tech Fest\u003c/span\u003eHe worked across the technical, content, and operations teams to deliver the event end to end, coordinating cross-functional teams and institute stakeholders against a fixed launch date.\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003eAug 2024 — Jul 2025\u003cem\u003eCommunity\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eCoordinator\u003c/span\u003e\u003cspan class=\"l-org\"\u003eIEEE-IIIT Delhi Student Branch\u003c/span\u003eHe ran technical sessions, events, and institute-level outreach with the core IEEE team, handling logistics, speakers, and the attendee experience.\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd class=\"l-date\"\u003e2025\u003cem\u003eAward\u003c/em\u003e\u003c/td\u003e\n                \u003ctd\u003e\u003cspan class=\"l-role\"\u003eDean’s Communication Award\u003c/span\u003e\u003cspan class=\"l-org\"\u003eIIIT-Delhi · Certificate of Excellence\u003c/span\u003eThe Dean recognised his work in photography, video production, and visual communication — the same craft he brings to technical write-ups and documentation, and to explaining complex systems to people who were not in the room.\u003c/td\u003e\n              \u003c/tr\u003e\n            \u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       PAGE 06 — OPINION\n       ============================================================ --\u003e\n  \u003csection id=\"process\" class=\"opinion\" aria-label=\"Opinion — the method\"\u003e\n    \u003cdiv class=\"page\" style=\"padding-top:clamp(1.6rem,3vw,2.6rem);padding-bottom:clamp(1.8rem,3.4vw,2.8rem);\"\u003e\n      \u003cdiv class=\"folio\"\u003e\u003cspan\u003e\u003cb\u003ePage 06\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eOpinion\u003c/span\u003e\u003c/div\u003e\n      \u003cheader class=\"desk-banner reveal\"\u003e\n        \u003cspan class=\"kicker\"\u003eEditorial · The Verma Method\u003c/span\u003e\n        \u003ch2 class=\"desk-title\"\u003eFrom Paper to Shipped Code\u003c/h2\u003e\n      \u003c/header\u003e\n\n      \u003cdiv class=\"op-ed\"\u003e\n        \u003cdiv class=\"op-ed-body reveal\"\u003e\n          \u003cp class=\"lede\"\u003eFour steps, kept close, shaped by reproducing LightGCN from scratch. They are printed here in the order in which they are used.\u003c/p\u003e\n          \u003cdiv class=\"moves\"\u003e\n            \u003cdiv class=\"move\"\u003e\n              \u003cspan class=\"no\"\u003eStep No. 01\u003c/span\u003e\n              \u003ch4\u003eModel\u003c/h4\u003e\n              \u003cp\u003eRead the paper before writing code. When reproducing LightGCN, the first task was not writing PyTorch. It was understanding what the original GCN did wrong, and why a simpler propagation could outperform it. The data has a shape, and the model should follow it rather than impose one.\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"move\"\u003e\n              \u003cspan class=\"no\"\u003eStep No. 02\u003c/span\u003e\n              \u003ch4\u003eBuild\u003c/h4\u003e\n              \u003cp\u003eBuilding from scratch means building every part. Adjacency normalisation, layer-wise propagation, and the ranking objective were each implemented and verified in isolation before they composed with the next. The paper’s own ablations made one point clear: adding layers does not add signal.\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"move\"\u003e\n              \u003cspan class=\"no\"\u003eStep No. 03\u003c/span\u003e\n              \u003ch4\u003eTest\u003c/h4\u003e\n              \u003cp\u003eMatch the protocol, not only the metric. The same leave-one-out split and negative sampling the paper used were run here, so any deviation observed came from the model rather than from the testing. Ablations over depth and dimension were as much about understanding the implementation as measuring it.\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"move\"\u003e\n              \u003cspan class=\"no\"\u003eStep No. 04\u003c/span\u003e\n              \u003ch4\u003eShip\u003c/h4\u003e\n              \u003cp\u003eA result is only as trustworthy as the caveats attached to it. Write down what you cannot claim — the small sample, the baseline that is not comparable, the variance you have not ruled out. Releasing work means being honest about its scope, not just loud about the number.\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003caside class=\"op-rail reveal\"\u003e\n          \u003cdiv class=\"box\"\u003e\n            \u003ch5\u003eEditor’s Note\u003c/h5\u003e\n            \u003cp\u003eThis column is reprinted whenever a new system enters the record. The steps have not yet needed revision.\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"box\"\u003e\n            \u003ch5\u003eOn the Record\u003c/h5\u003e\n            \u003cp\u003e“The paper’s own ablations made one point clear: adding layers does not add signal.”\u003c/p\u003e\n            \u003cspan class=\"sig\"\u003e— Y. Verma\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"box\"\u003e\n            \u003ch5\u003eCorrections Policy\u003c/h5\u003e\n            \u003cp\u003eErrors, when found, are corrected in place and noted. The diff is part of the record.\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/aside\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       PAGE 07 — EXCHANGE & CLASSIFIEDS\n       ============================================================ --\u003e\n  \u003csection id=\"skills\" class=\"page\" aria-label=\"The exchange and classifieds\"\u003e\n    \u003cdiv class=\"folio\" style=\"margin-top:clamp(1.4rem,2.6vw,2.1rem);\"\u003e\u003cspan\u003e\u003cb\u003ePage 07\u003c/b\u003e\u003c/span\u003e\u003cspan\u003eThe Yuvraj Verma Chronicle\u003c/span\u003e\u003cspan\u003eExchange &amp; Classifieds\u003c/span\u003e\u003c/div\u003e\n    \u003cheader class=\"desk-banner reveal\"\u003e\n      \u003cspan class=\"kicker\"\u003eSection E · Notices &amp; Advertisements\u003c/span\u003e\n      \u003ch2 class=\"desk-title\"\u003eThe Exchange &amp; Classifieds\u003c/h2\u003e\n    \u003c/header\u003e\n\n    \u003c!-- NOTICES --\u003e\n    \u003cdiv class=\"class-notices\" id=\"contact\"\u003e\n      \u003cdiv class=\"class-ad class-ad--solid reveal\"\u003e\n        \u003ch4 class=\"class-title\"\u003eSituations Sought\u003c/h4\u003e\n        \u003cp\u003e\u003cb\u003eSWEAI / PRODUCT ENGINEER.\u003c/b\u003e Meaningful opportunities in engineering and product, sought for 2026. Full-time roles, freelance builds, and open-source contributions all considered. Replies sent to all correspondence, usually within one day.\u003c/p\u003e\n        \u003cspan class=\"ref\"\u003eRef: YV/2026/01\u003c/span\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"class-ad reveal\"\u003e\n        \u003ch4 class=\"class-title\"\u003eCorrespondence\u003c/h4\u003e\n        \u003cdl\u003e\n          \u003cdiv class=\"correspond-row\"\u003e\u003cdt\u003eLetters to\u003c/dt\u003e\u003cdd\u003e\u003ca href=\"mailto:yuvrajworkemail@gmail.com\"\u003eyuvrajworkemail@gmail.com\u003c/a\u003e\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv class=\"correspond-row\"\u003e\u003cdt\u003eRésumé\u003c/dt\u003e\u003cdd\u003e\u003ca href=\"./Yuvraj_verma_Resume.pdf\" target=\"_blank\" rel=\"noopener\"\u003eDownload PDF ↗\u003c/a\u003e\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv class=\"correspond-row\"\u003e\u003cdt\u003eGitHub\u003c/dt\u003e\u003cdd\u003e\u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003eCode &amp; experiments ↗\u003c/a\u003e\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv class=\"correspond-row\"\u003e\u003cdt\u003eLinkedIn\u003c/dt\u003e\u003cdd\u003e\u003ca href=\"https://www.linkedin.com/in/yuvraj-verma-/\" target=\"_blank\" rel=\"noopener\"\u003eJust say hello ↗\u003c/a\u003e\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- INVENTORY --\u003e\n    \u003ch3 class=\"class-section-hed reveal\" id=\"inventory\"\u003eInstruments &amp; Supplies\u003c/h3\u003e\n    \u003cp class=\"class-section-dek reveal\"\u003eThe complete inventory of the toolkit, filed by department.\u003c/p\u003e\n\n    \u003cdiv class=\"inv-grid reveal\"\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003eLanguages\u003c/h5\u003e\n        \u003cul class=\"cols2\"\u003e\n          \u003cli\u003ePython\u003c/li\u003e\u003cli\u003eJava\u003c/li\u003e\u003cli\u003eC / C++\u003c/li\u003e\u003cli\u003eSQL\u003c/li\u003e\u003cli\u003eJavaScript\u003c/li\u003e\u003cli\u003eHTML / CSS\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003eSystems &amp; Backend\u003c/h5\u003e\n        \u003cul class=\"cols2\"\u003e\n          \u003cli\u003eSpring Boot\u003c/li\u003e\u003cli\u003eRabbitMQ\u003c/li\u003e\u003cli\u003eDocker\u003c/li\u003e\u003cli\u003ePostgreSQL\u003c/li\u003e\u003cli\u003eREST APIs\u003c/li\u003e\u003cli\u003eLinux\u003c/li\u003e\u003cli\u003eGit &amp; GitHub\u003c/li\u003e\u003cli\u003eDistributed Systems\u003c/li\u003e\u003cli\u003eAsync Pipelines\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003eML / AI &amp; Data\u003c/h5\u003e\n        \u003cul class=\"cols2\"\u003e\n          \u003cli\u003ePyTorch\u003c/li\u003e\u003cli\u003eSBERT\u003c/li\u003e\u003cli\u003eLightGCN\u003c/li\u003e\u003cli\u003eRecommender Systems\u003c/li\u003e\u003cli\u003eLLM Integration\u003c/li\u003e\u003cli\u003eRAG\u003c/li\u003e\u003cli\u003eNumPy · pandas\u003c/li\u003e\u003cli\u003eLarge-Scale Data\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003eCS Foundations\u003c/h5\u003e\n        \u003cul class=\"cols2\"\u003e\n          \u003cli\u003eData Structures &amp; Algorithms\u003c/li\u003e\u003cli\u003eObject-Oriented Design\u003c/li\u003e\u003cli\u003eDBMS\u003c/li\u003e\u003cli\u003eOperating Systems\u003c/li\u003e\u003cli\u003eComputer Organisation\u003c/li\u003e\u003cli\u003eUML Modelling\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003eDomain\u003c/h5\u003e\n        \u003cul\u003e\n          \u003cli\u003eCollaborative Filtering\u003c/li\u003e\u003cli\u003eGraph Learning\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inv-card\"\u003e\n        \u003ch5\u003ePractices\u003c/h5\u003e\n        \u003cul\u003e\n          \u003cli\u003eCode Review\u003c/li\u003e\u003cli\u003eTesting &amp; Edge Cases\u003c/li\u003e\u003cli\u003eTechnical Writing\u003c/li\u003e\u003cli\u003eAPI Design\u003c/li\u003e\u003cli\u003eDebugging Under Load\u003c/li\u003e\n        \u003c/ul\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003c!-- FOOTER ADS --\u003e\n    \u003cdiv class=\"class-foot\"\u003e\n      \u003cdiv class=\"class-ad reveal\"\u003e\n        \u003ch4 class=\"class-title\"\u003eNow Acquiring\u003c/h4\u003e\n        \u003cp\u003eKubernetes · gRPC · seccomp / sandboxing · Observability &amp; tracing · Rust.\u003c/p\u003e\n        \u003cspan class=\"ref\"\u003eEnquiries welcome — see Correspondence, above.\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"class-ad reveal\"\u003e\n        \u003ch4 class=\"class-title\"\u003ePersonal\u003c/h4\u003e\n        \u003cp\u003e\u003cb\u003eGRATITUDE.\u003c/b\u003e — The Editor wishes to thank open-source maintainers, without whom no edition of this paper could be set.\u003c/p\u003e\n        \u003cp\u003e\u003cb\u003eNOTICE.\u003c/b\u003e — Long-form posts and the occasional hot take appear on LinkedIn, as reported.\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ============================================================\n       COLOPHON\n       ============================================================ --\u003e\n  \u003cfooter class=\"colophon\"\u003e\n    \u003cdiv class=\"colophon-inner\"\u003e\n      \u003cp class=\"colophon-mast\"\u003eThe Yuvraj Verma Chronicle\u003c/p\u003e\n      \u003cp class=\"colophon-note\"\u003eComputer Science at IIIT-Delhi. Software engineering — distributed systems, machine learning, and the code that connects them. Vol. I — No. 01.\u003c/p\u003e\n      \u003cdiv class=\"colophon-grid\"\u003e\n        \u003cdiv\u003e\n          \u003ch6\u003eNavigate the Edition\u003c/h6\u003e\n          \u003ca href=\"#about\"\u003ePage 02 — Profile\u003c/a\u003e\n          \u003ca href=\"#work\"\u003ePage 03 — Technology Desk\u003c/a\u003e\n          \u003ca href=\"#case-study\"\u003ePage 04 — Special Report\u003c/a\u003e\n          \u003ca href=\"#case-study-2\"\u003ePage 05 — Campus Desk\u003c/a\u003e\n          \u003ca href=\"#experience\"\u003ePage 05 — On the Record\u003c/a\u003e\n          \u003ca href=\"#process\"\u003ePage 06 — Opinion\u003c/a\u003e\n          \u003ca href=\"#skills\"\u003ePage 07 — Exchange &amp; Classifieds\u003c/a\u003e\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003ch6\u003eElsewhere\u003c/h6\u003e\n          \u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\"\u003eGitHub ↗\u003c/a\u003e\n          \u003ca href=\"https://www.linkedin.com/in/yuvraj-verma-/\" target=\"_blank\" rel=\"noopener\"\u003eLinkedIn ↗\u003c/a\u003e\n          \u003ca href=\"mailto:yuvrajworkemail@gmail.com\"\u003eEmail ↗\u003c/a\u003e\n        \u003c/div\u003e\n        \u003cdiv\u003e\n          \u003ch6\u003eColophon\u003c/h6\u003e\n          \u003cul\u003e\n            \u003cli\u003eOne HTML file, no build step.\u003c/li\u003e\n            \u003cli\u003eSet in UnifrakturCook, Playfair Display, Newsreader &amp; IBM Plex Mono.\u003c/li\u003e\n            \u003cli\u003eBlack ink on paper; no gradients were used.\u003c/li\u003e\n            \u003cli\u003eSmooth scroll by Lenis, driven by the GSAP ticker.\u003c/li\u003e\n            \u003cli\u003eView source — everything here is readable.\u003c/li\u003e\n          \u003c/ul\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"colophon-base\"\u003e\n        \u003cspan\u003e© 2026 \u003cb\u003eYuvraj Verma\u003c/b\u003e · Printed and published on the World Wide Web\u003c/span\u003e\n        \u003cspan\u003eBuilt by hand in \u003cb\u003eNew Delhi\u003c/b\u003e\u003c/span\u003e\n        \u003cspan\u003e\u003cb id=\"footClock\"\u003eDelhi — 00:00:00 IST\u003c/b\u003e\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/footer\u003e\n\u003c/div\u003e\n\n\u003c!-- ================================================================\n     LIBRARIES — Lenis + GSAP/ScrollTrigger\n     ================================================================ --\u003e\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js\"\u003e\u003c/script\u003e\n\n\u003cscript>\n/* ------------------------------------------------------------------\n   THE DATELINE\n   ------------------------------------------------------------------ */\n(function(){\n  var d = new Date();\n  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];\n  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];\n  var el = document.getElementById('dateline-date');\n  if(el){\n    el.textContent = days[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();\n  }\n})();\n\n/* ------------------------------------------------------------------\n   THE CLOCKS\n   ------------------------------------------------------------------ */\n(function(){\n  function tick(){\n    var t = new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false});\n    var a = document.getElementById('topClock');\n    var b = document.getElementById('footClock');\n    if(a) a.textContent = 'Delhi — ' + t + ' IST';\n    if(b) b.textContent = 'Delhi — ' + t + ' IST';\n  }\n  tick();\n  setInterval(tick,1000);\n})();\n\n/* ------------------------------------------------------------------\n   SMOOTH SCROLL — Lenis + GSAP ticker\n   ------------------------------------------------------------------ */\n(function(){\n  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var hasGSAP   = typeof window.gsap !== 'undefined';\n  var hasST     = typeof window.ScrollTrigger !== 'undefined';\n  var hasLenis  = typeof window.Lenis !== 'undefined';\n\n  if(hasGSAP && hasST){ gsap.registerPlugin(ScrollTrigger); }\n\n  var lenis = null;\n\n  if(hasLenis && !reduceMotion){\n    lenis = new Lenis({\n      duration: 1.15,\n      easing: function(t){ return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },\n      smoothWheel: true,\n      wheelMultiplier: 1,\n      touchMultiplier: 1.6,\n      smoothTouch: false\n    });\n\n    window.__lenis = lenis;\n\n    if(hasGSAP && hasST){\n      lenis.on('scroll', ScrollTrigger.update);\n      gsap.ticker.add(function(time){ lenis.raf(time * 1000); });\n      gsap.ticker.lagSmoothing(0);\n    } else {\n      var raf = function(t){ lenis.raf(t); requestAnimationFrame(raf); };\n      requestAnimationFrame(raf);\n    }\n  }\n\n  document.querySelectorAll('a[href^=\"#\"]').forEach(function(a){\n    if(a.classList.contains('skip-link')) return;\n\n    a.addEventListener('click', function(e){\n      var href = a.getAttribute('href');\n      if(!href || href === '#') return;\n\n      var target = document.querySelector(href);\n      if(!target) return;\n\n      e.preventDefault();\n\n      if(lenis){\n        lenis.scrollTo(target, { offset: -24, duration: 1.15 });\n      } else {\n        target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });\n      }\n\n      if(history.replaceState){ history.replaceState(null, '', href); }\n    });\n  });\n})();\n\n/* ------------------------------------------------------------------\n   REVEALS + ACTIVE SECTION\n   ------------------------------------------------------------------ */\n(function(){\n  var els = [].slice.call(document.querySelectorAll('.reveal'));\n  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  var links = [].slice.call(document.querySelectorAll('.section-nav a'));\n\n  function setActive(link){\n    links.forEach(function(l){ l.removeAttribute('aria-current'); });\n    if(link) link.setAttribute('aria-current','true');\n  }\n\n  if(window.ScrollTrigger && !reduceMotion){\n    els.forEach(function(el){\n      ScrollTrigger.create({\n        trigger: el,\n        start: 'top 92%',\n        once: true,\n        onEnter: function(){ el.classList.add('in'); }\n      });\n    });\n\n    links.forEach(function(link){\n      var id = link.getAttribute('href');\n      if(!id || id === '#') return;\n      var sec = document.querySelector(id);\n      if(!sec) return;\n\n      ScrollTrigger.create({\n        trigger: sec,\n        start: 'top 45%',\n        end: 'bottom 45%',\n        onToggle: function(self){ if(self.isActive) setActive(link); }\n      });\n    });\n\n    window.addEventListener('load', function(){\n      ScrollTrigger.refresh();\n    });\n\n  } else {\n    if(!('IntersectionObserver' in window)){\n      els.forEach(function(el){ el.classList.add('in'); });\n      return;\n    }\n    var io = new IntersectionObserver(function(entries){\n      entries.forEach(function(e){\n        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }\n      });\n    },{ threshold:0.06, rootMargin:'0px 0px -30px 0px' });\n    els.forEach(function(el){ io.observe(el); });\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"</script>

<script>
(function(){
'use strict';

const CFG      = JSON.parse(document.getElementById('cfg').textContent);
const DESIGNS  = CFG.designs;
const BY       = {}; DESIGNS.forEach(d => BY[d.id] = d);
const SECTIONS = CFG.sections;          // ids shared by all three designs
const PROBE    = 0.35;                  // the "you are here" line, as a fraction of viewport height

const $stage = document.getElementById('stage');
const $scrim = document.getElementById('scrim');
const $ring  = document.getElementById('ring');
const $sw    = document.getElementById('switcher');
const $live  = document.getElementById('live');
const $theme = document.getElementById('themeColor');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

const S = {};                 // id -> { d, layer, frame, ready, loaded, maxY }
let current = null, busy = false, pending = null, lastPointer = null;
let $thumb;

const clamp  = (v,a,b) => Math.min(b, Math.max(a, v));
const sleep  = ms => new Promise(r => setTimeout(r, ms));
const frames = n => new Promise(r => requestAnimationFrame(() => n > 1 ? frames(n-1).then(r) : r()));

/* ── remember / restore ─────────────────────────────────────────── */
function initialId(){
  const h = location.hash.replace('#','').toLowerCase();
  if (BY[h]) return h;
  try { const s = localStorage.getItem('portfolio-design'); if (BY[s]) return s; } catch(e){}
  return CFG.default;
}
function remember(id){
  try { localStorage.setItem('portfolio-design', id); } catch(e){}
  try { history.replaceState(null, '', '#' + id); } catch(e){}
}

/* ── layers ─────────────────────────────────────────────────────── */
function create(id){
  if (S[id]) return S[id];
  const d = BY[id];
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.inert = true;
  layer.setAttribute('aria-hidden','true');

  const frame = document.createElement('iframe');
  frame.title = d.name + ' design of the portfolio';
  const holder = document.getElementById('doc-' + id);
  frame.srcdoc = JSON.parse(holder.textContent);
  holder.remove();                                  // free the duplicate string

  const rec = { d, layer, frame, loaded:false, maxY:0 };
  rec.ready = new Promise(res => frame.addEventListener('load', () => {
    rec.loaded = true;
    try {
      frame.contentWindow.addEventListener('scroll', () => {
        rec.maxY = Math.max(rec.maxY, frame.contentWindow.scrollY || 0);
      }, { passive:true });
    } catch(e){}
    res(rec);
  }, { once:true }));

  layer.appendChild(frame);
  $stage.appendChild(layer);
  S[id] = rec;
  return rec;
}
function markCurrent(rec){
  rec.layer.classList.add('is-current');
  rec.layer.inert = false;
  rec.layer.removeAttribute('aria-hidden');
}
function markIdle(rec){
  rec.layer.classList.remove('is-current');
  rec.layer.inert = true;
  rec.layer.setAttribute('aria-hidden','true');
}

/* ── where is the reader? (same section, same relative depth) ──── */
function layout(frame){
  const w = frame.contentWindow, doc = frame.contentDocument, sy = w.scrollY;
  const arr = [];
  SECTIONS.forEach(id => {
    const el = doc.getElementById(id);
    if (el) arr.push({ id, top: el.getBoundingClientRect().top + sy });
  });
  arr.sort((a,b) => a.top - b.top);
  const docH = doc.documentElement.scrollHeight;
  arr.forEach((s,i) => s.end = i < arr.length-1 ? arr[i+1].top : docH);
  return { arr, sy, vh:w.innerHeight, docH };
}
function readPosition(frame){
  const L = layout(frame);
  if (!L.arr.length) return null;
  const probeY = L.sy + L.vh * PROBE;
  let cur = L.arr[0];
  L.arr.forEach(s => { if (s.top <= probeY) cur = s; });
  return {
    id: cur.id,
    frac: clamp((probeY - cur.top) / Math.max(1, cur.end - cur.top), 0, 1),
    atTop: L.sy < 4,
    atBottom: L.sy + L.vh >= L.docH - 4
  };
}
function targetFor(frame, pos){
  if (!pos || pos.atTop) return 0;
  const L = layout(frame), max = Math.max(0, L.docH - L.vh);
  if (pos.atBottom) return max;
  const s = L.arr.find(x => x.id === pos.id);
  if (!s) return 0;
  return clamp(s.top + pos.frac * (s.end - s.top) - L.vh * PROBE, 0, max);
}
/* Scroll-triggered reveals only fire for what is scrolled past, so walk the
   hidden page down to just above the target before jumping the last screen. */
async function warm(rec, targetY){
  const w = rec.frame.contentWindow, vh = w.innerHeight;
  const goal = targetY - vh * 0.8;      // the last pass reaches the landing point's own reveal zone
  if (goal <= rec.maxY) return;
  let y = rec.maxY;
  const t0 = performance.now();
  while (y < goal && performance.now() - t0 < 1100){
    y = Math.min(y + vh * 0.8, goal);
    w.scrollTo({ top:y, behavior:'instant' });
    await frames(2);
  }
}

/* ── switcher UI ────────────────────────────────────────────────── */
function buildSwitcher(){
  const track = document.createElement('div');
  track.className = 'sw-track';
  track.setAttribute('role','radiogroup');
  track.setAttribute('aria-label','Design');
  $thumb = document.createElement('span');
  $thumb.className = 'sw-thumb';
  $thumb.setAttribute('aria-hidden','true');
  track.appendChild($thumb);

  DESIGNS.forEach((d,i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw-btn';
    b.dataset.id = d.id;
    b.setAttribute('role','radio');
    b.title = d.name + ' (press ' + (i+1) + ')';
    b.innerHTML = '<span class="n">0' + (i+1) + '</span><span>' + d.name + '</span>';
    b.addEventListener('click', e => {
      const fromPointer = e.detail > 0;             // 0 = keyboard "click"
      const r = b.getBoundingClientRect();
      switchTo(d.id, fromPointer
        ? { x:e.clientX, y:e.clientY, pointer:true }
        : { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false });
    });
    b.addEventListener('keydown', e => {
      const keys = { ArrowLeft:-1, ArrowUp:-1, ArrowRight:1, ArrowDown:1 };
      let i2 = null;
      if (e.key in keys) i2 = (i + keys[e.key] + DESIGNS.length) % DESIGNS.length;
      else if (e.key === 'Home') i2 = 0;
      else if (e.key === 'End')  i2 = DESIGNS.length - 1;
      if (i2 === null) return;
      e.preventDefault();
      const nb = track.children[i2 + 1];            // +1: thumb is first child
      nb.focus();
      const r = nb.getBoundingClientRect();
      switchTo(DESIGNS[i2].id, { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false });
    });
    track.appendChild(b);
  });
  $sw.appendChild(track);

  /* wheel over the pill should still scroll the page behind it */
  $sw.addEventListener('wheel', e => {
    e.preventDefault();
    const rec = S[current];
    if (!rec || !rec.loaded) return;
    const w = rec.frame.contentWindow, root = w.document.documentElement;
    if (root.classList.contains('lenis')){
      root.dispatchEvent(new w.WheelEvent('wheel', {
        deltaX:e.deltaX, deltaY:e.deltaY, deltaMode:e.deltaMode,
        clientX:e.clientX, clientY:e.clientY, bubbles:true, cancelable:true
      }));
    } else {
      w.scrollBy({ top:e.deltaY, left:e.deltaX, behavior:'instant' });
    }
  }, { passive:false });
}
function setPill(id){
  $sw.dataset.design = id;
  $sw.querySelectorAll('.sw-btn').forEach(b => {
    const on = b.dataset.id === id;
    b.setAttribute('aria-checked', on);
    b.tabIndex = on ? 0 : -1;
  });
  placeThumb();
}
function placeThumb(){
  const b = $sw.querySelector('.sw-btn[aria-checked="true"]');
  if (!b || !$thumb) return;
  $thumb.style.width = b.offsetWidth + 'px';
  $thumb.style.transform = 'translateX(' + b.offsetLeft + 'px)';
}
function applyChrome(id){
  const d = BY[id];
  document.documentElement.style.setProperty('--page-bg', d.bg);
  $theme.content = d.bg;
  document.title = d.title;
}

/* ── THE SWITCH ─────────────────────────────────────────────────── */
async function switchTo(id, origin){
  if (!BY[id]) return;
  if (id === current){ pending = null; setPill(current); return; }   // changed their mind
  if (busy){ pending = { id, origin }; setPill(id); return; }
  busy = true;

  const fromId = current;
  const from = S[fromId], to = create(id), toD = to.d;
  current = id;
  setPill(id);
  remember(id);
  $live.textContent = toD.name + ' design';

  $sw.classList.add('loading');
  await to.ready;

  const W = innerWidth, H = innerHeight;
  let pt = origin;
  if (!pt){
    const r = $sw.getBoundingClientRect();
    pt = { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false };
  }
  const x = pt.x, y = pt.y;
  lastPointer = pt.pointer ? { x, y } : null;

  /* 1 ─ work out where the reader is, and where that is in the new design */
  let targetY = 0;
  try { targetY = targetFor(to.frame, readPosition(from.frame)); } catch(e){}

  /* 2 ─ position the incoming design while it is still hidden
         (browsers stop running scroll observers in a fully clipped frame) */
  markIdle(from);
  from.layer.style.visibility = 'visible';
  const L = to.layer;
  const tw = to.frame.contentWindow;
  try {
    await warm(to, targetY);
    tw.scrollTo({ top:targetY, behavior:'instant' });
  } catch(e){}
  await frames(2);
  $sw.classList.remove('loading');

  /* …then stage it: on top, clipped to nothing */
  L.style.zIndex = 3;
  L.style.visibility = 'visible';
  if (!reduced.matches) L.style.clipPath = 'circle(0px at ' + x + 'px ' + y + 'px)';
  else L.style.opacity = 0;

  /* 3 ─ play it */
  const anims = [];
  let dur;
  if (reduced.matches){
    dur = 260;
    anims.push(L.animate([{opacity:0},{opacity:1}], { duration:dur, easing:'ease-out', fill:'both' }));
    setTimeout(() => applyChrome(id), dur * 0.4);
  } else {
    const R = Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) + 4;
    dur = Math.round(clamp(R * 0.55 + 520, 820, 1150));
    const o = { duration:dur, easing:'cubic-bezier(.77,0,.18,1)', fill:'both' };
    const at = 'at ' + x + 'px ' + y + 'px';

    anims.push(L.animate(
      [{ clipPath:'circle(0px ' + at + ')' }, { clipPath:'circle(' + R + 'px ' + at + ')' }], o));
    anims.push(to.frame.animate(
      [{ transform:'scale(1.07)' }, { transform:'scale(1)' }], o));
    anims.push(from.frame.animate(
      [{ transform:'scale(1)' }, { transform:'scale(.93)' }], o));
    anims.push($scrim.animate(
      [{ opacity:0 }, { opacity:.6 }], o));

    $ring.style.setProperty('--ring', toD.accent);
    $ring.style.width  = $ring.style.height = (R * 2) + 'px';
    $ring.style.left   = (x - R) + 'px';
    $ring.style.top    = (y - R) + 'px';
    anims.push($ring.animate([
      { transform:'scale(0)',  opacity:1, offset:0 },
      { transform:'scale(.8)', opacity:1, offset:.8 },
      { transform:'scale(1)',  opacity:0, offset:1 }
    ], o));

    setTimeout(() => applyChrome(id), dur * 0.42);
  }

  try { await Promise.all(anims.map(a => a.finished)); } catch(e){}

  /* 4 ─ settle: incoming becomes the page, outgoing goes to sleep */
  L.style.clipPath = ''; L.style.zIndex = ''; L.style.visibility = ''; L.style.opacity = '';
  markCurrent(to);
  from.layer.style.visibility = '';
  anims.forEach(a => { try { a.cancel(); } catch(e){} });
  applyChrome(id);

  if (lastPointer){
    try {
      tw.dispatchEvent(new tw.MouseEvent('mousemove',
        { clientX:lastPointer.x, clientY:lastPointer.y, bubbles:true }));
    } catch(e){}
  }
  if (pt.pointer){ try { document.activeElement && document.activeElement.blur(); tw.focus(); } catch(e){} }

  busy = false;
  if (pending){
    const p = pending; pending = null;
    if (p.id !== current) switchTo(p.id, p.origin);
  }
}

/* ── shortcuts: 1 / 2 / 3, also relayed from inside the designs ── */
function shortcut(key){
  const i = ['1','2','3'].indexOf(key);
  if (i < 0 || !DESIGNS[i]) return;
  switchTo(DESIGNS[i].id, null);
}
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  shortcut(e.key);
});
window.addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.__portfolioSwitch) return;
  const ok = Object.keys(S).some(k => S[k].frame.contentWindow === e.source);
  if (ok) shortcut(m.key);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','').toLowerCase();
  if (BY[h] && h !== current) switchTo(h, null);
});
window.addEventListener('resize', placeThumb);

/* ── boot ───────────────────────────────────────────────────────── */
current = initialId();
applyChrome(current);
$sw.classList.add('no-anim');
buildSwitcher();
setPill(current);
const settle = () => { placeThumb(); frames(2).then(() => $sw.classList.remove('no-anim')); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle); else settle();

const first = create(current);
markCurrent(first);

if (CFG.preload){
  first.ready.then(async () => {
    await sleep(CFG.preloadDelay);
    await new Promise(r => 'requestIdleCallback' in window ? requestIdleCallback(r, { timeout:2500 }) : r());
    for (const d of DESIGNS){
      if (S[d.id]) continue;
      await create(d.id).ready;
      await sleep(350);
    }
  });
}

})();
</script>
