  box-shadow:var(--sw-shadow);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  transition:background-color .7s,border-color .7s,border-radius .7s,box-shadow .7s;
}
.sw-thumb{
  position:absolute;left:0;top:4px;bottom:4px;width:0;
  background:var(--sw-thumb);border-radius:max(0px,calc(var(--sw-radius) - 4px));
  transition:transform .6s cubic-bezier(.34,1.32,.5,1),width .6s cubic-bezier(.34,1.32,.5,1),
             background-color .7s,border-radius .7s;
  will-change:transform,width;
}

  position:relative;z-index:1;display:flex;align-items:center;gap:7px;
  padding:11px 14px;color:var(--sw-fg);background:none;border:0;cursor:pointer;
  font:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:color .5s,opacity .3s;
}
.sw-btn:hover{opacity:.78}

.sw-btn:focus-visible{outline:2px solid var(--sw-thumb);outline-offset:3px;border-radius:4px}
.sw-btn .n{opacity:.5;font-weight:500}
.switcher.loading .sw-thumb{animation:swPulse .7s ease-in-out infinite alternate}

  .sw-btn .n{display:none}

}
.switcher.no-anim *{transition:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

\u003c/span>\u003cspan class=\"m-arrow\">↗\u003c/span>\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"#skills\" data-cursor=\"→\">\u003cspan class=\"n\">07\u003c/span>\u003cspan class=\"ml-t\">Toolkit\u003c/span>\u003cspan class=\"m-arrow\">↗\u003c/span>\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"#contact\" data-cursor=\"→\">\u003cspan class=\"n\">08\u003c/span>\u003cspan class=\"ml-t\">Contact\u003c/span>\u003cspan class=\"m-arrow\">↗\u003c/span>\u003c/a>\u003c/li>\n  \u003c/ul>\n  \u003cdiv class=\"menu-foot\">\n    \u003ca href=\"mailto:yuvrajworkemail@gmail.com\">yuvrajworkemail@gmail.com\u003c/a>\n    \u003cspan>\u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\">GITHUB\u003c/a> / \u003ca href=\"https://www.linkedin.com/in/yuvraj-verma-/\" target=\"_blank\" rel=\"noopener\">LINKEDIN\u003c/a>\u003c/span>\n    \u003cspan class=\"ist-clock mono\">DELHI — 00:00:00 IST\u003c/span>\n    \u003cspan>ESC TO CLOSE\u003c/span>\n  \u003c/div>\n\u003c/nav>\n\n\u003cmain>\n\n\u003csection class=\"hero\" id=\"home\">\n  \u003cdiv class=\"hero-topline mono\">\n    \u003cspan>ENGINEERING PORTFOLIO — VOL.01 \u003cb>//\u003c/b> ONE HTML FILE, WRITTEN BY HAND\u003c/span>\n    \u003cspan>IIIT-DELHI · CS MAJOR · COMP BIO MINOR\u003c/span>\n  \u003c/div>\n\n  \u003cspan class=\"avail\" data-fade>\u003ci>\u003c/i>OPEN TO SWEAI / PRODUCT ROLES — 2026 · OPEN SOURCE PRs WELCOME\u003c/span>\n\n  \u003ch1 class=\"hero-title\">\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">CODE,\u003c/span>\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni outline\">SYSTEMS,\u003c/span>\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni serif serif-line\">people.\u003c/span>\u003c/span>\n  \u003c/h1>\n\n  \u003cdiv class=\"hero-grid\">\n    \u003cp class=\"hero-sub\">B.Tech at IIIT-Delhi (2023–2027) — \u003cstrong>Computer Science major with a Computational Biology minor\u003c/strong>. I write the kind of code that has to hold up under\n      load and under review: \u003cstrong class=\"glow\">async pipelines, sandboxed execution, graph-based models\u003c/strong>,\n      and the tests that keep them honest. Open to SWEAI / Product roles for 2026 —\n      and to good open-source work any time.\u003c/p>\n    \u003cdiv class=\"hero-cta\">\n      \u003ca href=\"#work\" class=\"btn solid magnetic\" data-cursor=\"→\">READ THE CODE \u003cspan>↓\u003c/span>\u003c/a>\n      \u003ca href=\"#contact\" class=\"btn magnetic\" data-cursor=\"→\">LET'S TALK\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">\u003cspan data-count=\"5\">0\u003c/span>×\u003c/div>\u003cdiv class=\"k\">Sponsorship revenue · E-Summit\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">\u003cspan data-count=\"3\">0\u003c/span>\u003c/div>\u003cdiv class=\"k\">Languages in the judge\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">+\u003cspan data-count=\"3.2\" data-dec=\"1\">0\u003c/span>%\u003c/div>\u003cdiv class=\"k\">NDCG@10 uplift\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">'\u003cspan data-count=\"27\" data-pad=\"2\">0\u003c/span>\u003c/div>\u003cdiv class=\"k\">Graduating\u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"scroll-cue mono\">SCROLL\u003ci>\u003c/i>\u003c/div>\n\u003c/section>\n\n\u003cdiv class=\"marquee\" aria-hidden=\"true\">\u003cdiv class=\"mq-track\" id=\"mq1\">\u003c/div>\u003c/div>\n\n\u003csection id=\"about\">\n  \u003cspan class=\"sec-ghost\">01\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">01\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">ABOUT\u003c/span>\u003c/div>\n  \u003cdiv class=\"about-grid\">\n    \u003cdiv class=\"id-card\" data-fade>\n      \u003cdiv class=\"id-photo-wrap\">\n        \u003cimg src=\"yuvraj.webp\" alt=\"Yuvraj Verma\" width=\"150\" height=\"188\" loading=\"lazy\">\n        \u003ci>\u003c/i>\u003ci>\u003c/i>\n      \u003c/div>\n      \u003cdiv class=\"id-badge\">\n        \u003cdiv class=\"yy\">YV\u003c/div>\n        \u003cdiv class=\"nm\">Yuvraj Verma\u003csmall>COMPUTER SCIENCE · IIIT-DELHI\u003c/small>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>BASED IN\u003c/b>\u003cspan>Delhi, India\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>PROGRAM\u003c/b>\u003cspan>B.Tech CS · Comp Bio Minor\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>BATCH\u003c/b>\u003cspan>2023 — 2027\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>WRITES\u003c/b>\u003cspan>Python · Java · C/C++ · SQL\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>FOCUS\u003c/b>\u003cspan>SWEAI / Product\u003c/span>\u003c/div>\n      \u003cdiv class=\"mono-row\">\u003cb>STATUS\u003c/b>\u003cspan class=\"status-dot\">\u003ci>\u003c/i>Open to roles\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch2 class=\"about-statement\" data-lines>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">I write code for systems\u003c/span>\u003c/span>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni serif\">that have to hold.\u003c/span>\u003c/span>\n      \u003c/h2>\n      \u003cdiv class=\"about-copy\" data-fade>\n        \u003cp>My degree is a \u003cstrong>Computer Science major with a Computational Biology minor\u003c/strong>. The CS side is where I spend my time — algorithms, systems, data structures, the boring parts that decide whether anything else works. The biology side taught me to work with \u003cstrong>large, high-dimensional, genuinely messy data\u003c/strong>, and to build the pipelines that make it legible. That's the thread through everything I ship: data in, system out, tests around it.\u003c/p>\n        \u003cp>Most of my work lives in the backend and the model layer. I've built an \u003cstrong>async, queue-based coding judge\u003c/strong> that sandboxes untrusted code in Docker; a \u003cstrong>hybrid recommender\u003c/strong> combining graph collaborative filtering with SBERT semantic matching; and Java systems modelled before they were coded. My stack spans \u003cstrong>Python, Java, Spring Boot, RabbitMQ, PostgreSQL, PyTorch and Docker\u003c/strong> — and I care as much about the readability of the diff as the benchmark number.\u003c/p>\n        \u003cp>What I'm looking for: engineering teams where the work is technical, \u003cstrong>code review is honest\u003c/strong>, and shipping is measured in uptime and error budgets — not slide decks.\u003c/p>\n      \u003c/div>\n      \u003cp class=\"aside\" data-fade>— messy data is where the engineering lives. \u003cb>That's where I want to work.\u003c/b>\u003c/p>\n      \u003cdiv class=\"chips\" data-fade>\n        \u003cspan class=\"chip\">Algorithm Design\u003c/span>\u003cspan class=\"chip\">Distributed Systems\u003c/span>\n        \u003cspan class=\"chip\">Machine Learning\u003c/span>\u003cspan class=\"chip\">Backend Engineering\u003c/span>\n        \u003cspan class=\"chip\">Large-Scale Data\u003c/span>\u003cspan class=\"chip\">Computational Biology\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"process\">\n  \u003cspan class=\"sec-ghost\">02\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">02\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">HOW I BUILD\u003c/span>\u003c/div>\n  \u003ch2 class=\"h2\" data-lines>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">From paper\u003c/span>\u003c/span>\n    \u003cspan class=\"ln\">\u003cspan class=\"lni\">to \u003cspan class=\"serif\" style=\"color:var(--acc)\">shipped.\u003c/span>\u003c/span>\u003c/span>\n  \u003c/h2>\n  \u003cp class=\"kicker mono\" data-fade style=\"margin-top:22px\">\u003cb>/\u003c/b> FOUR MOVES I KEEP COMING BACK TO — SHAPED BY REPRODUCING LIGHTGCN FROM SCRATCH.\u003c/p>\n\n  \u003cdiv class=\"proc-grid\">\n    \u003cdiv class=\"proc\" data-fade>\n      \u003cspan class=\"proc-n mono\">/ 01\u003c/span>\n      \u003ch4>Model\u003c/h4>\n      \u003cp>Read the paper before you type. When reproducing \u003cem>LightGCN\u003c/em>, the first job wasn't writing PyTorch — it was understanding \u003cstrong>what the original GCN was doing wrong\u003c/strong>, and why a simpler propagation could outperform it. The data has a shape; the model should follow it, not impose one.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"proc\" data-fade>\n      \u003cspan class=\"proc-n mono\">/ 02\u003c/span>\n      \u003ch4>Build\u003c/h4>\n      \u003cp>From scratch means from scratch. \u003cstrong>Adjacency normalisation, layer-wise propagation, the ranking objective\u003c/strong> — each piece built and verified in isolation before it composed with the next. The paper's own ablations were a warning: \u003cstrong>more layers is not more signal.\u003c/strong>\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"proc\" data-fade>\n      \u003cspan class=\"proc-n mono\">/ 03\u003c/span>\n      \u003ch4>Test\u003c/h4>\n      \u003cp>Match the protocol, not just the metric. We ran the same \u003cstrong>leave-one-out split and negative sampling\u003c/strong> the paper used, so any deviation we saw was a property of the model — not of our testing. Ablations over depth and dimension were as much about understanding our own implementation as measuring it.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"proc\" data-fade>\n      \u003cspan class=\"proc-n mono\">/ 04\u003c/span>\n      \u003ch4>Ship\u003c/h4>\n      \u003cp>A result is only as trustworthy as the caveats attached to it. \u003cstrong>Write down what you can't claim\u003c/strong> — the small sample, the incomparable baseline, the variance you haven't ruled out. Shipping means being honest about scope, not just loud about the number.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"work\">\n  \u003cspan class=\"sec-ghost\">03\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">03\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">CODE &amp; PROJECTS\u003c/span>\u003c/div>\n  \u003cp class=\"kicker mono\" data-fade>\u003cb>/\u003c/b> THREE REPOS THAT BEST SHOW HOW I ENGINEER — BACKEND SYSTEMS, ML, AND MODELLING.\u003c/p>\n\n  \u003cdiv class=\"work-list\">\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/lightgcn-hybrid-recommender\" target=\"_blank\" rel=\"noopener\" data-project=\"0\" data-cursor=\"OPEN ↗\">\n      \u003cdiv class=\"work-idx mono\">/ 01\u003c/div>\n      \u003cdiv class=\"work-main\">\n        \u003ch3 class=\"work-title\">LightGCN Recommendation&nbsp;Engine\u003c/h3>\n        \u003cp class=\"work-desc\">Hybrid recommender combining graph-based collaborative filtering (LightGCN) with \u003cstrong>SBERT semantic matching\u003c/strong> and Groq-powered query refinement. Improved NDCG@10 by \u003cstrong>3.2%\u003c/strong> and pushed HR@10 to \u003cstrong>0.80\u003c/strong> in evaluation. Built under Dr. Angshul Majumdar.\u003c/p>\n        \u003cdiv class=\"work-tags mono\">PYTHON \u003cb>·\u003c/b> PYTORCH \u003cb>·\u003c/b> LIGHTGCN \u003cb>·\u003c/b> SBERT \u003cb>·\u003c/b> GROQ\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"work-side\">\n        \u003cspan class=\"work-cat mono\">ML · RECOMMENDERS\u003c/span>\n        \u003cspan class=\"work-arrow\">↗\u003c/span>\n      \u003c/div>\n    \u003c/a>\n\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/CodeJudge-with-Docker-sandbox-and-RabbitMQ-worker\" target=\"_blank\" rel=\"noopener\" data-project=\"1\" data-cursor=\"OPEN ↗\">\n      \u003cdiv class=\"work-idx mono\">/ 02\u003c/div>\n      \u003cdiv class=\"work-main\">\n        \u003ch3 class=\"work-title\">CodeJudge — Distributed Assessment&nbsp;Platform\u003c/h3>\n        \u003cp class=\"work-desc\">A distributed online coding assessment platform built on \u003cstrong>Java Spring Boot\u003c/strong>. Submissions in Python, Java and C++ are judged \u003cstrong>asynchronously\u003c/strong>: the API saves the submission as \u003ccode>PENDING\u003c/code> in PostgreSQL and publishes its ID to RabbitMQ, a judge worker consumes it and executes the code inside an \u003cstrong>isolated Docker container with no network and hard memory/CPU caps\u003c/strong>, then writes the verdict back. Role-based admin panel for problems and visible/hidden test cases, 12 pre-loaded problems, and a one-click Docker Compose deploy.\u003c/p>\n        \u003cdiv class=\"work-tags mono\">SPRING BOOT \u003cb>·\u003c/b> RABBITMQ \u003cb>·\u003c/b> DOCKER \u003cb>·\u003c/b> POSTGRESQL \u003cb>·\u003c/b> MONACO\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"work-side\">\n        \u003cspan class=\"work-cat mono\">SYSTEMS · BACKEND\u003c/span>\n        \u003cspan class=\"work-arrow\">↗\u003c/span>\n      \u003c/div>\n    \u003c/a>\n\n    \u003ca class=\"work\" href=\"https://github.com/yuvraj-23617/Course-Registration-System\" target=\"_blank\" rel=\"noopener\" data-project=\"2\" data-cursor=\"OPEN ↗\">\n      \u003cdiv class=\"work-idx mono\">/ 03\u003c/div>\n      \u003cdiv class=\"work-main\">\n        \u003ch3 class=\"work-title\">Course Registration&nbsp;System\u003c/h3>\n        \u003cp class=\"work-desc\">Java system built around clean OOP and UML modelling — \u003cstrong>4 user roles and 8+ features\u003c/strong> covering the full registration lifecycle: enrollment, CGPA calculation, complaint handling. Modelled before it was coded, because \u003cstrong>the spec is part of the source\u003c/strong>.\u003c/p>\n        \u003cdiv class=\"work-tags mono\">JAVA \u003cb>·\u003c/b> OOP \u003cb>·\u003c/b> UML \u003cb>·\u003c/b> DESIGN PATTERNS\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"work-side\">\n        \u003cspan class=\"work-cat mono\">JAVA · OOP\u003c/span>\n        \u003cspan class=\"work-arrow\">↗\u003c/span>\n      \u003c/div>\n    \u003c/a>\n  \u003c/div>\n  \u003cp class=\"work-note mono\" data-fade>ALSO ON GITHUB — EXPERIMENTS, TOOLING &amp; OPEN SOURCE → \u003ca href=\"https://github.com/yuvraj-23617\" target=\"_blank\" rel=\"noopener\" data-cursor=\"↗\">github.com/yuvraj-23617\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003cdiv class=\"pv\" id=\"pv\" aria-hidden=\"true\">\n  \u003cdiv class=\"pv-slide pv-s1\">\u003cspan class=\"lab mono\">/ 01 — ML · RECOMMENDERS\u003c/span>\u003cspan class=\"big\">LightGCN\u003cbr>Hybrid Engine\u003c/span>\u003c/div>\n  \u003cdiv class=\"pv-slide pv-s2\">\u003cspan class=\"lab mono\">/ 02 — SYSTEMS · BACKEND\u003c/span>\u003cspan class=\"big\">CodeJudge\u003cbr>Distributed\u003c/span>\u003c/div>\n  \u003cdiv class=\"pv-slide pv-s3\">\u003cspan class=\"lab mono\">/ 03 — JAVA · OOP\u003c/span>\u003cspan class=\"big\">Course\u003cbr>Registration\u003c/span>\u003c/div>\n  \u003cdiv class=\"scan\">\u003c/div>\n\u003c/div>\n\n\u003csection id=\"case-study\">\n  \u003cspan class=\"sec-ghost\">04\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">04\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">CASE STUDY · 01\u003c/span>\u003c/div>\n  \u003cdiv class=\"cs-grid\">\n    \u003cdiv class=\"cs-left\">\n      \u003cp class=\"kicker mono\" data-fade>\u003cb>/\u003c/b> CODEJUDGE — DISTRIBUTED CODING ASSESSMENT PLATFORM · SPRING BOOT · RABBITMQ · DOCKER\u003c/p>\n      \u003ch2 class=\"h2\" data-lines>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">Running untrusted\u003c/span>\u003c/span>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">code at scale.\u003c/span>\u003c/span>\n      \u003c/h2>\n      \u003cdiv class=\"cs-five\">3\u003cspan style=\"font-size:.35em;color:var(--ink);margin-left:.15em\">LANG\u003c/span>\u003c/div>\n      \u003cp class=\"meta\" data-fade>ROLE — DESIGN + FULL-STACK IMPLEMENTATION\u003cbr>STACK — SPRING BOOT · RABBITMQ · DOCKER · POSTGRESQL · MONACO\u003cbr>RESULT — ASYNC JUDGE FOR PYTHON, JAVA &amp; C++\u003cbr>DEPLOY — ONE-CLICK DOCKER COMPOSE, 12 PRE-LOADED PROBLEMS\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"cs-right\">\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">01 / PROBLEM\u003c/span>\n        \u003cdiv>\u003ch4>Synchronous judging \u003cspan>doesn't scale.\u003c/span>\u003c/h4>\n        \u003cp>Traditional coding platforms run submissions inline — the request thread blocks while the compiler runs and test cases execute. Under any real load that means \u003cstrong>queue buildup, timeouts, and broken UX\u003c/strong>. And the moment you're executing code someone else wrote, you're already in security territory.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">02 / APPROACH\u003c/span>\n        \u003cdiv>\u003ch4>Decouple submission \u003cspan>from execution.\u003c/span>\u003c/h4>\n        \u003cp>The submission endpoint only validates and enqueues: the submission is saved in \u003cstrong>PostgreSQL\u003c/strong> with verdict \u003ccode>PENDING\u003c/code>, and its ID is published to a \u003cstrong>RabbitMQ\u003c/strong> queue. A judge worker consumes the message, writes the code to a temporary directory, executes it inside an isolated \u003cstrong>Docker\u003c/strong> container, compares the output against visible and hidden test cases, and writes the final verdict back. The frontend polls the submission until the verdict lands — Spring Boot handles the API, PostgreSQL holds users, problems, submissions and test cases.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">03 / DECISION\u003c/span>\n        \u003cdiv>\u003ch4>Sandbox everything, \u003cspan>trust nothing.\u003c/span>\u003c/h4>\n        \u003cp>Every submission runs in a fresh container with \u003cstrong>networking disabled\u003c/strong> and hard resource caps: \u003cstrong>128MB memory and 0.5 CPU for Python, 512MB and 1.5 CPU for Java and C++\u003c/strong>, with an execution timeout on top. It costs latency, but \u003cstrong>you cannot run arbitrary user code on the same machine that holds your database\u003c/strong>. This was the design decision I'd defend hardest in review — the trade-off is deliberate.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">04 / OUTCOME\u003c/span>\n        \u003cdiv>\u003ch4>Async, multi-language, \u003cspan>and instructor-friendly.\u003c/span>\u003c/h4>\n        \u003cp>Three languages supported (Python, Java, C++), submissions judged asynchronously with verdicts of \u003cstrong>ACCEPTED, WRONG_ANSWER or RUNTIME_ERROR\u003c/strong> plus recorded execution time. \u003cstrong>12 pre-loaded problems\u003c/strong> ship with visible and hidden test cases, role-based access separates admins from users, and the admin dashboard lets instructors \u003cstrong>create, edit and delete problems and test cases without touching the codebase\u003c/strong>. The candidate UI is a real terminal — because the assessment should feel like the tools engineers actually use.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">05 / NEXT\u003c/span>\n        \u003cdiv>\u003ch4>What I'd carry \u003cspan>forward.\u003c/span>\u003c/h4>\n        \u003cp>Replace polling with \u003cstrong>WebSocket live verdicts\u003c/strong> and move to \u003cstrong>JWT stateless auth\u003c/strong>. Persist submission history in the database instead of local storage, add \u003cstrong>Redis caching\u003c/strong> for problems and test cases, and scale out with \u003cstrong>multiple judge workers\u003c/strong> under Kubernetes with a CI/CD pipeline. And harden the sandbox further — \u003cstrong>the security model is never done\u003c/strong>.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cblockquote class=\"cs-quote\" data-fade>\"The hard part isn't running code — it's \u003cb>running untrusted code safely.\u003c/b>\"\u003c/blockquote>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"case-study-2\">\n  \u003cspan class=\"sec-ghost\">05\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">05\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">CASE STUDY · 02\u003c/span>\u003c/div>\n  \u003cdiv class=\"cs-grid\">\n    \u003cdiv class=\"cs-left\">\n      \u003cp class=\"kicker mono\" data-fade>\u003cb>/\u003c/b> E-SUMMIT'26 — IIIT-DELHI'S FLAGSHIP ENTREPRENEURSHIP SUMMIT\u003c/p>\n      \u003ch2 class=\"h2\" data-lines>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">Qualify the prospect,\u003c/span>\u003c/span>\n        \u003cspan class=\"ln\">\u003cspan class=\"lni\">then pitch.\u003c/span>\u003c/span>\n      \u003c/h2>\n      \u003cdiv class=\"cs-five\">\u003cspan data-count=\"5\">0\u003c/span>×\u003c/div>\n      \u003cp class=\"meta\" data-fade>ROLE — HEAD OF SPONSORSHIP DOMAIN\u003cbr>WINDOW — OCT 2025 → MAR 2026\u003cbr>RESULT — 5× GROWTH IN THE SPONSORSHIP VERTICAL\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"cs-right\">\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">01 / PROBLEM\u003c/span>\n        \u003cdiv>\u003ch4>Prospect conversion \u003cspan>was the broken step.\u003c/span>\u003c/h4>\n        \u003cp>On paper the workflow was straightforward: identify prospects, assign them to team members, make calls, send emails, follow up, close the sponsorship, and hand the agreed deliverables to the event teams. We tracked prospects and follow-ups in Google Sheets and reviewed progress in weekly meetings. But conversion stayed flat — we were sending everyone the same generic pitch: \u003cstrong>\"we are organising an entrepreneurship summit; would you like to sponsor us?\"\u003c/strong> Team members could make the calls and send the emails quickly, but the company had little reason to respond. We were optimising for \u003cstrong>the number of companies contacted\u003c/strong> rather than whether the company had a specific reason to participate.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">02 / THE FIX\u003c/span>\n        \u003cdiv>\u003ch4>Research before \u003cspan>outreach.\u003c/span>\u003c/h4>\n        \u003cp>I changed the workflow so that \u003cstrong>prospect research became part of the process\u003c/strong>, before anyone reached out. Instead of one pitch for everyone, we identified something specific about each company that could connect to our student audience. Approaching \u003cstrong>a major consumer brand\u003c/strong>, we tied \u003cstrong>a seasonal campaign it was already running\u003c/strong> to our student audience and positioned E-Summit as a campus opportunity to activate that campaign. We used similar company-specific approaches for other prospects. At the same time we split specialised outreach across the team — some members handled \u003cstrong>banks and PSUs through offline outreach\u003c/strong>, while others focused on \u003cstrong>gaming partnerships\u003c/strong>.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">03 / SECOND FAILURE\u003c/span>\n        \u003cdiv>\u003ch4>The workflow broke again \u003cspan>after the close.\u003c/span>\u003c/h4>\n        \u003cp>A second problem appeared once sponsors signed on. On event day the workflow became error-prone: each sponsor could have multiple commitments — \u003cstrong>branding, activations, placements\u003c/strong> and other agreed benefits — and \u003cstrong>missing one could delay or affect the final payment\u003c/strong>. Fulfilment required coordination across different event teams, so the sponsorship vertical had to track what had been promised and whether each item had actually been delivered.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">04 / CONSTRAINT\u003c/span>\n        \u003cdiv>\u003ch4>March is \u003cspan>the wrong month.\u003c/span>\u003c/h4>\n        \u003cp>There was also a constraint we could not fully work around: \u003cstrong>E-Summit happens in March, close to the end of the financial year\u003c/strong>. Some companies were already closing their budgets and sponsorship decisions, which meant that \u003cstrong>even interested companies sometimes could not complete the process within our timeline\u003c/strong>. We couldn't remove the constraint — but knowing it let us prioritise the prospects who could still move in time.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cdiv class=\"cs-chapter\" data-fade>\u003cspan class=\"cs-num mono\">05 / OUTCOME\u003c/span>\n        \u003cdiv>\u003ch4>Same team, \u003cspan>different shape of work.\u003c/span>\u003c/h4>\n        \u003cp>If I were fixing the workflow from scratch, I would fix \u003cstrong>prospect qualification and personalisation first\u003c/strong>. Increasing outreach volume would only have made the first problem larger — more generic pitches to companies with no clear reason to respond. Once we changed how we selected and approached prospects, conversion improved \u003cstrong>without simply increasing the number of calls and emails\u003c/strong>. The overall sponsorship vertical grew \u003cstrong>5×\u003c/strong> compared with the previous edition.\u003c/p>\u003c/div>\u003c/div>\n\n      \u003cblockquote class=\"cs-quote\" data-fade>\"More outreach volume would only have \u003cb>made the first problem larger.\u003c/b>\"\u003c/blockquote>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection id=\"experience\">\n  \u003cspan class=\"sec-ghost\">06\u003c/span>\n  \u003cdiv class=\"sec-head\">\u003cspan class=\"sec-idx mono\">06\u003c/span>\u003cspan class=\"sec-rule\">\u003c/span>\u003cspan class=\"sec-label mono\">EXPERIENCE\u003c/span>\u003c/div>\n  \u003cp class=\"kicker mono\" data-fade>\u003cb>/\u003c/b> REVERSE CHRONOLOGICAL, AFTER THE DEGREE — WHERE I'VE PUT IN THE REPS.\u003c/p>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">2023 — 2027\u003c/span>\u003cspan class=\"xp-tag mono\">EDUCATION\u003c/span>\n      \u003ch4 class=\"xp-role\">B.Tech — Computer Science &amp; Biosciences\u003c/h4>\u003cspan class=\"xp-org mono\">IIIT-DELHI · CS MAJOR / COMP BIO MINOR\u003c/span>\u003c/div>\n    \u003cp class=\"xp-desc\">A Computer Science major with a Computational Biology minor. Relevant coursework: \u003cstrong>Data Structures & Algorithms, Advanced Programming, Operating Systems, Computer Organisation, Database Management Systems, Collaborative Filtering\u003c/strong>.\u003c/p>\n  \u003c/article>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">OCT 2025 — MAR 2026\u003c/span>\u003cspan class=\"xp-tag mono\">LEADERSHIP · IMPACT\u003c/span>\n      \u003ch4 class=\"xp-role\">Head of Sponsorship Domain\u003c/h4>\u003cspan class=\"xp-org mono\">IIIT-DELHI E-SUMMIT 2026\u003c/span>\u003c/div>\n    \u003cp class=\"xp-desc\">Owned the sponsorship workflow end-to-end — prospecting, outreach, closing, and delivering promised benefits — and led a cross-functional team across sponsorship, marketing, and operations. The first broken step was \u003cstrong>prospect conversion\u003c/strong>: a single generic pitch sent to every company. I rebuilt the workflow so \u003cstrong>prospect research happened before outreach\u003c/strong>, with company-specific positioning (tying Swiggy's Boyfriend's/Single's Day campaign to our student audience) and specialised outreach tracks for banks, PSUs, and gaming partnerships. Grew the sponsorship vertical \u003cstrong>5×\u003c/strong> over the previous edition.\u003c/p>\n  \u003c/article>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">AUG 2025 — PRESENT\u003c/span>\u003cspan class=\"xp-tag mono\">CONTENT\u003c/span>\n      \u003ch4 class=\"xp-role\">Member, Media Service Committee\u003c/h4>\u003cspan class=\"xp-org mono\">IIIT-DELHI\u003c/span>\u003c/div>\n    \u003cp class=\"xp-desc\">Event coverage, promo content, and \u003cstrong>visual storytelling\u003c/strong> for institute initiatives — turning what happened into something people actually wanted to watch.\u003c/p>\n  \u003c/article>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">APR 2025 — AUG 2025\u003c/span>\u003cspan class=\"xp-tag mono\">DELIVERY\u003c/span>\n      \u003ch4 class=\"xp-role\">General Secretary\u003c/h4>\u003cspan class=\"xp-org mono\">ESYA 2025 · IIIT-DELHI ANNUAL TECH FEST\u003c/span>\u003c/div>\n    \u003cp class=\"xp-desc\">General Secretary for IIIT-Delhi's annual tech fest. Worked across \u003cstrong>technical, content, and operations domains\u003c/strong> to ship the event end-to-end — coordinating cross-functional teams and institute stakeholders against a fixed launch date.\u003c/p>\n  \u003c/article>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">AUG 2024 — JUL 2025\u003c/span>\u003cspan class=\"xp-tag mono\">COMMUNITY\u003c/span>\n      \u003ch4 class=\"xp-role\">Coordinator\u003c/h4>\u003cspan class=\"xp-org mono\">IEEE-IIIT DELHI STUDENT BRANCH\u003c/span>\u003c/div>\n    \u003cp class=\"xp-desc\">Ran technical sessions, events, and institute-level outreach with the core IEEE team — \u003cstrong>logistics, speakers, and attendee experience\u003c/strong>.\u003c/p>\n  \u003c/article>\n\n  \u003carticle class=\"xp\" data-fade>\n    \u003cdiv class=\"xp-top\">\u003cspan class=\"xp-date mono\">2025\u003c/span>\u003cspan class=\"xp-tag mono\">AWARD\u003c/span>\n      \u003ch4 ibs/gsap/3.12.5/gsap.min.js\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js\">\u003c/script>\n\u003cscript src=\"https://unpkg.com/lenis@1.1.14/dist/lenis.min.js\">\u003c/script>\n\n\u003cscript>\n(function(){\n\"use strict\";\n\nconst isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;\nconst reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst hasGSAP = !!window.gsap;\nconst hasST   = !!(window.gsap && window.ScrollTrigger);\nconst clamp   = (v,a,b)=>Math.min(b,Math.max(a,v));\n\nconsole.log(\"%c YUVRAJ VERMA // PIXEL-BLUEPRINT BUILD — view source, it's all readable. \",\n  \"background:#00E5FF;color:#04060a;padding:4px 8px;font-family:monospace;font-weight:bold\");\n\nlet lenis = null;\n\n/* ============================================================\n   ★  BACKGROUND GRID — seamless parallax scroll\n   ============================================================ */\n(function gridScroll(){\n  const grid = document.getElementById('bgGrid');\n  if(!grid) return;\n\n  const SIZE  = 64;   /* must match --grid-size in CSS */\n  const SPEED = 0.35; /* 0.2 subtle · 1 = locks to page scroll */\n  let lastY = -1;\n\n  function frame(){\n    const y = window.pageYOffset || document.documentElement.scrollTop || 0;\n    if(y !== lastY){\n      lastY = y;\n      /* mod by SIZE → seamless loop, tiny numbers → GPU-friendly */\n      const off = (y * SPEED) % SIZE;\n      grid.style.setProperty('--off', off.toFixed(2) + 'px');\n    }\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n})();\n\n/* ================= MARQUEES ================= */\nconst mq1 = ['5× SPONSORSHIP REVENUE','4 USER ROLES · 8+ FEATURES','NDCG@10 +3.2%','HR@10 = 0.80','ASYNC JUDGE · 3 LANGUAGES','SPRING BOOT · RABBITMQ · DOCKER','LIGHTGCN · SBERT · PYTORCH'];\nconst mq2 = ['OPEN TO SWEAI / PRODUCT ROLES — 2026','PYTHON · JAVA · C++ · SQL','DELHI ↔ ANYWHERE','EMAIL IS THE FASTEST WAY',\"IIIT-DELHI · CS '27\"];\nfunction fillMq(el, words){\n  if(!el) return;\n  let h = '';\n  for(let r = 0; r \u003c 6; r++) words.forEach(w => { h += '\u003cspan>' + w + '\u003c/span>\u003cspan class=\"x\">·\u003c/span>'; });\n  el.innerHTML = h;\n}\nfillMq(document.getElementById('mq1'), mq1);\nfillMq(document.getElementById('mq2'), mq2);\n\n/* ================= CLOCK ================= */\nfunction tick(){\n  try{\n    const s = new Intl.DateTimeFormat('en-GB', {\n      timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false\n    }).format(new Date());\n    document.querySelectorAll('.ist-clock').forEach(e => e.textContent = 'DELHI — ' + s + ' IST');\n  }catch(e){}\n}\ntick(); setInterval(tick, 1000);\n\n/* ================= SCROLL ================= */\nif(hasST){\n  gsap.registerPlugin(ScrollTrigger);\n\n  if(!reduced && window.Lenis){\n    lenis = new Lenis({\n      duration: 1.15,\n      easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),\n      smoothWheel: true, wheelMultiplier: 1, touchMultiplier: 1.5,\n      syncTouch: false, gestureOrientation: 'vertical', autoResize: true\n    });\n    lenis.on('scroll', ScrollTrigger.update);\n    gsap.ticker.add(t => lenis.raf(t * 1000));\n    gsap.ticker.lagSmoothing(0);\n    window.addEventListener('resize', () => lenis && lenis.resize(), { passive: true });\n  }\n\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', e => {\n      const id = a.getAttribute('href');\n      if(!id || id.length \u003c 2) return;\n      const t = document.querySelector(id);\n      if(!t) return;\n      e.preventDefault();\n      closeMenu();\n      const offset = -10;\n      if(lenis) lenis.scrollTo(t, { offset, duration: 1.4 });\n      else window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY + offset, behavior: 'smooth' });\n    });\n  });\n\n  ScrollTrigger.create({\n    start: 0, end: 'max',\n    onUpdate: s => {\n      const p = document.getElementById('progress');\n      if(p) p.style.transform = 'scaleX(' + s.progress + ')';\n    }\n  });\n\n  const navEl = document.getElementById('nav');\n  window.addEventListener('scroll', () => {\n    if(navEl) navEl.classList.toggle('scrolled', window.scrollY > 60);\n  }, { passive: true });\n\n  document.querySelectorAll('[data-lines]').forEach(el => {\n    gsap.to(el.querySelectorAll('.lni'), {\n      y: 0, duration: 1.1, ease: 'power4.out', stagger: 0.09,\n      scrollTrigger: { trigger: el, start: 'top 86%' }\n    });\n  });\n  document.querySelectorAll('[data-fade]').forEach(el => {\n    gsap.to(el, {\n      opacity: 1, y: 0, duration: 1, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 88%' }\n    });\n  });\n  document.querySelectorAll('.xp,.cs-chapter,.work,.proc,.tk-card').forEach(el => {\n    gsap.fromTo(el, { y: 44, opacity: 0 }, {\n      y: 0, opacity: 1, duration: 0.95, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 90%' }\n    });\n  });\n  document.querySelectorAll('[data-count]').forEach(el => {\n    const target = parseFloat(el.dataset.count),\n          pad = parseInt(el.dataset.pad || '0'),\n          dec = parseInt(el.dataset.dec || '0'),\n          o = { v: 0 };\n    gsap.to(o, {\n      v: target, duration: 1.8, ease: 'power3.out',\n      scrollTrigger: { trigger: el, start: 'top 92%' },\n      onUpdate(){\n        let s;\n        if(dec > 0) s = o.v.toFixed(dec);\n        else s = String(Math.round(o.v));\n        if(pad && dec === 0) s = s.padStart(pad, '0');\n        el.textContent = s;\n      }\n    });\n  });\n} else {\n  document.documentElement.classList.remove('js');\n}\n\n/* ================= LOADER + INTRO ================= */\nif(hasST){\n  const intro = gsap.timeline({ paused: true });\n  intro.to('.nav', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0)\n    .to('.hero-title .lni', { y: 0, duration: 1.25, ease: 'power4.out', stagger: 0.11 }, 0.1)\n    .to('.hero-topline', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.5)\n    .to('.avail', { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.55)\n    .to('.hero-sub', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.7)\n    .to('.hero-cta', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.8)\n    .to('.stats', { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 0.9);\n\n  const loader = document.getElementById('loader');\n  const logEl = document.getElementById('loadLog');\n  if(reduced){\n    if(loader) loader.style.display = 'none';\n    gsap.set('.nav', { opacity: 1, y: 0 });\n    gsap.set('.hero-title .lni', { y: 0 });\n    gsap.set(['.hero-topline','.avail','.hero-sub','.hero-cta','.stats'], { opacity: 1, y: 0 });\n    gsap.set('[data-fade],[data-lines] .lni', { opacity: 1, y: 0 });\n  } else {\n    const num = document.getElementById('loadNum'),\n          bar = document.getElementById('loadBar'),\n          o = { v: 0 };\n    gsap.to(o, {\n      v: 100, duration: 1.6, ease: 'power2.inOut', delay: 0.2,\n      onUpdate(){\n        if(num) num.textContent = Math.round(o.v);\n        if(bar) bar.style.transform = 'scaleX(' + (o.v / 100) + ')';\n      },\n      onComplete(){\n        gsap.to('#loader', {\n          yPercent: -100, duration: 0.9, ease: 'power4.inOut', delay: 0.15,\n          onComplete(){ if(loader) loader.style.display = 'none'; }\n        });\n        intro.play();\n      }\n    });\n  }\n  window.addEventListener('load', () => {\n    ScrollTrigger.refresh();\n    if(window.gsap && document.fonts && document.fonts.ready){\n      document.fonts.ready.then(() => ScrollTrigger.refresh());\n    }\n  });\n} else {\n  const loader = document.getElementById('loader');\n  if(loader) loader.style.display = 'none';\n}\n\n/* ================= MENU ================= */\nconst menu = document.getElementById('menu');\nconst burger = document.getElementById('burger');\nlet menuOpen = false;\n\nfunction openMenu(){\n  if(menuOpen) return;\n  menuOpen = true;\n  menu.classList.add('open');\n  menu.setAttribute('aria-hidden', 'false');\n  burger.classList.add('open');\n  burger.setAttribute('aria-expanded', 'true');\n  document.documentElement.classList.add('lock');\n  if(lenis) lenis.stop();\n}\nfunction closeMenu(){\n  if(!menuOpen) return;\n  menuOpen = false;\n  menu.classList.remove('open');\n  menu.setAttribute('aria-hidden', 'true');\n  burger.classList.remove('open');\n  burger.setAttribute('aria-expanded', 'false');\n  document.documentElement.classList.remove('lock');\n  if(lenis) lenis.start();\n}\nif(burger) burger.addEventListener('click', () => menuOpen ? closeMenu() : openMenu());\nwindow.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });\nwindow.addEventListener('resize', () => { if(window.innerWidth > 1024 && menuOpen) closeMenu(); });\n\n/* ================= SIDE NAV ================= */\n(function(){\n  const items = [].slice.call(document.querySelectorAll('.sn-item'));\n  const sections = [].slice.call(document.querySelectorAll('main section[id]'));\n  if(!items.length || !sections.length) return;\n\n  function setActive(id){\n    items.forEach(a => a.classList.toggle('active', a.dataset.sn === id));\n  }\n\n  if('IntersectionObserver' in window){\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(en => { if(en.isIntersecting) setActive(en.target.id); });\n    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });\n    sections.forEach(s => io.observe(s));\n  } else {\n    window.addEventListener('scroll', () => {\n      let current = sections[0].id;\n      const y = window.scrollY + window.innerHeight * 0.35;\n      sections.forEach(s => { if(s.offsetTop \u003c= y) current = s.id; });\n      setActive(current);\n    }, { passive: true });\n  }\n})();\n\n/* ================= CURSOR ================= */\nif(!isTouch && !reduced){\n  document.documentElement.classList.add('has-cursor');\n  const dot = document.getElementById('cDot'),\n        ring = document.getElementById('cRing'),\n        label = document.getElementById('cLabel');\n  let mx = window.innerWidth / 2, my = window.innerHeight / 2;\n  let rx = mx, ry = my;\n\n  window.addEventListener('mousemove', e => {\n    mx = e.clientX; my = e.clientY;\n    dot.style.left = mx + 'px';\n    dot.style.top = my + 'px';\n  }, { passive: true });\n\n  (function rl(){\n    rx += (mx - rx) * 0.16;\n    ry += (my - ry) * 0.16;\n    ring.style.left = rx + 'px';\n    ring.style.top = ry + 'px';\n    requestAnimationFrame(rl);\n  })();\n\n  document.addEventListener('mouseover', e => {\n    const lab = e.target.closest('[data-cursor]');\n    const hov = e.target.closest('a,button,.chip,.tk-item');\n    if(lab){\n      ring.classList.add('is-label');\n      ring.classList.remove('is-hover');\n      label.textContent = lab.dataset.cursor;\n    } else if(hov){\n      ring.classList.add('is-hover');\n      ring.classList.remove('is-label');\n    } else {\n      ring.classList.remove('is-hover', 'is-label');\n    }\n  });\n}\n\n/* ================= MAGNETIC ================= */\nif(!isTouch && !reduced && hasGSAP){\n  document.querySelectorAll('.magnetic').forEach(el => {\n    el.addEventListener('mousemove', e => {\n      const r = el.getBoundingClientRect();\n      gsap.to(el, {\n        x: (e.clientX - r.left - r.width/2) * 0.28,\n        y: (e.clientY - r.top - r.height/2) * 0.28,\n        duration: 0.4, ease: 'power3.out'\n      });\n    });\n    el.addEventListener('mouseleave', () => {\n      gsap.to(el, { x: 0, y: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });\n    });\n  });\n}\n\n/* ================= WORK PREVIEW ================= */\nif(!isTouch && !reduced && hasGSAP){\n  const pv = document.getElementById('pv');\n  if(pv){\n    const slides = pv.querySelectorAll('.pv-slide');\n    let shown = false;\n    const px = gsap.quickTo(pv, 'x', { duration: 0.55, ease: 'power3' });\n    const py = gsap.quickTo(pv, 'y', { duration: 0.55, ease: 'power3' });\n    gsap.set(pv, { scale: 0.92, opacity: 0, transformOrigin: 'center' });\n\n    document.querySelectorAll('.work[data-project]').forEach(row => {\n      row.addEventListener('mouseenter', e => {\n        slides.forEach(s => s.classList.remove('active'));\n        const s = slides[+row.dataset.project];\n        if(s) s.classList.add('active');\n        if(!shown){\n          shown = true;\n          gsap.set(pv, { x: e.clientX + 30, y: e.clientY - 120 });\n          gsap.to(pv, { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' });\n        }\n      });\n      row.addEventListener('mousemove', e => {\n        px(e.clientX + 30);\n        py(e.clientY - 120);\n        gsap.to(pv, { rotation: clamp((e.movementX || 0) * 0.12, -5, 5), duration: 0.4 });\n      });\n      row.addEventListener('mouseleave', () => {\n        shown = false;\n        gsap.to(pv, { opacity: 0, scale: 0.92, rotation: 0, duration: 0.35, ease: 'power3.in' });\n      });\n    });\n  }\n}\n\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"</script>
<script type="application/json" id="doc-max">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cscript>/* injected by merge_portfolio.py */\n(function(){\n  try{var rs=history.replaceState;history.replaceState=function(){try{return rs.apply(history,arguments);}catch(e){}};}catch(e){}\n  /* in-page links (#about, or a bare #) must scroll this design, never navigate the frame */\n  addEventListener('click',function(e){\n    if(e.defaultPrevented)return;\n    var a=e.target&&e.target.closest?e.target.closest('a[href^=\"#\"]'):null;\n    if(!a)return;\n    e.preventDefault();\n    var h=a.getAttribute('href'),t=null;\n    if(h.length>1){try{t=document.getElementById(decodeURIComponent(h.slice(1)));}catch(_){}}\n    if(t)t.scrollIntoView();else scrollTo(0,0);\n  });\n  /* relay the 1/2/3 shortcuts to the outer page */\n  addEventListener('keydown',function(e){\n    if(parent===window||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey)return;\n    var t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;\n    if(e.key==='1'||e.key==='2'||e.key==='3')parent.postMessage({__portfolioSwitch:true,key:e.key},'*');\n  });\n})();\n\u003c/script>\n\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Yuvraj Verma — SWEAI / Product Engineer\u003c/title>\n\u003cmeta name=\"description\" content=\"Yuvraj Verma — Computer Science at IIIT-Delhi. Distributed systems, ML, and the code that ties it together. Open to SWEAI / Product roles, 2026.\">\n\u003clink rel=\"icon\" href=\"data:image/svg+xml,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>\u003crect width='100' height='100' fill='%23c9f421'/>\u003ctext x='50' y='72' font-size='62' font-family='Arial Black' text-anchor='middle' fill='%230a0a0e'>YV\u003c/text>\u003c/svg>\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cscript>document.documentElement.classList.add('js');\u003c/script>\n\n\u003cstyle>\n/* ============================================================\n   YUVRAJ VERMA — VOL.03\n   NFS UNBOUND ENERGY × SPOTIFY WRAPPED STORYTELLING\n   ============================================================ */\n\n:root{\n  --ink:#0a0a0e;\n  --ink-2:#12121a;\n  --ink-3:#1a1a26;\n  --paper:#f5f4ef;\n  --white:#ffffff;\n  --blue:#2745ff;\n  --cyan:#16e0ff;\n  --lime:#c9f421;\n  --pink:#ff2d7e;\n  --orange:#ff5a1f;\n  --yellow:#ffd21f;\n  --violet:#8a5cff;\n  --red:#ff3524;\n  --font-display:'Anton', Impact, sans-serif;\n  --font-body:'Space Grotesk', sans-serif;\n  --font-serif:'Instrument Serif', Georgia, serif;\n  --font-mono:'JetBrains Mono', monospace;\n  --page-pad:clamp(1rem, 4vw, 4rem);\n  --content-max:1560px;\n  --ease:cubic-bezier(.16,1,.3,1);\n  --bd:3px solid var(--ink);\n  --focus:var(--pink);\n}\n\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\nhtml{scroll-padding-top:88px;}\nhtml,body{overflow-x:clip;}\nbody{\n  background:var(--ink);color:var(--paper);\n  font-family:var(--font-body);font-size:1rem;line-height:1.55;\n  -webkit-font-smoothing:antialiased;\n}\nimg,svg{max-width:100%;display:block;}\na{color:inherit;text-decoration:none;}\nul,ol{list-style:none;}\nbutton{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}\n::selection{background:var(--pink);color:#fff;}\n:focus-visible{outline:3px dashed var(--focus);outline-offset:4px;}\n::-webkit-scrollbar{width:11px;}\n::-webkit-scrollbar-track{background:var(--ink);}\n::-webkit-scrollbar-thumb{background:var(--lime);border:3px solid var(--ink);}\n\n.skip{position:fixed;top:-100px;left:1rem;z-index:400;background:var(--lime);color:var(--ink);\n  font-weight:700;padding:.7rem 1.2rem;border:var(--bd);transition:top .2s;}\n.skip:focus{top:1rem;}\n\n/* ---------- TYPE ---------- */\n.d1{font-family:var(--font-display);text-transform:uppercase;line-height:.88;letter-spacing:.01em;text-wrap:balance;}\n.serif{font-family:var(--font-serif);font-style:italic;text-transform:none;letter-spacing:0;}\n.mono{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;}\n.wrap{width:min(var(--content-max), 100% - 2*var(--page-pad));margin-inline:auto;}\n\n/* ---------- DECOR ---------- */\n.sticker{\n  display:inline-flex;align-items:center;gap:.5rem;\n  font-family:var(--font-mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n  border:var(--bd);padding:.42rem .8rem;background:var(--paper);color:var(--ink);\n  box-shadow:4px 4px 0 var(--ink);transform:rotate(var(--r,-2deg));\n}\n.st-lime{background:var(--lime);} .st-pink{background:var(--pink);color:#fff;}\n.st-cyan{background:var(--cyan);} .st-yellow{background:var(--yellow);}\n.st-ink{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 rgba(0,0,0,.35);}\n.ghost-num{\n  position:absolute;z-index:0;pointer-events:none;user-select:none;\n  font-family:var(--font-display);line-height:.8;\n  color:transparent;-webkit-text-stroke:2px currentColor;opacity:.14;\n}\n\n/* ---------- BUTTONS ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:.7rem;\n  font-family:var(--font-display);text-transform:uppercase;\n  font-size:clamp(.95rem,1.4vw,1.15rem);letter-spacing:.04em;\n  padding:.8rem 1.4rem;border:var(--bd);background:var(--paper);color:var(--ink);\n  box-shadow:6px 6px 0 var(--shc,#000);\n  transition:transform .18s var(--ease), box-shadow .18s var(--ease), background .18s;\n  will-change:transform;\n}\n.btn:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--shc,#000);}\n.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shc,#000);}\n.btn .ar{transition:transform .18s var(--ease);}\n.btn:hover .ar{transform:translate(3px,-3px);}\n.btn-lime{background:var(--lime);}\n.btn-ink{background:var(--ink);color:var(--paper);}\n.btn-ghost{background:transparent;color:inherit;}\n\n/* ---------- PROGRESS + CURSOR ---------- */\n#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:350;\n  background:linear-gradient(90deg,var(--cyan),var(--pink),var(--orange),var(--lime));}\n#curDot,#curRing{position:fixed;top:0;left:0;pointer-events:none;z-index:380;border-radius:50%;display:none;}\nhtml.cursor-on #curDot,html.cursor-on #curRing{display:block;}\nhtml.cursor-on,html.cursor-on a,html.cursor-on button{cursor:none;}\n#curDot{width:9px;height:9px;background:var(--lime);mix-blend-mode:difference;transform:translate(-50%,-50%);}\n#curRing{width:38px;height:38px;border:2px solid var(--lime);mix-blend-mode:difference;\n  transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s;}\n#curRing.big{width:64px;height:64px;border-color:var(--pink);}\n\n/* ---------- NAV ---------- */\n.nav{\n  position:fixed;top:0;left:0;right:0;z-index:300;\n  display:flex;align-items:center;justify-content:space-between;gap:1rem;\n  padding:.75rem var(--page-pad);\n  background:rgba(10,10,14,.86);backdrop-filter:blur(8px);\n  border-bottom:3px solid var(--ink-3);\n}\n.nav-logo{display:flex;align-items:baseline;gap:.4rem;font-family:var(--font-display);\n  font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;}\n.nav-logo .reg{color:var(--lime);font-size:.8em;}\n.nav-links{display:flex;gap:1.1rem;}\n.nav-link{\n  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;\n  color:var(--paper);opacity:.72;padding:.35rem .15rem;border-bottom:2px solid transparent;\n  transition:opacity .15s, border-color .15s, color .15s;\n}\n.nav-link i{font-style:normal;color:var(--lime);margin-right:.3rem;}\n.nav-link:hover,.nav-link.active{opacity:1;border-color:var(--pink);color:#fff;}\n.nav-right{display:flex;align-items:center;gap:1rem;}\n.clockchip{display:flex;align-items:center;gap:.55rem;font-family:var(--font-mono);\n  font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--paper);opacity:.85;}\n.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:blink 1.6s infinite;}\n@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}\n.burger{display:flex;flex-direction:column;gap:5px;padding:.6rem;border:2px solid var(--paper);}\n.burger span{width:24px;height:3px;background:var(--paper);transition:transform .25s var(--ease), opacity .2s;}\nbody.menu-open .burger span:nth-child(1){transform:translateY(8px) rotate(45deg);background:var(--lime);}\nbody.menu-open .burger span:nth-child(2){opacity:0;}\nbody.menu-open .burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg);background:var(--lime);}\n@media (max-width:1120px){.nav-links{display:none;}}\n@media (max-width:640px){.clockchip .clk-label{display:none;}}\n\n/* ---------- MENU ---------- */\n.menu{\n  position:fixed;inset:0;z-index:290;background:var(--ink);\n  transform:translateY(-102%);transition:transform .55s var(--ease);\n  display:flex;flex-direction:column;padding:5.5rem var(--page-pad) 1.6rem;overflow-y:auto;\n}\nbody.menu-open .menu{transform:translateY(0);}\nbody.menu-open{overflow:hidden;}\n.menu-list{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.1rem;}\n.menu-link{\n  display:flex;align-items:baseline;gap:1.2rem;\n  font-family:var(--font-display);text-transform:uppercase;\n  font-size:clamp(1.9rem,6vw,4.2rem);line-height:1.08;\n  border-bottom:2px solid var(--ink-3);padding:.3rem 0;\n  transition:color .15s, padding-left .25s var(--ease);\n}\n.menu-link i{font-style:normal;font-family:var(--font-mono);font-size:.8rem;color:var(--lime);min-width:2.2rem;}\n.menu-link:hover{padding-left:1.2rem;}\n.menu-link:nth-child(1):hover{color:var(--lime);}\n.menu-link:nth-child(2):hover{color:var(--violet);}\n.menu-link:nth-child(3):
