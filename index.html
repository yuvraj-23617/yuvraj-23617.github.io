d{border-bottom:3px double var(--rule);}\n.ledger td{padding:.85rem .5rem;vertical-align:top;font-size:.9rem;line-height:1.5;}\n.ledger .l-date{\n  font-family:var(--wire);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;\n  white-space:nowrap;width:9.5rem;color:var(--ink);\n}\n.ledger .l-date em{\n  display:block;font-style:normal;font-family:var(--wire);font-size:.52rem;\n  letter-spacing:.16em;color:var(--paper);background:var(--ink);\n  width:max-content;padding:.15rem .4rem;margin-top:.35rem;\n}\n.ledger .l-role{font-family:var(--display);font-weight:700;font-size:1rem;}\n.ledger .l-org{\n  font-family:var(--wire);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;\n  color:var(--ink-soft);display:block;margin:.15rem 0 .35rem;\n}\n\n/* ------------------------------------------------------------------\n   PAGE 06 — OPINION\n   ------------------------------------------------------------------ */\n.opinion{background:var(--paper-card);}\n.op-ed{\n  max-width:60rem;margin:0 auto;\n  display:grid;grid-template-columns:minmax(0,1.6fr) minmax(200px,.8fr);\n  gap:clamp(1.6rem,3.4vw,3rem);\n}\n.op-ed-body p{margin-bottom:1rem;text-align:justify;hyphens:auto;}\n.op-ed-body .lede{\n  font-family:var(--display);font-style:italic;font-weight:600;\n  font-size:1.15rem;line-height:1.5;color:var(--ink);\n  border-bottom:1px solid var(--rule);padding-bottom:1rem;margin-bottom:1.2rem;\n  text-align:left;\n}\n.moves{border-top:1px solid var(--rule);margin-top:.4rem;}\n.move{\n  padding:1rem 0 1.1rem;border-bottom:1px solid var(--rule-soft);\n}\n.move:last-child{border-bottom:none;}\n.move .no{\n  font-family:var(--wire);font-size:.56rem;font-weight:600;letter-spacing:.2em;\n  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:.3rem;\n}\n.move h4{\n  font-family:var(--display);font-weight:800;font-size:1.25rem;text-transform:uppercase;\n  letter-spacing:.02em;margin-bottom:.45rem;\n}\n.move p{font-size:.93rem;text-align:justify;hyphens:auto;}\n\n.op-rail{border-left:1px solid var(--rule-soft);padding-left:clamp(1rem,2vw,1.6rem);}\n.op-rail .box{border:1px solid var(--rule);background:var(--paper);padding:1rem;margin-bottom:1.2rem;}\n.op-rail .box h5{\n  font-family:var(--wire);font-size:.56rem;font-weight:600;letter-spacing:.2em;\n  text-transform:uppercase;border-bottom:1px solid var(--rule);\n  padding-bottom:.45rem;margin-bottom:.6rem;\n}\n.op-rail .box p{font-size:.86rem;font-style:italic;line-height:1.55;}\n.op-rail .sig{\n  font-family:var(--display);font-style:italic;font-weight:700;font-size:1.3rem;\n  text-align:right;display:block;margin-top:.6rem;\n}\n\n/* ------------------------------------------------------------------\n   PAGE 07 — EXCHANGE & CLASSIFIEDS\n   ------------------------------------------------------------------ */\n.class-notices{\n  display:grid;\n  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);\n  gap:1.2rem;align-items:start;\n}\n\n.class-ad{\n  border:1px solid var(--rule);\n  padding:1.05rem 1.15rem 1.1rem;\n  background:var(--paper-card);\n}\n.class-ad--solid{background:var(--ink);color:var(--paper);}\n.class-ad--solid .class-title{color:var(--paper);}\n.class-ad h4.class-title{\n  font-family:var(--display);font-weight:800;font-size:1.02rem;text-transform:uppercase;\n  letter-spacing:.06em;text-align:center;\n  border-bottom:1px solid currentColor;padding-bottom:.45rem;margin-bottom:.7rem;\n}\n.class-ad p{font-size:.95rem;line-height:1.65;}\n.class-ad p+p{margin-top:.6rem;}\n.class-ad .ref{\n  font-family:var(--wire);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;\n  display:block;margin-top:.7rem;opacity:.75;\n}\n\n/* Correspondence rows */\n.correspond-row{\n  display:flex;justify-content:space-between;align-items:baseline;gap:.9rem;\n  padding:.6rem 0;border-bottom:1px dotted var(--rule-soft);font-size:.92rem;\n}\n.correspond-row:last-child{border-bottom:none;padding-bottom:0;}\n.correspond-row:first-child{padding-top:0;}\n.corresp
