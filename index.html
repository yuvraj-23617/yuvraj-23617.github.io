        function renderScores() {
          ["X", "D", "O"].forEach(function (k) {
            scoreEls[k].n.textContent = scores[k];
            scoreEls[k].box.classList.toggle("is-turn", !over && k === turn);
          });
        }

        function resetGame() {
          clearTimeout(timer);
          board = ["", "", "", "", "", "", "", "", ""];
          turn = "X";
          over = false;
          cells.forEach(function (c, i) {
            c.innerHTML = "";
            c.removeAttribute("data-m");
            c.disabled = false;
            c.classList.remove("is-win", "mark-in");
            label(i, "");
          });
          strike.classList.remove("is-on");
          winEl.classList.remove("is-shown");
          boardEl.classList.remove("is-wait");
          setStatus("Your turn");
          renderScores();
        }

        function winnerLine(b) {
          for (var i = 0; i < LINES.length; i++) {
            var L = LINES[i];
            if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) return L;
          }
          return null;
        }
        function isFull(b) { return b.every(function (v) { return v !== ""; }); }

        function place(i, mark) {
          board[i] = mark;
          var c = cells[i];
          c.innerHTML = MARKS[mark];
          c.setAttribute("data-m", mark);
          c.disabled = true;
          label(i, mark);
          c.classList.remove("mark-in");
          void c.offsetWidth;
          c.classList.add("mark-in");
        }

        function drawStrike(L) {
          function pt(i) { return [(i % 3) * 33.33 + 16.67, Math.floor(i / 3) * 33.33 + 16.67]; }
          var a = pt(L[0]), b = pt(L[2]);
          strikeLine.setAttribute("x1", a[0]); strikeLine.setAttribute("y1", a[1]);
          strikeLine.setAttribute("x2", b[0]); strikeLine.setAttribute("y2", b[1]);

          if (reduced() || !confetti) return;
          var colors = ["#c9f421", "#ff2d7e", "#16e0ff", "#ffd21f", "#f5f4ef"], html = "";

            html += '<i style="--x:' + Math.round((Math.random() - 0.5) * 300) + "px;--y:" +

              colors[i % colors.length] + '"></i>';

          var L = winnerLine(board);

            over = true;
            L.forEach(function (i) { cells[i].classList.add("is-win"); });
            cells.forEach(function (c) { c.disabled = true; });
            drawStrike(L);
            if (board[L[0]] === "X") {
              scores.X++; dryStreak = 0;

                winEl.classList.add("is-shown");

        function score(b, mark, d) {

          for (var i = 0; i < 9; i++) {
            if (b[i]) continue;

          }
          return best === null ? 0 : best;
        }

        function pickMove() {
          var empties = [], top = -99, best = [];
          for (var i = 0; i < 9; i++) if (!board[i]) empties.push(i);
          var slip = Math.min(0.6, 0.22 + dryStreak * 0.12);
          if (Math.random() < slip) return empties[Math.floor(Math.random() * empties.length)];
          empties.forEach(function (i) {
            board[i] = "O";
            var s = score(board, "X", 1);
            board[i] = "";
            if (s > top) { top = s; best = [i]; } else if (s === top) best.push(i);
          });
          return best[Math.floor(Math.random() * best.length)];
        }

        function aiMove() {
          if (over) return;
          place(pickMove(), "O");
          boardEl.classList.remove("is-wait");
          if (checkEnd()) return;
          turn = "X";
          setStatus("Your turn");
          renderScores();
          var first = cells.filter(function (c) { return !c.disabled; })[0];
          if (first && boardEl.contains(document.activeElement) === false && game.classList.contains("is-playing")) {
            /* focus was on the cell just played (now disabled), so hand it to a free one */
            first.focus({ preventScroll: true });
          }
        }

        boardEl.addEventListener("click", function (e) {
          var c = e.target.closest ? e.target.closest(".ttt-cell") : null;
          if (!c || over || turn !== "X") return;
          var i = +c.getAttribute("data-i");
          if (board[i]) return;
          place(i, "X");
          if (checkEnd()) return;
          turn = "O";
          setStatus("Thinking…");
          boardEl.classList.add("is-wait");
          renderScores();
          timer = setTimeout(aiMove, 380 + Math.random() * 320);
        });

        /* arrow keys walk the board; Escape goes back to the stats */
        game.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && game.classList.contains("is-playing")) { stopPlaying(); return; }
          var c = e.target.closest ? e.target.closest(".ttt-cell") : null;
          var d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
          if (!c || !d) return;
          e.preventDefault();
          var i = +c.getAttribute("data-i"), x = i % 3 + d[0], y = Math.floor(i / 3) + d[1];
          while (x >= 0 && x < 3 && y >= 0 && y < 3) {
            var n = cells[y * 3 + x];
            if (!n.disabled) { n.focus({ preventScroll: true }); return; }
            x += d[0]; y += d[1];
          }
        });

        function startPlaying() {
          game.classList.add("is-playing");
          playBtn.setAttribute("aria-expanded", "true");
          resetGame();
          setTimeout(function () { if (cells[4] && !cells[4].disabled) cells[4].focus({ preventScroll: true }); }, 520);
        }
        function stopPlaying() {
          clearTimeout(timer);
          game.classList.remove("is-playing");
          playBtn.setAttribute("aria-expanded", "false");
          playBtn.focus({ preventScroll: true });
        }
        function again() {
          resetGame();
          if (cells[4]) cells[4].focus({ preventScroll: true });
        }

        buildBoard();
        resetGame();
        playBtn.addEventListener("click", startPlaying);
        $("tttBack").addEventListener("click", stopPlaying);
        $("tttRestart").addEventListener("click", again);
        $("tttAgain").addEventListener("click", again);
      })();
    <\/script>
  </body>

        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(var(--paper), var(--paper)) top/100% 3px no-repeat,
          linear-gradient(var(--paper), var(--paper)) bottom/100% 3px no-repeat,
          linear-gradient(var(--paper), var(--paper)) left/3px 100% no-repeat,
          linear-gradient(var(--paper), var(--paper)) right/3px 100% no-repeat;
        box-shadow: inset 0 0 22px 4px var(--paper);
        opacity: 0.75;
      }
      .ph.ph--cert figcaption {
        margin: 12px 0 0;
        padding: 0.5rem 0.2rem 0.15rem;
      }

      /* ------------------------------------------------------------------
   CODE FIGURES (replacing images for projects)
   ------------------------------------------------------------------ */
      .code-figure {
        border: 1px solid var(--rule);
        background: var(--paper-card);
        padding: 1rem;
        margin-top: 1.2rem;
      }
      .code-figure figcaption {
        padding: 0.6rem 0.2rem 0.15rem;
        font-size: 0.78rem;
        font-style: italic;
        color: var(--ink-soft);
        border-top: 1px solid var(--rule-faint);
        margin-top: 1rem;
        line-height: 1.45;
      }
      .code-figure figcaption .credit {
        font-style: normal;
        font-family: var(--wire);
        font-size: 0.56rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        display: block;
        margin-top: 0.3rem;
        color: var(--ink-soft);
      }
      .code-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 1px solid var(--rule-faint);
        padding-bottom: 0.5rem;
        margin-bottom: 0.8rem;
      }
      .code-header .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink-soft);
      }
      .code-title {
        font-family: var(--wire);
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .code-body {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-family: var(--wire);
        font-size: 0.75rem;
        line-height: 1.6;
      }

      /* Terminal */
      .code-body.terminal {
        background: var(--ink);
        color: var(--paper);
        padding: 1rem;
        border: 1px solid var(--ink);
      }
      .terminal .prompt {
        color: var(--paper);
        opacity: 0.6;
      }
      .terminal .arrow {
        color: var(--paper);
        opacity: 0.8;
      }
      .terminal .hl {
        color: var(--paper);
        font-weight: 600;
      }
      .terminal .hl-green {
        color: var(--paper);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      /* UML */
      .code-body.uml {
        gap: 0.6rem;
      }
      .uml-box {
        border: 1px solid var(--ink);
        background: var(--paper);
      }
      .uml-header {
        background: var(--ink);
        color: var(--paper);
        font-weight: 600;
        font-size: 0.65rem;
        padding: 0.25rem 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .uml-row {
        padding: 0.25rem 0.5rem;
        font-size: 0.7rem;
        border-bottom: 1px dotted var(--rule-faint);
      }
      .uml-row:last-child {
        border-bottom: none;
      }
      .uml-inherits {
        text-align: center;
        font-size: 0.6rem;
        color: var(--ink-soft);
        letter-spacing: 0.1em;
      }

      /* Graph */
      .code-body.graph {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.5rem 0;
      }
      .graph-col {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .graph-node {
        border: 1px solid var(--ink);
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
        background: var(--paper);
      }
      .graph-edges {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        font-size: 0.6rem;
        color: var(--ink-soft);
        letter-spacing: -1px;
      }

      /* ------------------------------------------------------------------
   TOP STRIP + MASTHEAD
   ------------------------------------------------------------------ */
      .top-strip {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.55rem clamp(1.1rem, 3.4vw, 3rem) 0.5rem;
        border-bottom: 1px solid var(--rule);
        font-family: var(--wire);
        font-size: 0.58rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .masthead {
        position: relative;
        text-align: center;
        padding: clamp(1.2rem, 3vw, 2.2rem) clamp(1.1rem, 3.4vw, 3rem) clamp(0.9rem, 2vw, 1.4rem);
      }
      .masthead-grid {
        display: grid;
        grid-template-columns: 1fr;
        justify-items: center;
        align-items: center;
        gap: 1rem;
      }

      .mast-title {
        font-family: var(--blackletter);
        font-weight: 700;
        font-size: clamp(2.5rem, 7.4vw, 5.6rem);
        line-height: 1.02;
        letter-spacing: 0.005em;
      }

      .dateline {
        display: flex;
        justify-content: space-between;
        gap: 0.8rem;
        flex-wrap: wrap;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        margin-top: 0.8rem;
        padding: 0.4rem 0.1rem;
        font-family: var(--wire);
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .dateline b {
        color: var(--ink);
        font-weight: 600;
      }

      /* Late-edition stamp - the single red mark in the paper */
      .stamp {
        position: absolute;
        top: 14px;
        right: clamp(1rem, 3vw, 2.4rem);
        transform: rotate(-7deg);
        border: 2px solid var(--red);
        color: var(--red);
        font-family: var(--wire);
        font-size: 0.56rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        padding: 0.35rem 0.6rem 0.3rem;
        line-height: 1.5;
        opacity: 0.85;
        outline: 1px solid var(--red);
        outline-offset: 2px;
      }
      @media (max-width: 760px) {
      }

      /* Section nav */
      .section-nav {
        border-bottom: 3px double var(--rule);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .section-nav::-webkit-scrollbar {
        display: none;
      }
      .section-nav ul {
        display: flex;
        justify-content: center;
        min-width: max-content;
        margin: 0 auto;
      }
      .section-nav a {
        display: block;
        padding: 0.7rem clamp(0.8rem, 1.8vw, 1.4rem);
        font-family: var(--wire);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        white-space: nowrap;
        border-right: 1px solid var(--rule-soft);
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .section-nav li:first-child a {
        border-left: 1px solid var(--rule-soft);
      }
      .section-nav a:hover,
      .section-nav a[aria-current="true"] {
        background: var(--ink);
        color: var(--paper);
      }

      /* ------------------------------------------------------------------
   FRONT PAGE
   ------------------------------------------------------------------ */
      .front {
        padding-bottom: 2rem;
      }

      /* Contents strip - the old Index, now a horizontal rail */
      .contents-strip {
        display: flex;
        align-items: baseline;
        gap: 1.1rem;
        flex-wrap: wrap;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        padding: 0.55rem 0.1rem;
        margin-bottom: clamp(1.2rem, 2.4vw, 1.9rem);
      }

      .front-grid {
        display: grid;
        grid-template-columns: minmax(0, 2.05fr) minmax(0, 1fr);
        gap: 0;
      }
      .front-col--main {
        padding-right: clamp(0.9rem, 1.8vw, 1.6rem);
      }
      .front-col--rail {
        padding-left: clamp(0.9rem, 1.8vw, 1.6rem);
        border-left: 1px solid var(--rule-soft);
      }

      /* Lead story */
      .lead-hed {
        font-family: var(--display);
        font-weight: 900;
        font-size: clamp(2rem, 4.6vw, 3.9rem);
        line-height: 1.04;
        letter-spacing: -0.005em;
        text-transform: uppercase;
        margin: 0.5rem 0 0.8rem;
      }
      .lead-dek {
        font-family: var(--display);
        font-style: italic;
        font-weight: 600;
        font-size: clamp(1rem, 1.6vw, 1.25rem);
        line-height: 1.45;
        color: var(--ink-soft);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        padding: 0.7rem 0;
        margin-bottom: 0.9rem;
      }
      .byline {
        font-family: var(--wire);
        font-size: 0.6rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-bottom: 1rem;
        color: var(--ink-soft);
      }
      .byline b {
        color: var(--ink);
        font-weight: 600;
      }

      .article-body p {
        margin-bottom: 0.95rem;
        text-align: justify;
        hyphens: auto;
      }
      .dropcap::first-letter {
        font-family: var(--display);
        font-weight: 900;
        font-size: 4.1em;
        line-height: 0.78;
        float: left;
        padding: 0.06em 0.1em 0 0;
        color: var(--ink);
      }
      .article-body--cols {
        column-count: 2;
        column-gap: 2rem;
        column-rule: 1px solid var(--rule-soft);
      }

      /* Side stories */
      .side-story {
        padding-bottom: 1rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--rule-soft);
      }
      .side-story:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .side-hed {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(1.05rem, 1.5vw, 1.3rem);
        line-height: 1.15;
        margin: 0.45rem 0 0.5rem;
      }
      .side-hed a:hover {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      .side-body {
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--ink);
      }

      .stat-box {
        border: 1px solid var(--rule);
        text-align: center;
        padding: 0.85rem 0.8rem 0.8rem;
        margin: 0.6rem 0;
        background: var(--paper-card);
      }
      .stat-box .figure {
        font-family: var(--display);
        font-weight: 900;
        font-size: 2.6rem;
        line-height: 1;
      }
      .stat-box .label {
        font-family: var(--wire);
        font-size: 0.55rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-top: 0.35rem;
        color: var(--ink-soft);
        display: block;
      }

      /* Numbers band */
      .numbers-band {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--rule);
        border-left: none;
        margin-top: 1.9rem;
      }
      .numbers-band > div {
        border-left: 1px solid var(--rule);
        padding: 0.9rem 0.8rem 0.85rem;
        text-align: center;
      }
      .numbers-band .figure {
        font-family: var(--display);
        font-weight: 900;
        font-size: clamp(1.6rem, 2.8vw, 2.4rem);
        line-height: 1;
      }
      .numbers-band .label {
        font-family: var(--wire);
        font-size: 0.53rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        display: block;
        margin-top: 0.45rem;
        line-height: 1.6;
      }

      /* In Brief band */
      .inbrief-band {
        border-top: 3px double var(--rule);
        margin-top: 1.9rem;
        padding-top: 0.85rem;
      }
      .briefs--row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--rule-faint);
        margin-top: 0.7rem;
      }
      .briefs--row li {
        padding: 0.85rem 1.3rem;
        border-bottom: none;
        border-left: 1px solid var(--rule-faint);
        font-size: 0.94rem;
        line-height: 1.6;
      }
      .briefs--row li:first-child {
        border-left: none;
        padding-left: 0;
      }
      .briefs--row li:last-child {
        padding-right: 0;
      }
      .briefs .tag {
        font-family: var(--wire);
        font-size: 0.52rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        display: block;
        margin-bottom: 0.2rem;
      }
      .briefs b {
        font-family: var(--display);
        font-weight: 700;
        letter-spacing: 0.01em;
      }

      /* The Wire */
      .wire {
        border-top: 3px double var(--rule);
        border-bottom: 1px solid var(--rule);
        margin-top: 1.9rem;
        display: flex;
        align-items: stretch;
        overflow: hidden;
      }
      @keyframes wire {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      /* ------------------------------------------------------------------
   PAGE 02 - PROFILE
   ------------------------------------------------------------------ */
      .profile-grid {
        display: grid;
        grid-template-columns: minmax(240px, 0.9fr) minmax(0, 1.7fr);
        gap: clamp(1.4rem, 3vw, 2.6rem);
      }
      .profile-rail {
        position: relative;
      }
      .profile-rail .ph {
        margin-bottom: 1.2rem;
      }

      .facts {
        border: 1px solid var(--rule);
        background: var(--paper-card);
      }
      .facts h3 {
        font-family: var(--display);
        font-weight: 800;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-align: center;
        border-bottom: 1px solid var(--rule);
        padding: 0.5rem 0 0.4rem;
      }
      .facts dl {
        padding: 0.5rem 0.9rem 0.6rem;
      }
      .facts .row {
        display: flex;
        gap: 0.7rem;
        padding: 0.42rem 0;
        border-bottom: 1px dotted var(--rule-faint);
        font-size: 0.82rem;
        line-height: 1.45;
      }
      .facts .row:last-child {
        border-bottom: none;
      }
      .facts dt {
        font-family: var(--wire);
        font-size: 0.55rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        width: 5.6rem;
        flex-shrink: 0;
        padding-top: 0.2rem;
      }
      .facts dd {
        flex: 1;
      }

      .profile-hed {
        font-family: var(--display);
        font-weight: 900;
        font-size: clamp(1.9rem, 4vw, 3.1rem);
        line-height: 1.05;
        text-transform: uppercase;
        margin: 0.4rem 0 0.7rem;
      }
      .profile-dek {
        font-family: var(--display);
        font-style: italic;
        font-weight: 600;
        font-size: clamp(0.98rem, 1.5vw, 1.2rem);
        color: var(--ink-soft);
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.8rem;
        margin-bottom: 1.1rem;
      }

      .pullquote {
        border-top: 4px double var(--rule);
        border-bottom: 4px double var(--rule);
        padding: 1.1rem 0.5rem;
        margin: 1.6rem 0;
        text-align: center;
        font-family: var(--display);
        font-style: italic;
        font-weight: 600;
        font-size: clamp(1.15rem, 2.2vw, 1.55rem);
        line-height: 1.4;
      }
      .pullquote cite {
        display: block;
        margin-top: 0.6rem;
        font-family: var(--wire);
        font-style: normal;
        font-size: 0.56rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .fields {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1.6rem;
        border-top: 1px solid var(--rule);
        margin-top: 1.4rem;
        padding-top: 0.9rem;
      }
      .fields li {
        font-family: var(--wire);
        font-size: 0.6rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding-left: 1rem;
        position: relative;
      }
      .fields li::before {
        content: "-";
        position: absolute;
        left: 0;
      }

      /* ------------------------------------------------------------------
   PAGE 03 - TECHNOLOGY DESK
   ------------------------------------------------------------------ */
      .story {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: clamp(1.4rem, 3vw, 2.6rem);
        padding: clamp(1.3rem, 2.4vw, 2rem) 0;
        border-top: 1px solid var(--rule);
      }
      .story:first-of-type {
        border-top: none;
        padding-top: 0.2rem;
      }
      .story--rev {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      }
      .story--rev .story-text {
        order: 2;
      }
      .story--rev .story-media {
        order: 1;
      }

      .story-hed {
        font-family: var(--display);
        font-weight: 900;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        line-height: 1.07;
        text-transform: uppercase;
        margin: 0.5rem 0 0.6rem;
      }
      .story-dek {
        font-family: var(--display);
        font-style: italic;
        font-weight: 600;
        font-size: 1.02rem;
        color: var(--ink-soft);
        margin-bottom: 0.9rem;
        line-height: 1.45;
      }
      .spec-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1.2rem;
        font-size: 0.8rem;
      }
      .spec-table caption {
        font-family: var(--wire);
        font-size: 0.56rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: left;
        color: var(--ink-soft);
        padding-bottom: 0.4rem;
        caption-side: top;
      }
      .spec-table tr {
        border-top: 1px solid var(--rule-soft);
      }
      .spec-table tr:last-child {
        border-bottom: 1px solid var(--rule-soft);
      }
      .spec-table th,
      .spec-table td {
        padding: 0.42rem 0.4rem;
        text-align: left;
        vertical-align: top;
      }
      .spec-table th {
        font-family: var(--wire);
        font-size: 0.55rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 500;
        width: 7.5rem;
      }
      .spec-table td {
        font-family: var(--wire);
        font-size: 0.68rem;
        letter-spacing: 0.03em;
      }
      .source-link {
        display: inline-block;
        margin-top: 1.1rem;
        font-family: var(--wire);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        border: 1px solid var(--rule);
        padding: 0.55rem 0.9rem;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .source-link:hover {
        background: var(--ink);
        color: var(--paper);
      }

      .diagram {
        border: 1px solid var(--rule);
        background: var(--paper-card);
        margin-top: 1.2rem;
      }
      .diagram h4 {
        font-family: var(--wire);
        font-size: 0.56rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--rule);
        padding: 0.5rem 0.8rem;
        color: var(--ink-soft);
      }
      .diagram ol {
        padding: 0.6rem 0.8rem 0.7rem;
      }
      .diagram li {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
        font-family: var(--wire);
        font-size: 0.63rem;
        letter-spacing: 0.04em;
        padding: 0.3rem 0;
        border-bottom: 1px dotted var(--rule-faint);
      }
      .diagram li:last-child {
        border-bottom: none;
      }
      .diagram .arr {
        color: var(--ink-soft);
        flex-shrink: 0;
      }
      .diagram .node {
        font-weight: 600;
      }
      .diagram .note {
        color: var(--ink-soft);
      }

      /* ------------------------------------------------------------------
   PAGE 04 - SPECIAL REPORT
   ------------------------------------------------------------------ */
      .report {
        background: var(--paper-deep);
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .report .page {
        padding-top: clamp(1.6rem, 3vw, 2.6rem);
        padding-bottom: clamp(1.8rem, 3.4vw, 2.8rem);
      }

      .report-hed {
        font-family: var(--display);
        font-weight: 900;
        text-transform: uppercase;
        font-size: clamp(2rem, 4.6vw, 3.6rem);
        line-height: 1.03;
        max-width: 20ch;
        margin: 0.5rem auto 0.8rem;
        text-align: center;
      }
      .report-dek {
        font-family: var(--display);
        font-style: italic;
        font-weight: 600;
        font-size: clamp(1rem, 1.7vw, 1.25rem);
        color: var(--ink-soft);
        text-align: center;
        max-width: 52ch;
        margin: 0 auto 1.3rem;
        line-height: 1.45;
      }

      .report-meta {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--rule);
        margin-bottom: 1.8rem;
        background: var(--paper-card);
      }
      .report-meta > div {
        padding: 0.7rem 0.9rem;
        border-left: 1px solid var(--rule);
      }
      .report-meta > div:first-child {
        border-left: none;
      }
      .report-meta dt {
        font-family: var(--wire);
        font-size: 0.53rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 0.3rem;
      }
      .report-meta dd {
        font-family: var(--wire);
        font-size: 0.68rem;
        line-height: 1.5;
      }

      <!-- ============================================================

      <section id="case-study" class="report" aria-label="Special report - CodeJudge">
        <div class="page">
          <div class="folio">
            <span><b>Page 04</b></span
            ><span>The Yuvraj Verma Chronicle</span><span>Special Report</span>
          </div>
          <p class="kicker reveal" style="text-align: center">Special Report · Case Study No. 1</p>
          <h2 class="report-hed reveal">Running Untrusted Code at Scale</h2>
          <p class="report-dek reveal">
            CodeJudge - a distributed coding assessment platform · Spring Boot · RabbitMQ · Docker.
            Five findings, entered in full.
          </p>

          <dl class="report-meta reveal">
            <div>
              <dt>Role</dt>
              <dd>Design + full-stack implementation</dd>
            </div>
            <div>
              <dt>Stack</dt>
              <dd>Spring Boot · RabbitMQ · Docker · PostgreSQL · Monaco</dd>
            </div>
            <div>
              <dt>Result</dt>
              <dd>Async judge for Python, Java &amp; C++</dd>
            </div>
            <div>
              <dt>Deploy</dt>
              <dd>One-click Docker Compose · 12 pre-loaded problems</dd>
            </div>
          </dl>

          <dl class="report-steps reveal">
            <div class="report-step">
              <dt><span class="step-no">01</span><span class="step-name">Problem</span></dt>
              <dd>
                <h4>Synchronous judging does not scale.</h4>
                <p>
                  Most coding platforms run submissions inline. The request thread blocks while the
                  compiler runs and the test cases execute, which under load leads to queue buildup,
                  timeouts, and a broken experience for the user. And once you run code that someone
                  else wrote, you are already dealing with security.
                </p>
              </dd>
            </div>
            <div class="report-step">
              <dt><span class="step-no">02</span><span class="step-name">Approach</span></dt>
              <dd>
                <h4>Decouple submission from execution.</h4>
                <p>
                  The submission endpoint only validates and enqueues. It saves the submission in
                  PostgreSQL with the verdict <code>PENDING</code>, and publishes its ID to a
                  RabbitMQ queue. A judge worker consumes the message, writes the code to a
                  temporary directory, runs it inside an isolated Docker container, compares the
                  output against visible and hidden test cases, and writes the final verdict back.
                  The frontend polls the submission until the verdict arrives. Spring Boot handles
                  the API, and PostgreSQL holds users, problems, submissions and test cases.
                </p>
              </dd>
            </div>
            <div class="report-step">
              <dt><span class="step-no">03</span><span class="step-name">Decision</span></dt>
              <dd>
                <h4>Sandbox everything, trust nothing.</h4>
                <p>
                  Every submission runs in a fresh container with networking disabled and hard
                  resource limits: 128MB of memory and 0.5 CPU for Python, 512MB and 1.5 CPU for
                  Java and C++, plus an execution timeout. This costs latency, but you cannot run
                  arbitrary user code on the same machine that holds your database. It is the
                  decision he would defend hardest in review, and the trade-off is deliberate.
                </p>
              </dd>
            </div>
            <div class="report-step">
              <dt><span class="step-no">04</span><span class="step-name">Outcome</span></dt>
              <dd>
                <h4>Async, multi-language, and instructor-friendly.</h4>
                <p>
                  The platform supports three languages (Python, Java and C++) and judges
                  submissions asynchronously with verdicts of ACCEPTED, WRONG_ANSWER or
                  RUNTIME_ERROR, along with the recorded execution time. Twelve pre-loaded problems
                  ship with visible and hidden test cases; role-based access separates admins from
                  users; the admin dashboard lets instructors create, edit and delete problems and
                  test cases without touching the codebase. The candidate interface is a real
                  terminal, so the assessment feels like the tools engineers already use.
                </p>
              </dd>
            </div>
            <div class="report-step">
              <dt><span class="step-no">05</span><span class="step-name">Next</span></dt>
              <dd>
                <h4>What would be carried forward.</h4>
                <p>
                  Replace polling with WebSocket live verdicts and move to stateless JWT
                  authentication. Store submission history in the database instead of local storage,
                  add Redis caching for problems and test cases, and scale out with multiple judge
                  workers on Kubernetes behind a CI/CD pipeline. He would also harden the sandbox
                  further, because the security model is never finished.
                </p>
              </dd>
            </div>
          </dl>
        </div>
      </section>

            <h3 class="story-hed" style="font-size: clamp(1.7rem, 3.4vw, 2.7rem)">
              Qualify the Prospect, Then Pitch
            </h3>
            <dl class="report-meta" style="grid-template-columns: repeat(3, 1fr)">
              <div>
                <dt>Role</dt>
                <dd>Head of Sponsorship Domain</dd>
              </div>
              <div>
                <dt>Window</dt>
                <dd>Oct 2025 → Mar 2026</dd>
              </div>
              <div>
                <dt>Result</dt>
                <dd>5× growth in the sponsorship vertical</dd>
              </div>
            </dl>

            <div class="campus-steps">
              <div class="campus-step">
                <span class="no">01 / Problem</span>
                <div>
                  <h4>Prospect conversion was the broken step.</h4>
                  <p>
                    The workflow looked straightforward on paper: identify prospects, assign them to
                    team members, make calls, send emails, follow up, close the sponsorship, and
                    hand the agreed deliverables to the event teams. Prospects and follow-ups were
                    tracked in Google Sheets and reviewed in weekly meetings. Conversion stayed flat
                    because everyone received the same generic pitch: “we are organising an
                    entrepreneurship summit; would you like to sponsor us?” The calls and emails
                    went out quickly, yet companies had little reason to respond. The operation was
                    optimised for the number of companies contacted rather than for whether a
                    company had a specific reason to take part.
                  </p>
                </div>
              </div>
              <div class="campus-step">
                <span class="no">02 / The Fix</span>
                <div>
                  <h4>Research before outreach.</h4>
                  <p>
                    The workflow changed so that prospect research became part of the process,
                    before anyone reached out. Instead of one pitch for every company, something
                    specific was identified about each one that could connect to the student
                    audience. Approaching a major consumer brand, the team tied a seasonal campaign
                    it was already running to the student audience and positioned E-Summit as a
                    campus opportunity to activate that campaign. Similar company-specific
                    approaches were used with other prospects. At the same time, specialised
                    outreach was split across the team - some members handled banks and PSUs through
                    offline outreach, while others focused on gaming partnerships.
                  </p>
                </div>
              </div>
              <div class="campus-step">
                <span class="no">03 / Second Failure</span>
                <div>
                  <h4>The workflow broke again after the close.</h4>
                  <p>
                    A second problem appeared once sponsors signed on. On event day the workflow
                    became error-prone: each sponsor could have multiple commitments - branding,
                    activations, placements and other agreed benefits - and missing one could delay
                    or affect the final payment. Fulfilment required coordination across different
                    event teams, so the sponsorship vertical had to track what had been promised and
                    whether each item had actually been delivered.
                  </p>
                </div>
              </div>
              <div class="campus-step">
                <span class="no">04 / Constraint</span>
                <div>
                  <h4>March is the wrong month.</h4>
                  <p>
                    There was also a constraint that could not be fully worked around: E-Summit
                    happens in March, close to the end of the financial year. Some companies were
                    already closing their budgets and their sponsorship decisions, which meant that
                    even interested companies sometimes could not complete the process within the
                    timeline. The constraint could not be removed, but knowing it let the team
                    prioritise the prospects who could still move in time.
                  </p>
                </div>
              </div>
              <div class="campus-step">
                <span class="no">05 / Outcome</span>
                <div>
                  <h4>Same team, different shape of work.</h4>
                  <p>
                    Fixing the workflow from scratch would begin with prospect qualification and
                    personalisation. Increasing outreach volume would only have made the first
                    problem larger - more generic pitches to companies with no clear reason to
                    respond. Once the way prospects were selected and approached changed, conversion
                    improved without simply increasing the number of calls and emails. The overall
                    sponsorship vertical grew 5× compared with the previous edition.
                  </p>
                </div>
              </div>
            </div>

<script>
(function(){
'use strict';

const CFG      = JSON.parse(document.getElementById('cfg').textContent);
const DESIGNS  = CFG.designs;
const BY       = {}; DESIGNS.forEach(d => BY[d.id] = d);
const SECTIONS = CFG.sections;          // ids shared by all three designs
const PROBE    = 0.35;                  // the "you are here" line, as a fraction of viewport height

const $stage = document.getElementById('stage');
const $scrim = document.getElementById('scrim');
const $ring  = document.getElementById('ring');
const $sw    = document.getElementById('switcher');
const $live  = document.getElementById('live');
const $theme = document.getElementById('themeColor');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');

const S = {};                 // id -> { d, layer, frame, ready, loaded, maxY }
let current = null, busy = false, pending = null, lastPointer = null;
let $thumb;

const clamp  = (v,a,b) => Math.min(b, Math.max(a, v));
const sleep  = ms => new Promise(r => setTimeout(r, ms));
const frames = n => new Promise(r => requestAnimationFrame(() => n > 1 ? frames(n-1).then(r) : r()));

/* ── remember / restore ─────────────────────────────────────────── */
function initialId(){
  const h = location.hash.replace('#','').toLowerCase();
  if (BY[h]) return h;
  return CFG.default;
}
function remember(id){
}

/* ── layers ─────────────────────────────────────────────────────── */
function create(id){
  if (S[id]) return S[id];
  const d = BY[id];
  const layer = document.createElement('div');
  layer.className = 'layer';
  layer.inert = true;
  layer.setAttribute('aria-hidden','true');

  const frame = document.createElement('iframe');
  frame.title = d.name + ' design of the portfolio';
  const holder = document.getElementById('doc-' + id);
  // The design is stored as plain HTML text. Inside it, a closing script tag is written as
  // <\/script> so the browser does not end the storage block early; undo that here.
  frame.srcdoc = holder.textContent.replace(/<\\\/script/gi, '</script').trim();
  holder.remove();                                  // free the duplicate string

  const rec = { d, layer, frame, loaded:false, maxY:0 };
  rec.ready = new Promise(res => frame.addEventListener('load', () => {
    rec.loaded = true;
    try {
      frame.contentWindow.addEventListener('scroll', () => {
        rec.maxY = Math.max(rec.maxY, frame.contentWindow.scrollY || 0);
      }, { passive:true });
    } catch(e){}
    res(rec);
  }, { once:true }));

  layer.appendChild(frame);
  $stage.appendChild(layer);
  S[id] = rec;
  return rec;
}
function markCurrent(rec){
  rec.layer.classList.add('is-current');
  rec.layer.inert = false;
  rec.layer.removeAttribute('aria-hidden');
}
function markIdle(rec){
  rec.layer.classList.remove('is-current');
  rec.layer.inert = true;
  rec.layer.setAttribute('aria-hidden','true');
}

/* ── where is the reader? (same section, same relative depth) ──── */
function layout(frame){
  const w = frame.contentWindow, doc = frame.contentDocument, sy = w.scrollY;
  const arr = [];
  SECTIONS.forEach(id => {
    const el = doc.getElementById(id);
    if (el) arr.push({ id, top: el.getBoundingClientRect().top + sy });
  });
  arr.sort((a,b) => a.top - b.top);
  const docH = doc.documentElement.scrollHeight;
  arr.forEach((s,i) => s.end = i < arr.length-1 ? arr[i+1].top : docH);
  return { arr, sy, vh:w.innerHeight, docH };
}
function readPosition(frame){
  const L = layout(frame);
  if (!L.arr.length) return null;
  const probeY = L.sy + L.vh * PROBE;
  let cur = L.arr[0];
  L.arr.forEach(s => { if (s.top <= probeY) cur = s; });
  return {
    id: cur.id,
    frac: clamp((probeY - cur.top) / Math.max(1, cur.end - cur.top), 0, 1),
    atTop: L.sy < 4,
    atBottom: L.sy + L.vh >= L.docH - 4
  };
}
function targetFor(frame, pos){
  if (!pos || pos.atTop) return 0;
  const L = layout(frame), max = Math.max(0, L.docH - L.vh);
  if (pos.atBottom) return max;
  const s = L.arr.find(x => x.id === pos.id);
  if (!s) return 0;
  return clamp(s.top + pos.frac * (s.end - s.top) - L.vh * PROBE, 0, max);
}
/* Scroll-triggered reveals only fire for what is scrolled past, so walk the
   hidden page down to just above the target before jumping the last screen. */
async function warm(rec, targetY){
  const w = rec.frame.contentWindow, vh = w.innerHeight;
  const goal = targetY - vh * 0.8;      // the last pass reaches the landing point's own reveal zone
  if (goal <= rec.maxY) return;
  let y = rec.maxY;
  const t0 = performance.now();
  while (y < goal && performance.now() - t0 < 1100){
    y = Math.min(y + vh * 0.8, goal);
    w.scrollTo({ top:y, behavior:'instant' });
    await frames(2);
  }
}

/* ── switcher UI ────────────────────────────────────────────────── */
function buildSwitcher(){
  const track = document.createElement('div');
  track.className = 'sw-track';
  track.setAttribute('role','radiogroup');
  track.setAttribute('aria-label','Design');
  $thumb = document.createElement('span');
  $thumb.className = 'sw-thumb';
  $thumb.setAttribute('aria-hidden','true');
  track.appendChild($thumb);

  DESIGNS.forEach((d,i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw-btn';
    b.dataset.id = d.id;
    b.setAttribute('role','radio');
    b.title = d.name + ' (press ' + (i+1) + ')';
    b.innerHTML = '<span class="n">0' + (i+1) + '</span><span>' + d.name + '</span>';
    b.addEventListener('click', e => {
      const fromPointer = e.detail > 0;             // 0 = keyboard "click"
      const r = b.getBoundingClientRect();
      switchTo(d.id, fromPointer
        ? { x:e.clientX, y:e.clientY, pointer:true }
        : { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false });
    });
    b.addEventListener('keydown', e => {
      const keys = { ArrowLeft:-1, ArrowUp:-1, ArrowRight:1, ArrowDown:1 };
      let i2 = null;
      if (e.key in keys) i2 = (i + keys[e.key] + DESIGNS.length) % DESIGNS.length;
      else if (e.key === 'Home') i2 = 0;
      else if (e.key === 'End')  i2 = DESIGNS.length - 1;
      if (i2 === null) return;
      e.preventDefault();
      const nb = track.children[i2 + 1];            // +1: thumb is first child
      nb.focus();
      const r = nb.getBoundingClientRect();
      switchTo(DESIGNS[i2].id, { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false });
    });
    track.appendChild(b);
  });
  $sw.appendChild(track);

  /* wheel over the pill should still scroll the page behind it */
  $sw.addEventListener('wheel', e => {
    e.preventDefault();
    const rec = S[current];
    if (!rec || !rec.loaded) return;
    const w = rec.frame.contentWindow, root = w.document.documentElement;
    if (root.classList.contains('lenis')){
      root.dispatchEvent(new w.WheelEvent('wheel', {
        deltaX:e.deltaX, deltaY:e.deltaY, deltaMode:e.deltaMode,
        clientX:e.clientX, clientY:e.clientY, bubbles:true, cancelable:true
      }));
    } else {
      w.scrollBy({ top:e.deltaY, left:e.deltaX, behavior:'instant' });
    }
  }, { passive:false });
}
function setPill(id){
  $sw.dataset.design = id;
  $sw.querySelectorAll('.sw-btn').forEach(b => {
    const on = b.dataset.id === id;
    b.setAttribute('aria-checked', on);
    b.tabIndex = on ? 0 : -1;
  });
  placeThumb();
}
function placeThumb(){
  const b = $sw.querySelector('.sw-btn[aria-checked="true"]');
  if (!b || !$thumb) return;
  $thumb.style.width = b.offsetWidth + 'px';
  $thumb.style.transform = 'translateX(' + b.offsetLeft + 'px)';
}
function applyChrome(id){
  const d = BY[id];
  document.documentElement.style.setProperty('--page-bg', d.bg);
  $theme.content = d.bg;
  document.title = d.title;
}

/* ── THE SWITCH ─────────────────────────────────────────────────── */
async function switchTo(id, origin){
  if (!BY[id]) return;
  if (id === current){ pending = null; setPill(current); return; }   // changed their mind
  if (busy){ pending = { id, origin }; setPill(id); return; }
  busy = true;

  const fromId = current;
  const from = S[fromId], to = create(id), toD = to.d;
  current = id;
  setPill(id);
  remember(id);
  $live.textContent = toD.name + ' design';

  $sw.classList.add('loading');
  await to.ready;

  const W = innerWidth, H = innerHeight;
  let pt = origin;
  if (!pt){
    const r = $sw.getBoundingClientRect();
    pt = { x:r.left + r.width/2, y:r.top + r.height/2, pointer:false };
  }
  const x = pt.x, y = pt.y;
  lastPointer = pt.pointer ? { x, y } : null;

  /* 1 ─ work out where the reader is, and where that is in the new design */
  let targetY = 0;
  try { targetY = targetFor(to.frame, readPosition(from.frame)); } catch(e){}

  /* 2 ─ position the incoming design while it is still hidden
         (browsers stop running scroll observers in a fully clipped frame) */
  markIdle(from);
  from.layer.style.visibility = 'visible';
  const L = to.layer;
  const tw = to.frame.contentWindow;
  try {
    await warm(to, targetY);
    tw.scrollTo({ top:targetY, behavior:'instant' });
  } catch(e){}
  await frames(2);
  $sw.classList.remove('loading');

  /* …then stage it: on top, clipped to nothing */
  L.style.zIndex = 3;
  L.style.visibility = 'visible';
  if (!reduced.matches) L.style.clipPath = 'circle(0px at ' + x + 'px ' + y + 'px)';
  else L.style.opacity = 0;

  /* 3 ─ play it */
  const anims = [];
  let dur;
  if (reduced.matches){
    dur = 260;
    anims.push(L.animate([{opacity:0},{opacity:1}], { duration:dur, easing:'ease-out', fill:'both' }));
    setTimeout(() => applyChrome(id), dur * 0.4);
  } else {
    const R = Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) + 4;
    dur = Math.round(clamp(R * 0.55 + 520, 820, 1150));
    const o = { duration:dur, easing:'cubic-bezier(.77,0,.18,1)', fill:'both' };
    const at = 'at ' + x + 'px ' + y + 'px';

    anims.push(L.animate(
      [{ clipPath:'circle(0px ' + at + ')' }, { clipPath:'circle(' + R + 'px ' + at + ')' }], o));
    anims.push(to.frame.animate(
      [{ transform:'scale(1.07)' }, { transform:'scale(1)' }], o));
    anims.push(from.frame.animate(
      [{ transform:'scale(1)' }, { transform:'scale(.93)' }], o));
    anims.push($scrim.animate(
      [{ opacity:0 }, { opacity:.6 }], o));

    $ring.style.setProperty('--ring', toD.accent);
    $ring.style.width  = $ring.style.height = (R * 2) + 'px';
    $ring.style.left   = (x - R) + 'px';
    $ring.style.top    = (y - R) + 'px';
    anims.push($ring.animate([
      { transform:'scale(0)',  opacity:1, offset:0 },
      { transform:'scale(.8)', opacity:1, offset:.8 },
      { transform:'scale(1)',  opacity:0, offset:1 }
    ], o));

    setTimeout(() => applyChrome(id), dur * 0.42);
  }

  try { await Promise.all(anims.map(a => a.finished)); } catch(e){}

  /* 4 ─ settle: incoming becomes the page, outgoing goes to sleep */
  L.style.clipPath = ''; L.style.zIndex = ''; L.style.visibility = ''; L.style.opacity = '';
  markCurrent(to);
  from.layer.style.visibility = '';
  anims.forEach(a => { try { a.cancel(); } catch(e){} });
  applyChrome(id);

  if (lastPointer){
    try {
      tw.dispatchEvent(new tw.MouseEvent('mousemove',
        { clientX:lastPointer.x, clientY:lastPointer.y, bubbles:true }));
    } catch(e){}
  }
  if (pt.pointer){ try { document.activeElement && document.activeElement.blur(); tw.focus(); } catch(e){} }

  busy = false;
  if (pending){
    const p = pending; pending = null;
    if (p.id !== current) switchTo(p.id, p.origin);
  }
}

/* ── shortcuts: 1 / 2 / 3, also relayed from inside the designs ── */
function shortcut(key){
  const i = ['1','2','3'].indexOf(key);
  if (i < 0 || !DESIGNS[i]) return;
  switchTo(DESIGNS[i].id, null);
}
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  shortcut(e.key);
});
window.addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.__portfolioSwitch) return;
  const ok = Object.keys(S).some(k => S[k].frame.contentWindow === e.source);
  if (ok) shortcut(m.key);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','').toLowerCase();
  if (BY[h] && h !== current) switchTo(h, null);
});
window.addEventListener('resize', placeThumb);

/* ── boot ───────────────────────────────────────────────────────── */
current = initialId();
applyChrome(current);
$sw.classList.add('no-anim');
buildSwitcher();
$sw.addEventListener('pointerdown',()=>$sw.classList.add('touched'),{once:true});
setPill(current);
const settle = () => { placeThumb(); frames(2).then(() => $sw.classList.remove('no-anim')); };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle); else settle();

const first = create(current);
markCurrent(first);

if (CFG.preload){
  first.ready.then(async () => {
    await sleep(CFG.preloadDelay);
    await new Promise(r => 'requestIdleCallback' in window ? requestIdleCallback(r, { timeout:2500 }) : r());
    for (const d of DESIGNS){
      if (S[d.id]) continue;
      await create(d.id).ready;
      await sleep(350);
    }
  });
}

})();
</script>
